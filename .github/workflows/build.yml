name: Build

on:
  push:
    branches:
      # 发布线分支(本仓已无 main 分支;origin/HEAD 默认分支即此分支)。
      # 原先写的 `main` 是不存在的分支 → push 过滤与下方自动打 tag 永远不生效。
      - 'multi-1.20.1-1.21.1'
      # 26.1.2 第三条线:2026-09-17 起已与发布线同树(该分支保留为历史/回滚入口)。
      # 它同样跑 lang 同步 + 三子项目构建,并且它的 jar 会**一并附到发布线的 Release**(见文末三 jar 步骤);
      # 打 tag / 建 Release 这两步仍**只在发布线分支**(multi-1.20.1-1.21.1)触发 —— 26.1.2 的版本号
      # 形如 `1.2.1-beta+neoforge_26.1.2`,不是裸 x.y.z,按发布规范不会(也不应)生成独立 tag。
      - 'multi-26.1.2-neoforge'
    tags:
      # 发布规范:tag 使用不含后缀的基础版本号(如 1.1.3),禁止 v 前缀与 +加载器后缀
      - '[0-9]*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21 (1.21.1 NeoForge)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup JDK 17 (1.20.1 Forge)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup JDK 25 (26.1.2 NeoForge)
        # MC 26.1.2 的 javaVersion = java-runtime-epsilon / majorVersion 25(1.21.1 为 21),
        # 故第三子项目的 toolchain 必须是 25;若本步未提供,根项目 foojay 解析器会自行下载。
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check lang sync (neoforge-1.21.1)
        run: pwsh -NoProfile -File tools/check_lang_sync.ps1 -LangDir neoforge-1.21.1/src/main/resources/assets/astral_dice/lang

      - name: Check lang sync (forge-1.20.1)
        run: pwsh -NoProfile -File tools/check_lang_sync.ps1 -LangDir forge-1.20.1/src/main/resources/assets/astral_dice/lang

      - name: Check lang sync (neoforge-26.1.2)
        run: pwsh -NoProfile -File tools/check_lang_sync.ps1 -LangDir neoforge-26.1.2/src/main/resources/assets/astral_dice/lang

      - name: Build with Gradle (all targets)
        run: ./gradlew build

      - name: Upload Astral Dice JARs
        uses: actions/upload-artifact@v4
        with:
          name: astral_dice-jars
          path: |
            neoforge-1.21.1/build/libs/astral_dice-*.jar
            forge-1.20.1/build/libs/astral_dice-*.jar
            neoforge-26.1.2/build/libs/astral_dice-*.jar

      - name: Read base version
        id: version
        run: |
          VERSION=$(grep '^mod_version=' neoforge-1.21.1/gradle.properties | cut -d'=' -f2)
          # tag = 基础版本号:先剥掉 +加载器 后缀(1.2.0+neoforge_1.21.1 → 1.2.0),再剥 -rc/-pre。
          # ⚠️ 必须两条都剥:只剥 '-' 时,`1.2.0+neoforge_1.21.1` 不含 '-' → tag 会原样带上 '+后缀'。
          BASE=${VERSION%%+*}
          BASE=${BASE%%-*}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          # 守门:base 必须是裸 x.y.z,否则不打 tag(避免再次出现不合规 tag)
          if [[ "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "skip_tag=0" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::base version '$BASE' is not a bare x.y.z — tag creation skipped"
            echo "skip_tag=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Git tag (release branch push only)
        id: tag
        # 仅在发布线分支(multi-1.20.1-1.21.1)自动打 tag:tag = 基础版本号(去掉 -rc/-pre 与 +后缀),如 1.1.3。
        # ⚠️ 该分支推送时若 mod_version 不含 '-',会自动建 tag;Release 由**同一 job 的下一步**直接发布。
        # 不再依赖「tag push 触发 Release」:GITHUB_TOKEN 推送的 tag 不会再触发本 workflow。
        if: github.event_name == 'push' && github.ref == 'refs/heads/multi-1.20.1-1.21.1' && steps.version.outputs.skip_tag == '0'
        run: |
          TAG="${{ steps.version.outputs.base }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
          # 交给下一步发布 Release(同 job:tag 已保证存在)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create/Update GitHub Release (three JARs)
        # 发布 Release 的两种来源(同一 job 内完成,附件 = 刚构建的三个 jar:
        #   1.21.1 NeoForge + 1.20.1 Forge(发布线)+ 26.1.2 NeoForge(低优先级移植线,版本号带 -beta)):
        #   ① 发布线分支 push:用上一步新建/已存在的 tag(已在库内,无需再触发 workflow);
        #   ② ref 本身就是 tag(tag push,或对 tag 手动 workflow_dispatch 补发):直接用 GITHUB_REF 的 tag。
        # 已存在同名 Release 时改为「编辑说明 + --clobber 覆盖附件」,保证重复发布幂等、附件与最新构建一致。
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/multi-1.20.1-1.21.1' && steps.tag.outputs.tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ steps.tag.outputs.tag }}"
          fi
          echo "publishing release for tag: $TAG"
          # ⚠️ 三个 glob 都必须至少命中一个文件,否则 bash 会把未展开的模式原样传给 gh 并报错(故意让它失败)。
          JARS=(neoforge-1.21.1/build/libs/astral_dice-*.jar forge-1.20.1/build/libs/astral_dice-*.jar neoforge-26.1.2/build/libs/astral_dice-*.jar)
          NOTES="Astral Dice $TAG — 1.21.1 (NeoForge) + 1.20.1 (Forge)

          **附件 / Attachments**
          - \`astral_dice-$TAG+neoforge_1.21.1.jar\` — Minecraft 1.21.1 / NeoForge 21.1(发布线)
          - \`astral_dice-$TAG+forge_1.20.1.jar\` — Minecraft 1.20.1 / Forge 47.4.10(发布线,需 Mixin Booster ≥ 0.1.3)
          - \`astral_dice-*-beta+neoforge_26.1.2.jar\` — Minecraft 26.1.2 / NeoForge 26.1.2.109(**低优先级移植线,版本号带 \`-beta\`,与发布线功能对等但不随发布线发版**)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Astral Dice $TAG" --notes "$NOTES"
            gh release upload "$TAG" "${JARS[@]}" --clobber
          else
            gh release create "$TAG" \
              "${JARS[@]}" \
              --title "Astral Dice $TAG" \
              --notes "$NOTES" \
              --latest
          fi
