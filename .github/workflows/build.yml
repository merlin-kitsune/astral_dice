name: Build

on:
  push:
    branches:
      # 发布线分支(本仓已无 main 分支;origin/HEAD 默认分支即此分支)。
      # 原先写的 `main` 是不存在的分支 → push 过滤与下方自动打 tag 永远不生效。
      - 'multi-main'
      # 合并后的开发主线（原 dev-targetselector 重命名而来）
      - 'multi-dev-next'
      # 26.1.2 第三条线:2026-09-17 起已与发布线同树(该分支保留为历史/回滚入口)。
      # 它同样跑 lang 同步 + 三子项目构建,并且它的 jar 会**一并附到发布线的 Release**(见文末三 jar 步骤);
      # 打 tag / 建 Release 这两步仍**只在发布线分支**(multi-main)触发 —— 26.1.2 的版本号
      # 形如 `1.2.1-beta+neoforge_26.1.2`,不是裸 x.y.z,按发布规范不会(也不应)生成独立 tag。
      - 'multi-26.1.2-neoforge'
      # fabric 第四条线(2026-09-29 接入;2026-10-01 并入发布线 `multi-main`):**独立的移植线**,
      # 版本号形如 `1.3.5-alpha.1+fabric_1.20.1`(`-alpha.x` 预发布后缀,与 26.1.2 线 `-beta.x` 同构)。
      # ⚠️ 它的产物**不并入**(也绝不能被并入)发布线的 Release —— 见文末 `fabric pre-release` 步骤:
      #    该线单独出一个 Release 并标记 `--prerelease`,避免玩家把移植线产物当正式版下载。
      # ⚠️ 原独立分支 `1.20.1-fabric` 已于 2026-10-01 并入 `multi-main`（本地 worktree 与分支、以及**远端分支 `origin/1.20.1-fabric`** 均已删除；删前已取证其 tip `11e1c778` 是新 `multi-main` 的祖先、独有提交 0 个，且另有 tag `fabric-1.3.4-alpha.1` 兜底可达）
      #    ⇒ 本线的构建与 pre-release **改由 `multi-main` 的 push 触发**(见文末步骤的 `if` 条件);
      #    此处不再登记该分支,避免留下「分支已删、workflow 仍在等它触发」的死条目。
    tags:
      # 发布规范:tag 使用不含后缀的基础版本号(如 1.1.3),禁止 v 前缀与 +加载器后缀
      - '[0-9]*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21 (1.21.1 NeoForge)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup JDK 17 (1.20.1 Forge)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup JDK 25 (26.1.2 NeoForge)
        # MC 26.1.2 的 javaVersion = java-runtime-epsilon / majorVersion 25(1.21.1 为 21),
        # 故第三子项目的 toolchain 必须是 25;若本步未提供,根项目 foojay 解析器会自行下载。
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Checkout StarEngine Lib (required prerequisite)
        # 前置库 starengine_lib 只在 mavenLocal 发布(无远程 maven),CI 上必须先从源码构建。
        # ⚠️ ref **不得**停在浮动的 main(2026-09-17 修正):main 每推一个提交都向前走,而消费方在这里
        # 构建出的库必须**恰好**是 `starengine_lib_version` 指定的那一版 —— 浮动 main 会让
        # 「区间下界 [1.0.3,2.0)」与「CI 实际 publishToMavenLocal 出的版本」脱钩,
        # 一旦库在两次 CI 之间 bump 或改动坐标,断在依赖解析(本地不可复现,只在 CI 暴露)。
        # 本 ref 一律用提交 SHA 钉死 —— **不依赖 tag**,避免 tag 建立时序问题;
        # **库版本 bump 时本行必须同步更新**(与三线 gradle.properties 的 starengine_lib_version
        # 在同一提交里一起改)。
        # 沿革(以下均为历史记录,旧钉值勿再当现行值):`.5`=d5b0776;`.6`=716f976;`.10`=ec28415
        # (`.7` 只发过 mavenLocal、从未入库,故并入 `.10`);`.16`=f706be0(快照系列终态);
        # `1.0.0`=205eed8(首个正式版 = `.16` 的**规范化**结果:库内 Java 源码零改动、仅去掉
        # -SNAPSHOT,并带着两批修复 —— ① **库自身被 FML 拒载**的根因:1.21.1 的 loaderVersion 槽
        # 曾误填 NeoForge 版本带 [21.1,21.2),而该槽比的是 javafml 语言提供者版本(本机报 4.0.42)
        # ⇒ 改回语言区间 [1,),forge-1.20.1 的 loaderVersion 同时由 [47,) 收敛为 [47,48)、其 forge
        # 依赖改用从 forge_version 派生的精确区间 [47.4.10,48);② forge-1.20.1 缺失 `pack.mcmeta`
        # (缺它时 Forge 加载界面告警且该模组资源包不注册);两批「原拟 1.0.1」的内容也并入 1.0.0)。
        # `1.0.1`=**从未推送、从未发布**;`1.0.2`=**从未推送、从未发布**(内容 = HostileTargets 新增
        # 「额外敌对判定」注入 seam,库提交 cd579e7)⇒ 按「未发布版本的改动并入原条目」并入 `1.0.3`。
        # 现行 ref = `1.0.3` = 库提交 e407844(= 该 seam + **敌对目标口径重写**)。
        # ✅ **2026-09-24:库已推送**(远端 `main` = e407844;其 CI 自动打 tag `1.0.3` 并发布三平台 jar
        #    的 Release;消费方 CI 同日跑绿)⇒ 本 ref 可被 CI 检出,不再存在「库推送前必然断在
        #    Checkout」的窗口。跳号的由来:`1.0.1` 从未发布,但 mavenLocal 留有已撤销版本的残留目录,
        #    复用会「同号覆盖」而让本地构建静默解析到旧 jar ⇒ 故逐次另起新号。
        # ✅ **2026-09-28:现行 ref = `1.0.5`**(库提交 4bea9e7 = 「会被激怒的可驯服动物计入敌对目标」;
        #    库远端 main 已推送、其 CI 自动打 tag `1.0.5` 并发布三平台 jar 的 Release)。
        #    三线 gradle.properties 的 `starengine_lib_version` / `_range` 同步为 `1.0.5` / `[1.0.5,2.0)`。
        #    ⚠️ 再提醒一次:库版本 bump(或语义变更收紧区间下界)时,**本行的 SHA 必须与三线 properties 在同一提交里一起改**
        #    —— 否则 CI 从源码 publish 出的库版本会低于消费方区间下界,直接断在依赖解析(本地不复现)。
        uses: actions/checkout@v4
        with:
          repository: merlin-kitsune/starengine_lib
          ref: 3652b5845cb0cdc92ce58d71dca4b4e8f02da09c   # = 库分支 `fabric-1.20.1` 的 HEAD:三平台 **1.0.9** + fabric 子项目 **1.0.6-alpha.4**
          #   ℹ️ 该提交由 `9640af7` **amend** 而来(仅追加两份库 CHANGELOG 的「定性说明」段,字节码与版本号完全未变)
          #   —— 保持「一个版本号 = 一个提交」;若你看到 `9640af7` 这个旧 SHA,那是 amend 前的形态。
          #   (含 `component/GameplayConstants#CURSED_SWORD_BONUS_MAX` 由 16 上调为 32)。一个 ref 同时满足四条线。
          #   ⚠️ 本次为**纯数值调整**,不动任何 public 签名;三平台 `1.0.6` → `1.0.7`、
          #    fabric 子项目 `1.0.6-alpha.1` → `1.0.6-alpha.2`(两条线各自独立递增)。
          #   🚨 **该库提交尚未 push**(2026-10-02) ⇒ **push 顺序必须先库后消费方**:`actions/checkout` 只能检出
          #    远端可达的提交;若先推消费方,CI 会在库的 Checkout 步直接失败(本地不复现)。
          #    push 库之后请把本行注记改为「已 push + 实测 run 编号」。
          #   --- 以下为历史钉值(勿再当现行值) ---
          #   `1.0.6-alpha.1` = d938024(三平台 1.0.6 + fabric 1.0.6-alpha.1;`EventTargetCollector` 的 FTB / OPAC 反射修正);
          #    ✅ 2026-10-01 已 push(`origin/fabric-1.20.1`: `5aa084b` → `d938024`)⇒ 远端可达,CI 的库 Checkout 可正常解析(实测 run #80 该步 success)。
          #   ⚠️ 2026-09-30 修复 CI 失败:旧钉值 `4bea9e7d` 位于 `next` 线上,**其 tree 里根本没有 `fabric-1.20.1` 目录**
          #   ⇒ CI 解析 `:fabric-1.20.1:modImplementation` 时找不到库产物,直接 `Could not resolve all files for configuration` 失败(本地不复现)。
          #   (历史钉值:1.0.3 = e407844;1.0.5 = 4bea9e7d)
          # ✅ **2026-10-03:现行 ref = `1.0.8`**(库提交 f8e7659 = 「ActionBar 文本位置对齐原版 actionbar
          #    + 淡出默认 10 tick」;含 `GameplayConstants#ACTIONBAR_FADE_TICKS` 20 → 10)。
          #    三线 gradle.properties 的 `starengine_lib_version` / `_range` 同步为 `1.0.8` / `[1.0.8,2.0)`;
          #    fabric 线 `1.0.6-alpha.3` / `>=1.0.6-alpha.3 <2.0`。
          # ✅ **2026-10-03(第二批):现行 ref = `1.0.9`**(库提交 3652b58 = 效果牌专用目标口径
          #    `combat/CreatureTargets` + `TargetType.CREATURE` / `CREATURE_OR_RIVAL`;**纯新增**,
          #    未改 `HostileTargets.isHostile` 语义 ⇒ 补丁位)。
          #    三线 `starengine_lib_version` / `_range` 同步为 `1.0.9` / `[1.0.9,2.0)`;
          #    fabric 线 `1.0.6-alpha.4` / `>=1.0.6-alpha.4 <2.0`。
          path: .ci/starengine_lib
          fetch-depth: 1

      - name: Publish StarEngine Lib to mavenLocal
        working-directory: .ci/starengine_lib
        run: ./gradlew publishToMavenLocal

      - name: Check lang sync (neoforge-1.21.1)
        run: pwsh -NoProfile -File tools/check_lang_sync.ps1 -LangDir neoforge-1.21.1/src/main/resources/assets/astral_dice/lang

      - name: Check lang sync (forge-1.20.1)
        run: pwsh -NoProfile -File tools/check_lang_sync.ps1 -LangDir forge-1.20.1/src/main/resources/assets/astral_dice/lang

      - name: Check lang sync (neoforge-26.1.2)
        run: pwsh -NoProfile -File tools/check_lang_sync.ps1 -LangDir neoforge-26.1.2/src/main/resources/assets/astral_dice/lang

      - name: Check lang sync (fabric-1.20.1)
        # fabric 子项目自 2026-10-01 起已并入 `multi-main`(根 settings.gradle 恒 include)⇒
        # 该目录在所有分支上都存在;保留 hashFiles 守卫只为兼容「子项目尚不存在」的历史分支。
        if: hashFiles('fabric-1.20.1/gradle.properties') != ''
        run: pwsh -NoProfile -File tools/check_lang_sync.ps1 -LangDir fabric-1.20.1/src/main/resources/assets/astral_dice/lang

      - name: Build with Gradle (all targets)
        run: ./gradlew build

      - name: Upload Astral Dice JARs
        uses: actions/upload-artifact@v4
        with:
          name: astral_dice-jars
          path: |
            neoforge-1.21.1/build/libs/astral_dice-*.jar
            forge-1.20.1/build/libs/astral_dice-*.jar
            neoforge-26.1.2/build/libs/astral_dice-*.jar

      - name: Upload Astral Dice JAR (fabric 1.20.1)
        # 与三条生产线**分开**的 artifact:便于只取 fabric 产物,也避免与上面的 glob 混淆。
        # (fabric 的 jar 只在它自己的 pre-release 里发布,不进发布线 Release 的附件。)
        if: hashFiles('fabric-1.20.1/build.gradle') != ''
        uses: actions/upload-artifact@v4
        with:
          name: astral_dice-jar-fabric-1.20.1
          path: fabric-1.20.1/build/libs/astral_dice-*.jar

      - name: Read base version
        id: version
        run: |
          VERSION=$(grep '^mod_version=' neoforge-1.21.1/gradle.properties | cut -d'=' -f2)
          # tag = 基础版本号:先剥掉 +加载器 后缀(1.2.0+neoforge_1.21.1 → 1.2.0),再剥 -rc/-pre。
          # ⚠️ 必须两条都剥:只剥 '-' 时,`1.2.0+neoforge_1.21.1` 不含 '-' → tag 会原样带上 '+后缀'。
          BASE=${VERSION%%+*}
          BASE=${BASE%%-*}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          # 守门:base 必须是裸 x.y.z,否则不打 tag(避免再次出现不合规 tag)
          if [[ "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "skip_tag=0" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::base version '$BASE' is not a bare x.y.z — tag creation skipped"
            echo "skip_tag=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Git tag (release branch push only)
        id: tag
        # 仅在发布线分支(multi-main)自动打 tag:tag = 基础版本号(去掉 -rc/-pre 与 +后缀),如 1.1.3。
        # ⚠️ 该分支推送时若 mod_version 是**正式版或补丁版**(1.3.5 / 1.3.5-hotfix),会自动打(或复用)
        #    base tag(1.3.5),并由**同一 job 的下一步**发布或**刷新**该 Release(edit + --clobber);
        #    只有**预发布**后缀才跳过 —— 预发布号线不占用发布线的裸版本号。
        # 不再依赖「tag push 触发 Release」:GITHUB_TOKEN 推送的 tag 不会再触发本 workflow。
        if: github.event_name == 'push' && github.ref == 'refs/heads/multi-main' && steps.version.outputs.skip_tag == '0'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # 预发布守卫（2026-10-01 修正）：**原判据是「含 '-' 一律跳过」**，它把 `-hotfix` 这类补丁发布
          # 也一并挡掉了 ⇒ 「版本号已改成 hotfix，却不打 tag、不刷新 Release」，而且**没有任何报错**
          # （静默失效；`1.3.2-hotfix` 那轮就是这种状态，见 forge/gradle.properties 的旧注释）。
          # 现只对真正的**预发布**后缀跳过；比较前统一转小写，避免大小写差异漏判。
          LOWER="${VERSION,,}"
          if [[ "$LOWER" =~ -(alpha|beta|rc|pre|snapshot)([.+-]|$) ]]; then
            echo "Version $VERSION is a pre-release/snapshot, skip auto tagging"
            exit 0
          fi
          TAG="${{ steps.version.outputs.base }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
          # 交给下一步发布 Release(同 job:tag 已保证存在)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create/Update GitHub Release (three JARs, notes from release/<tag>/)
        # 发布 Release 的两种来源(同一 job 内完成,附件 = 刚构建的三个 jar:
        #   1.21.1 NeoForge + 1.20.1 Forge(发布线)+ 26.1.2 NeoForge(低优先级移植线,版本号带 -beta)):
        #   ① 发布线分支 push:用上一步新建/已存在的 tag(已在库内,无需再触发 workflow);
        #   ② ref 本身就是 tag(tag push,或对 tag 手动 workflow_dispatch 补发):直接用 GITHUB_REF 的 tag。
        # 说明正文取自**玩家侧发布说明** `release/<tag>/PLAYER_CHANGELOG_ZH.md` + `PLAYER_CHANGELOG.md`
        # (中文在前、英文在后,中间插一条 `---`);两个文件都不存在时退回「附件清单」兜底并留 ::warning::。
        # 已存在同名 Release 时改为「编辑说明 + --clobber 覆盖附件」,保证重复发布幂等、附件与最新构建一致。
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/multi-main' && steps.tag.outputs.tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ steps.tag.outputs.tag }}"
          fi
          echo "publishing release for tag: $TAG"
          # ⚠️ 三个 glob 都必须至少命中一个文件,否则 bash 会把未展开的模式原样传给 gh 并报错(故意让它失败)。
          JARS=(neoforge-1.21.1/build/libs/astral_dice-*.jar forge-1.20.1/build/libs/astral_dice-*.jar neoforge-26.1.2/build/libs/astral_dice-*.jar)
          # 说明正文拼成一个临时文件后用 `--notes-file` 传入 —— 玩家侧发布说明可达数十 KB,
          # 经 `--notes "$(...)"` 内联会踩长度与引号问题(旧的内联单行写法已废弃)。
          NOTES_ZH="release/$TAG/PLAYER_CHANGELOG_ZH.md"
          NOTES_EN="release/$TAG/PLAYER_CHANGELOG.md"
          NOTES_FILE="$RUNNER_TEMP/astral-dice-release-notes-$TAG.md"
          : > "$NOTES_FILE"
          HAVE_NOTES=0
          if [[ -f "$NOTES_ZH" ]]; then
            cat "$NOTES_ZH" >> "$NOTES_FILE"
            HAVE_NOTES=1
          else
            echo "::warning::player changelog not found: $NOTES_ZH"
          fi
          if [[ -f "$NOTES_EN" ]]; then
            # 中英两份之间插水平分隔线(仅当前面已写入内容时)
            if [[ $HAVE_NOTES -eq 1 ]]; then printf '\n---\n\n' >> "$NOTES_FILE"; fi
            cat "$NOTES_EN" >> "$NOTES_FILE"
            HAVE_NOTES=1
          else
            echo "::warning::player changelog not found: $NOTES_EN"
          fi
          if [[ $HAVE_NOTES -eq 0 ]]; then
            # 兜底(不阻断发布):该版本尚未提供玩家侧发布说明时,至少列出本次构建的三个附件
            {
              printf 'Astral Dice %s\n\n' "$TAG"
              printf '**附件 / Attachments**\n'
              for j in "${JARS[@]}"; do printf -- '- `%s`\n' "${j##*/}"; done
            } >> "$NOTES_FILE"
            echo "::warning::no release/$TAG/PLAYER_CHANGELOG*.md found — falling back to an attachment list"
          fi
          echo "release notes: $(wc -c < "$NOTES_FILE") bytes"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Astral Dice $TAG" --notes-file "$NOTES_FILE"
            gh release upload "$TAG" "${JARS[@]}" --clobber
          else
            gh release create "$TAG" \
              "${JARS[@]}" \
              --title "Astral Dice $TAG" \
              --notes-file "$NOTES_FILE" \
              --latest
          fi

      - name: Create/Update Fabric release (pre-release, separate tag)
        # 需求(2026-09-29 用户裁决):fabric 线**单独推送**,并标记为 pre-release。
        #
        # 设计与发布线的**三处刻意差异**:
        #   ① **独立 tag**(形如 `fabric-1.3.5-alpha.1`)。它**不以数字开头** ⇒ 不命中本 workflow 顶部的
        #      `tags: ['[0-9]*']` 过滤器 ⇒ 推送该 tag **不会再触发一次 CI**(发布线的裸版本 tag
        #      则会被 `gh release` 复用,二者的行为差异是有意的)。
        #   ② `--prerelease` 且**不带** `--latest` ⇒ 不进仓库首页的 "Latest release" 卡片,
        #      玩家不会被引导到移植线产物。
        #   ③ 附件只有 fabric 的**单个** jar;三条生产线的 jar 不掺入,反之亦然。
        #
        # 触发条件 = 在发布线分支 `multi-main` 上 push。
        # ⚠️ 2026-10-01 变更:原条件 `refs/heads/1.20.1-fabric` 已随该分支的删除而**永不成立**
        #    (fabric 已并入 `multi-main`)⇒ 改挂 `multi-main`,与发布线 Release 同一触发口径。
        #    幂等性与发布线一致:tag 已存在则复用;Release 已存在则「编辑说明 + --clobber 覆盖附件」。
        if: github.event_name == 'push' && github.ref == 'refs/heads/multi-main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^mod_version=' fabric-1.20.1/gradle.properties | cut -d'=' -f2)
          # 1.3.5-alpha.1+fabric_1.20.1 → 1.3.5-alpha.1(只剥 `+加载器` 后缀,预发布后缀保留 ⇒
          # tag 形如 `fabric-1.3.5-alpha.1`,与生产线的裸版本 tag 天然不冲突)
          BASE=${VERSION%%+*}
          TAG="fabric-$BASE"
          echo "fabric version=$VERSION tag=$TAG"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Fabric 1.20.1 $BASE (pre-release)"
            git push origin "$TAG"
          fi
          # ⚠️ glob 必须至少命中一个文件;未命中时让 bash 原样传参并失败,而不是静默发一个空 Release。
          JARS=(fabric-1.20.1/build/libs/astral_dice-*.jar)
          if [[ ! -e "${JARS[0]}" ]]; then
            echo "::error::fabric jar not found: ${JARS[0]}"
            exit 1
          fi
          NOTES_FILE="$RUNNER_TEMP/astral-dice-fabric-notes-$TAG.md"
          {
            printf 'Astral Dice `%s` —— Fabric 1.20.1 移植线 / pre-release\n\n' "$VERSION"
            printf '> ⚠️ **这是移植/测试线产物,不是正式版。** 三条生产线\n'
            printf '> (NeoForge 1.21.1 / Forge 1.20.1 / NeoForge 26.1.2)已另有 Release。\n\n'
            printf '**必需前置 / Required dependencies**\n\n'
            printf -- '- Fabric Loader 0.19.x + Fabric API(1.20.1 线,0.92.12)\n'
            printf -- '- Trinkets 3.7.2 —— 饰品栏\n'
            printf -- '- Puzzles Lib 8.1.33 + Forge Config API Port 8.0.3 —— 事件桥\n\n'
            printf '**可选 / Optional**\n\n'
            printf -- '- Accessories 1.0.0-beta.48 —— 装了即优先走它(与 Trinkets 双源聚合)\n\n'
            printf '**附件 / Attachments**\n'
            for j in "${JARS[@]}"; do printf -- '- `%s`\n' "${j##*/}"; done
          } >> "$NOTES_FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Astral Dice $TAG (Fabric 1.20.1, pre-release)" \
              --notes-file "$NOTES_FILE" \
              --prerelease
            gh release upload "$TAG" "${JARS[@]}" --clobber
          else
            gh release create "$TAG" \
              "${JARS[@]}" \
              --title "Astral Dice $TAG (Fabric 1.20.1, pre-release)" \
              --notes-file "$NOTES_FILE" \
              --prerelease
          fi

      - name: Publish to Modrinth (main project + prerequisite library)
        # 发布动作，与本地部署无关。2026-10-01 用户要求「后续同步上传 Modrinth」⇒ 与上方两个 Release
        # 步骤**同一触发口径**（发布线分支 push 或 tag push），而不是挂在普通 PR / 开发分支上。
        #
        # 设计要点：
        #   ① **幂等由脚本自己保证**（tools/modrinth_upload.py 先查 `GET /project/{id}/version`，
        #      version_number 已存在即 SKIP）⇒ 同一版本重复触发不会产生重复文件，这一点与 GitHub
        #      Release 的 `--clobber` 语义不同（Modrinth 无法覆盖已发布文件，只能新建版本）。
        #   ② **缺 secret 只告警不失败**：MODRINTH_TOKEN 未配置时跳过，构建与 GitHub Release 照常完成。
        #   ③ 前置库 starengine_lib 的**四平台产物单独进它自己的项目**（按文件名前缀自动路由，
        #      见 tools/modrinth.json 的 lib 段）—— 库在本 job 里已经构建过（Publish to mavenLocal），
        #      产物就在 .ci/starengine_lib/*/build/libs 下，无需二次构建。
        #   ④ **不用 glob 直接展开**：本地 build/libs 常留有历史 jar，CI 虽是全新检出，但库那边
        #      `publishToMavenLocal` 可能额外产出 `-sources.jar` / `-javadoc.jar`，这些文件过不了
        #      tools/modrinth_upload.py 的文件名解析 ⇒ 显式过滤掉，避免整批发布被判非法而中止。
        #   ⑤ ⚠️ **触发口径与上方 Release 步骤「近似」而非「相同」**：Release 步骤额外要求
        #      `steps.tag.outputs.tag != ''`（base 不是裸 x.y.z 时不发）。本步骤**刻意不设该守卫** ——
        #      预发布线（26.1.2 的 `-beta.x` / fabric 的 `-alpha.x`）同样要同步到 Modrinth，
        #      而它们正是「base 不带裸版本号」的那批。重复触发不会产生重复文件（靠脚本幂等）。
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/multi-main') ||
          startsWith(github.ref, 'refs/tags/')
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MODRINTH_TOKEN:-}" ]; then
            echo "::warning::MODRINTH_TOKEN secret is not configured - skipping Modrinth publishing (build and GitHub Release are unaffected)"
            exit 0
          fi

          JARS=()
          for j in \
            neoforge-1.21.1/build/libs/astral_dice-*.jar \
            forge-1.20.1/build/libs/astral_dice-*.jar \
            neoforge-26.1.2/build/libs/astral_dice-*.jar \
            fabric-1.20.1/build/libs/astral_dice-*.jar ; do
            if [ ! -e "$j" ]; then
              # ⚠️ fabric 允许缺席：本步骤的 `if` 含 `refs/tags/*`，对**旧 tag**（其树里还没有
              #    fabric 子项目）补发时不该把 job 弄红。三条生产线缺席则仍是硬错误。
              case "$j" in fabric-1.20.1/*)
                echo "::warning::fabric jar not present in this checkout, skipping: $j"
                continue ;;
              esac
              echo "::error::expected jar not found: $j"
              exit 1
            fi
            case "$j" in *-sources.jar|*-javadoc.jar) continue ;; esac
            JARS+=("$j")
          done

          LIBS=()
          for j in .ci/starengine_lib/*/build/libs/starengine_lib-*.jar ; do
            [ -e "$j" ] || continue
            case "$j" in *-sources.jar|*-javadoc.jar) continue ;; esac
            LIBS+=("$j")
          done
          if [ "${#LIBS[@]}" -eq 0 ]; then
            echo "::warning::no StarEngine Lib jar found under .ci/starengine_lib/*/build/libs - the library project on Modrinth will not be updated this run"
          fi

          ARGS=()
          for j in "${JARS[@]}" "${LIBS[@]}"; do ARGS+=(--jar "$j"); done
          # ⚠️ 计数必须用 JARS/LIBS 的长度：`${#ARGS[@]}` 里每个文件还带一个 `--jar` 标志位
          #    ⇒ 会数成两倍（实测 8 个文件报成 16）。
          echo "publishing ${#JARS[@]} mod jar(s) + ${#LIBS[@]} library jar(s):"
          for j in "${JARS[@]}" "${LIBS[@]}"; do echo "  - $j"; done

          python3 tools/modrinth_upload.py "${ARGS[@]}"
