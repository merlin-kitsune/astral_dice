name: Build

on:
  push:
    branches:
      # 发布线分支(本仓已无 main 分支;origin/HEAD 默认分支即此分支)。
      # 原先写的 `main` 是不存在的分支 → push 过滤与下方自动打 tag 永远不生效。
      - 'multi-main'
      # 合并后的开发主线（原 dev-targetselector 重命名而来）
      - 'multi-dev-next'
      # 26.1.2 第三条线:2026-09-17 起已与发布线同树(该分支保留为历史/回滚入口)。
      # 【历史裁决，2026-11-02 已被取代】原文 = 2026-10-25 用户裁决「默认只发布/上传 P0 两线
      #    (neoforge-1.21.1 + forge-1.20.1)；neoforge-26.1.2 / fabric-1.20.1(P1) 既不进 Release
      #    附件、也不单独建 Release/tag，Actions 里也不再产出它们的 artifact」。
      #    ⇒ 该裁决已由用户 2026-11-02 的新指令取代：1.5.0 四线（neoforge-1.21.1 / forge-1.20.1 /
      #    neoforge-26.1.2 / fabric-1.20.1）全部发正式版，同一个 tag `1.5.0`、四个 jar 同一个 Release。
      #    ⇒ 下方 Upload artifact 与 Create/Update Release 两步均按**四线**处理；旧「只发 P0 两线」不再有效。
      - 'multi-26.1.2-neoforge'
    tags:
      # 发布规范(2026-10-25 用户裁决，强制):tag **只按 mod 版本**创建 —— 形如 `1.5.0` / `1.5.0-rc.1` / `1.5.0-pre.6`;
      #   **禁止**平台前缀(`fabric-1.5.0-rc.1`、`neoforge-…`)、禁止 `v` 前缀、禁止 `+加载器` 后缀。
      #   同一版本的多平台 jar(现为四线 neoforge-1.21.1 / forge-1.20.1 / neoforge-26.1.2 / fabric-1.20.1)放进**同一个 Release**。
      - '[0-9]*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 并发保护（2026-11-02 新增，针对 #144/#145 那类「同一个 Release 被两个 run 同时 delete/upload」的红）：
    #   ⚠️ GitHub 的 concurrency 只能挂在 **job** 或 **workflow** 上，没有 step 级语法 ⇒ 只能挂在 build 上。
    #   代价：同一个 ref 的多次运行会被**串行**（不同 ref 之间并行不受影响）——这是「不打断正在跑的发布」
    #   与「同一 Release 只被一个 run 写」的必然代价；cancel-in-progress: false 保证**不杀掉**在跑的那次。
    #   ⚠️ **已知边界**：github.ref 在「分支 push」与「tag push」上不同 ⇒ 同一个提交的
    #   「multi-main push + 手工 tag push」（正是 #144/#145 的形状）不会被本组收敛（recon §P1 已指出）。
    #   那一类跨 ref 竞态由 Release step 的三处容错兜住：delete-asset 容忍 404、republish 通道用
    #   --clobber、冻结通道「上传撞名 ⇒ 确认附件确实已存在即视为成功」（**绝不覆盖**已有字节）。
    #   若要绝对串行，只能把 group 改成固定名（如 release-${{ github.repository }}，代价是整条流水线
    #   串行）或把 Release 拆成独立 job —— 两者都会改变运行结构，本次不做（见报告「未验证项/已知限制」）。
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21 (1.21.1 NeoForge)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup JDK 17 (1.20.1 Forge)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup JDK 25 (26.1.2 NeoForge)
        # MC 26.1.2 的 javaVersion = java-runtime-epsilon / majorVersion 25(1.21.1 为 21),
        # 故第三子项目的 toolchain 必须是 25;若本步未提供,根项目 foojay 解析器会自行下载。
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Checkout StarEngine (required prerequisite)
        # ✅ **2026-10-20 现行口径**:库已改名 StarEngine(mod id `starengine`,maven `starengine-<平台>`,
        #    仓库 https://github.com/merlin-kitsune/StarEngine),版本 `1.1.0-pre.1`;四线 gradle.properties 的
        #    `starengine_version` 必须与本 ref 指向的提交一致。
        #    ⚠️ 本 ref 是库 `main` 的提交 `63e2329`(含 `553195a` 改名+下沉、`03d6a6c` 升号);
        #    **库 `main` 未推送前,本 job 必断在 Checkout**。推库之后请核对 SHA 未变。
        # 前置库 starengine 只在 mavenLocal 发布(无远程 maven),CI 上必须先从源码构建。
        # ⚠️ ref **不得**停在浮动的 main(2026-09-17 修正):main 每推一个提交都向前走,而消费方在这里
        # 构建出的库必须**恰好**是 `starengine_version` 指定的那一版 —— 浮动 main 会让
        # 「区间下界 [1.0.3,2.0)」与「CI 实际 publishToMavenLocal 出的版本」脱钩,
        # 一旦库在两次 CI 之间 bump 或改动坐标,断在依赖解析(本地不可复现,只在 CI 暴露)。
        # 本 ref 一律用提交 SHA 钉死 —— **不依赖 tag**,避免 tag 建立时序问题;
        # **库版本 bump 时本行必须同步更新**(与四线 gradle.properties 的 starengine_version
        # 在同一提交里一起改)。
        # 沿革(以下均为历史记录,旧钉值勿再当现行值):`.5`=d5b0776;`.6`=716f976;`.10`=ec28415
        # (`.7` 只发过 mavenLocal、从未入库,故并入 `.10`);`.16`=f706be0(快照系列终态);
        # `1.0.0`=205eed8(首个正式版 = `.16` 的**规范化**结果:库内 Java 源码零改动、仅去掉
        # -SNAPSHOT,并带着两批修复 —— ① **库自身被 FML 拒载**的根因:1.21.1 的 loaderVersion 槽
        # 曾误填 NeoForge 版本带 [21.1,21.2),而该槽比的是 javafml 语言提供者版本(本机报 4.0.42)
        # ⇒ 改回语言区间 [1,),forge-1.20.1 的 loaderVersion 同时由 [47,) 收敛为 [47,48)、其 forge
        # 依赖改用从 forge_version 派生的精确区间 [47.4.10,48);② forge-1.20.1 缺失 `pack.mcmeta`
        # (缺它时 Forge 加载界面告警且该模组资源包不注册);两批「原拟 1.0.1」的内容也并入 1.0.0)。
        # `1.0.1`=**从未推送、从未发布**;`1.0.2`=**从未推送、从未发布**(内容 = HostileTargets 新增
        # 「额外敌对判定」注入 seam,库提交 cd579e7)⇒ 按「未发布版本的改动并入原条目」并入 `1.0.3`。
        # 现行 ref(multi-dev-next 的副本) = 开发线库 `2.0.0-SNAPSHOT.3` = 库 `next` 分支提交 89580f8
        # (= `2.0.0-SNAPSHOT.2` + 自主线 `1.0.5` 移植「会被激怒的可驯服动物计入敌对目标」)。
        # ⚠️ 该提交**尚未推送** ⇒ 推库 `next` 之前,本 workflow 必断在 Checkout(2026-09-28 状态)。
        # ⚠️ 本 workflow 的 `on.push.branches` 同时含 multi-main 与 multi-dev-next,但 GitHub 用的是
        #    **被推分支各自那份 build.yml** ⇒ 本文件的 ref 只需服务开发线;发布线那份另行钉 1.x 的 SHA。
        # （历史）1.0.3 = 库提交 e407844(= 「额外敌对判定」seam + **敌对目标口径重写**)。
        # ✅ **2026-09-24:库已推送**(远端 `main` = e407844;其 CI 自动打 tag `1.0.3` 并发布三平台 jar
        #    的 Release;消费方 CI 同日跑绿)⇒ 本 ref 可被 CI 检出,不再存在「库推送前必然断在
        #    Checkout」的窗口。跳号的由来:`1.0.1` 从未发布,但 mavenLocal 留有已撤销版本的残留目录,
        #    复用会「同号覆盖」而让本地构建静默解析到旧 jar ⇒ 故逐次另起新号。
        # ✅ **2026-09-28(当时现行):ref = `1.0.5`**(库提交 4bea9e7 = 「会被激怒的可驯服动物计入敌对目标」;
        #    库远端 main 已推送、其 CI 自动打 tag `1.0.5` 并发布三平台 jar 的 Release)。
        #    三线 gradle.properties 的 `starengine_version` / `_range` 同步为 `1.0.5` / `[1.0.5,2.0)`。
        #    ⚠️ 再提醒一次:库版本 bump(或语义变更收紧区间下界)时,**本行的 SHA 必须与三线 properties 在同一提交里一起改**
        #    —— 否则 CI 从源码 publish 出的库版本会低于消费方区间下界,直接断在依赖解析(本地不复现)。
        uses: actions/checkout@v4
        with:
          repository: merlin-kitsune/StarEngine
          ref: b78fe107024adc35763479d065fc2bf2792a02b0   # = 库 `next` 提交 `b78fe10`（= 库版本 `26.4-SNAPSHOT.1`，dev 线新版本号规则首版：库内 Java 源码与 `1.1.0` 完全一致，仅版本号与文档）。⚠️ 本 SHA 必须与四线 `starengine_version`（现为 `26.4-SNAPSHOT.1`）同提交更新；**库 `next` 必须先推到远端，否则本步骤 checkout 失败**。
          path: .ci/StarEngine
          fetch-depth: 1

      - name: Publish StarEngine to mavenLocal
        working-directory: .ci/StarEngine
        run: ./gradlew publishToMavenLocal

      - name: Setup Python (testbed + static gates)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check lang sync (neoforge-1.21.1)
        run: python tools/check_lang_sync.py --line neoforge-1.21.1

      - name: Check lang sync (forge-1.20.1)
        run: python tools/check_lang_sync.py --line forge-1.20.1

      - name: Check lang sync (neoforge-26.1.2)
        run: python tools/check_lang_sync.py --line neoforge-26.1.2

      - name: Check lang sync (fabric-1.20.1)
        # fabric 子项目(第四条线)已在根 settings.gradle 恒 include ⇒ 该目录在各分支上均存在;
        # 保留 hashFiles 守卫,只为兼容「子项目尚不存在」的历史分支 / 旧 tag 检出。
        if: hashFiles('fabric-1.20.1/gradle.properties') != ''
        run: python tools/check_lang_sync.py --line fabric-1.20.1

      - name: Check CHANGELOG parity (en/zh)
        run: python tools/check_changelog_parity.py

      - name: Check chip acquisition gate (P0)
        # 筹码获取途径守门（2026-10-28）：把 stale_page（手册仍展示 crafting 页，配方默认关闭）与
        # no_note（手册未说明筹码获取途径）由告警升为**致命项**；仅 no_page（手册未展示 crafting 页）
        # 保持告警（2026-10 裁决把筹码 crafting 页统一改成 @spotlight + 获取途径说明后属预期）。
        # 脚本内部对 P0 两线（neoforge-1.21.1 / forge-1.20.1）各跑一次并做双版本对等性校验。
        run: python scripts/verify/verify_chip_acquisition.py

      - name: Check event-choice & combat static gates
        # 静态守门（2026-10-30）：事件二选一界面退出 / 首个事件可派发（neo+fabric）/ 事件计时器栈
        # （neo/forge 两线各一）/ 骰战 attrless 守卫（P0 双线合并 + P1 双线合并）共 7 个脚本，全部为**纯标准库**
        # Python，路径一律按**仓库根**相对（不 cd，与上面守门脚本同口径），逐个显式收 rc
        # 后立即 exit —— 刻意不用 continue-on-error / `|| true` / 条件跳过，要的就是硬红。
        run: |
          set -euo pipefail
          SCRIPTS=(
            scripts/verify/verify_event_choice_exit.py
            scripts/verify/verify_event_choice_first_event_dispatchable.py
            scripts/verify/verify_event_choice_first_event_dispatchable_forge.py
            scripts/verify/verify_event_timer_stack.py
            scripts/verify/verify_event_timer_stack_forge.py
            scripts/verify/verify_dice_combat_attrless_guard.py
            scripts/verify/verify_dice_combat_attrless_guard_p1.py
          )
          for s in "${SCRIPTS[@]}"; do
            rc=0
            python "$s" || rc=$?
            echo "== $s rc=$rc"
            if [[ "$rc" -ne 0 ]]; then
              echo "::error file=$s::static gate failed (rc=$rc)"
              exit "$rc"
            fi
          done

      - name: Build with Gradle (all targets)
        # 根项目的 `build` 会级联构建 `settings.gradle` 中 include 的**全部**子项目 —— 现为四条线:
        # neoforge-1.21.1 / forge-1.20.1 / neoforge-26.1.2 / **fabric-1.20.1**（fabric 子项目已在
        # 根 settings.gradle 中 include,故无需在此显式列出子项目）。
        run: ./gradlew build

      - name: Upload Astral Dice JARs (neoforge-1.21.1 / forge-1.20.1 / neoforge-26.1.2)
        # 2026-11-02 用户裁决（取代 2026-10-25「artifact 只产出 P0 两线」）：四线同批发布 ⇒ artifact 亦覆盖四线。
        #    本 step 放三条**恒存在**的线（settings.gradle 恒 include，目录必在）；fabric-1.20.1 因需保留
        #    目录存在性守卫而单列下一步 —— 两个不同守卫不能塞进同一个 step，且 26.1.2 的产物不经过该守卫。
        uses: actions/upload-artifact@v4
        with:
          name: astral_dice-jars
          path: |
            neoforge-1.21.1/build/libs/astral_dice-*.jar
            forge-1.20.1/build/libs/astral_dice-*.jar
            neoforge-26.1.2/build/libs/astral_dice-*.jar

      - name: Upload Astral Dice JARs (fabric-1.20.1)
        # 守卫与上方 `Check lang sync (fabric-1.20.1)` 同口径：只为兼容「fabric 子项目尚不存在」的
        #    历史分支 / 旧 tag 检出。该守卫只作用于本 step，不影响上一步 26.1.2 的产物。
        if: hashFiles('fabric-1.20.1/gradle.properties') != ''
        uses: actions/upload-artifact@v4
        with:
          name: astral_dice-jars-fabric
          path: fabric-1.20.1/build/libs/astral_dice-*.jar

      - name: Report per-line mod_version (consistency gate - mixed = warn, missing mod_version = fail)
        id: version
        # 2026-11-02 新增（四线混版修复）。职责有二：
        #   ① 把四线各自读到的 mod_version 与「是否统一」打成一张表（VERSIONS: unified=1/0 + 每线一行），
        #      版本树长什么样一眼可见，不必等 Release step 的 missing jar 再反向推断；
        #   ② 输出 unified，供 Create Git tag 的门禁使用（混版 ⇒ 不打 tag）。
        # ⛔ 本 step 对**混版**提交永不失败：混版 exit 1 就等于让「小版本 / hotfix 提交」继续红，
        #    与发布口径（见下）相悖。但 2026-11-02 复查后补了一条**确实要红**的判据（其余照旧）：
        #      · 任意一条**在场**线读不到 `mod_version`（文件在、`mod_version=` 键缺失或为空）
        #        ⇒ ::error:: 点名该线 + exit 1 —— 空版本不是「该 ref 没这条线」，不能静默跳过；
        #      · 「统一版本但某线缺 jar」仍留在 Release step 内部（那里才有 missing jar 判定）；
        #      · 「ref 上没有任何子项目」也仍由 Release step 判红。
        # unified 的判据与下方 Release step **同一口径**（两处都按 mod_version 去掉 + 之后的部分比较、
        #    都用独立布尔量判「基准是否已设过」、都把空 mod_version 当异常），改动需两边同步。
        run: |
          # 顺序与下方 Release step 的 LINES 数组一致；格式 线名|子项目目录。
          LINES=(
            "neoforge-1.21.1|neoforge-1.21.1"
            "forge-1.20.1|forge-1.20.1"
            "neoforge-26.1.2|neoforge-26.1.2"
            "fabric-1.20.1|fabric-1.20.1"
          )
          declare -a T_LINE=() T_VER=() T_BASE=() T_STATE=()
          for entry in "${LINES[@]}"; do
            line="${entry%%|*}"
            proj="${entry##*|}"
            props="$proj/gradle.properties"
            line_ver=""
            line_state=""    # absent / present / noversion —— 三态必须分开，见下
            # ⛔ 2026-11-02 复查修复：两个语义不同的分支必须**拆开**，不能再混成一个 `[[ -z ... ]]` 判断：
            #   ① absent    —— 该 ref 的提交里本来就没有这个子项目（老 tag 上 fabric / 26.1.2 目录确实不存在）
            #                  ⇒ 与 Release step 的 git cat-file 判据同口径，**跳过、不判红**（本 step 只看工作区，故用 -f）；
            #   ② noversion —— **文件在、但 `mod_version=` 键缺失或为空** ⇒ **异常**（不是「没这条线」），
            #                  由本步（一致性门禁）在构建早期 ::error:: + exit 1 暴露（见下方 BAD_VERSION）。
            #   旧写法把 ② 也当成 ① 跳过 ⇒ 空版本不进 unified ⇒ Report 可能判 unified=1（打 tag），
            #   而 Release step 那边空 base 会把「基准是否已设过」的哨兵带偏、判成混版 exit 0（不发 Release）
            #   ⇒ 同一棵树上出现「有 tag 没 Release」。
            if [[ ! -f "$props" ]]; then
              line_state="absent"
            else
              raw=$(grep -m1 '^mod_version=' "$props" || true)
              line_ver="${raw#*=}"
              line_ver="${line_ver%$'\r'}"   # 万一 properties 是 CRLF，别把 \r 带进版本串
            fi
            if [[ "$line_state" != "absent" ]]; then
              if [[ -z "$line_ver" ]]; then
                line_state="noversion"
              else
                line_state="present"
              fi
            fi
            T_LINE+=("$line")
            T_VER+=("$line_ver")
            T_STATE+=("$line_state")
            if [[ -n "$line_ver" ]]; then
              T_BASE+=("${line_ver%%+*}")
            else
              T_BASE+=("")
            fi
          done
          # unified：**在场**的每条线，mod_version 去掉 + 之后必须完全一致。
          #   只看在场线，是为了保住老的「该 ref 上本来就没有某子项目」豁免（否则老 tag 会被误判成混版）。
          UNIFIED=1
          REF_BASE=""
          REF_SET=0        # 独立布尔量：基准是否**已设过**（不看值是否为空；两处同口径）
          PRESENT=0
          BAD_VERSION=()   # 在场线里读不到 mod_version 的线名
          for i in "${!T_LINE[@]}"; do
            st="${T_STATE[$i]}"
            # 只有「该 ref 上本来就没有这个子项目」才跳过；缺键（noversion）不参与 unified 计算，
            #   而是收集起来点名判红 —— 「混版」与「读不到版本」是两件事，不能合并处理。
            if [[ "$st" == "absent" ]]; then
              continue
            fi
            if [[ "$st" == "noversion" ]]; then
              BAD_VERSION+=("${T_LINE[$i]}")
              continue
            fi
            # ⛔ 基准判据用**独立布尔量**，不能靠 `[[ -z "$REF_BASE" ]]` 当哨兵：一旦首条在场线的
            #    base 恰为空串，REF_BASE 永远是空 ⇒ 后面任何非空 base 都「不等」⇒ 被静默判成混版。
            #    空值现在根本走不到这里（上方已摘进 BAD_VERSION）。
            if [[ "$REF_SET" -eq 0 ]]; then
              REF_BASE="${T_BASE[$i]}"
              REF_SET=1
            fi
            if [[ "${T_BASE[$i]}" != "$REF_BASE" ]]; then
              UNIFIED=0
            fi
            PRESENT=$((PRESENT + 1))
          done
          if [[ "$PRESENT" -eq 0 ]]; then
            UNIFIED=0
          fi
          echo "VERSIONS: unified=$UNIFIED"
          for i in "${!T_LINE[@]}"; do
            case "${T_STATE[$i]}" in
              absent)
                printf '  %-16s mod_version=(absent at this ref)\n' "${T_LINE[$i]}" ;;
              noversion)
                printf '  %-16s mod_version=**MISSING KEY** (gradle.properties exists but has no mod_version= line)\n' "${T_LINE[$i]}" ;;
              *)
                printf '  %-16s mod_version=%-32s base=%s\n' "${T_LINE[$i]}" "${T_VER[$i]}" "${T_BASE[$i]}" ;;
            esac
          done
          # 任意一条**在场**线读不到 mod_version ⇒ 异常（不是缺席、也不是混版）⇒ 本一致性门禁直接判红，
          # 让问题在构建早期就暴露，而不是留到 Release step 里被当成混版静默跳过。
          if [[ ${#BAD_VERSION[@]} -gt 0 ]]; then
            for bad_line in "${BAD_VERSION[@]}"; do
              echo "::error::mod_version missing/empty for $bad_line: gradle.properties exists but has no mod_version= key"
            done
            echo "::error::aborting: ${#BAD_VERSION[@]} present line(s) without a readable mod_version (${BAD_VERSION[*]}) - unreadable version is NOT 'line absent at this ref'"
            exit 1
          fi
          if [[ "$UNIFIED" -eq 1 ]]; then
            echo "  => all present lines share base $REF_BASE - unified mainline version"
          else
            echo "  => bases differ - mixed / line-specific version: GitHub Release will be SKIPPED (CurseForge only)"
            echo "::notice::mixed per-line mod_version - the Release step will skip publication (see its output)"
          fi
          echo "unified=$UNIFIED" >> "$GITHUB_OUTPUT"
          # 参考版本：tag / base / prerelease / skip_tag 的推导沿用旧口径 —— 取**第一条可读**的线
          #   （数组首项即 neoforge-1.21.1）。四线统一时它就是四线共同的基版本，行为与改前一致。
          VERSION=""
          for i in "${!T_LINE[@]}"; do
            if [[ -n "${T_VER[$i]}" ]]; then
              VERSION="${T_VER[$i]}"
              break
            fi
          done
          # tag = **mod 版本本身**,只剥掉 `+加载器_<mc>` 后缀(`1.5.0-rc.1+neoforge_1.21.1` → `1.5.0-rc.1`)。
          # ⛔ 2026-10-25 用户裁决：tag 不得按游戏平台命名(`fabric-…` / `neoforge-…` 一律禁止),
          #    也不得为了「稳定版才打 tag」而吞掉 `-rc` / `-pre` —— rc.1 与 rc.2 是两个不同版本,各打各的 tag。
          #    多平台 jar 归到同一个 tag 的同一个 Release 下(附件见下方 Release 步骤)。
          BASE=${VERSION%%+*}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          # 逐线版本也写成 output（便于人工核对 / 后续步骤引用）；键名把 - 与 . 换成 _。
          for i in "${!T_LINE[@]}"; do
            key=$(printf '%s' "${T_LINE[$i]}" | tr -c 'A-Za-z0-9' '_')
            echo "mv_${key}=${T_VER[$i]}" >> "$GITHUB_OUTPUT"
          done
          # 预发布判定（显式判据，2026-11-02 复核后收紧）：满足任一条即标 prerelease。
          #   ① `BASE`（已剥掉 `+后缀`）里出现 `-` —— 覆盖 `1.5.0-rc.1` / `1.5.0-pre.6` / `1.5.0-hotfix`；
          #   ② 整个 `VERSION`（**含** `+后缀` 段）里出现 prerelease 词 rc / pre / alpha / beta / snapshot。
          # ⚠️ 只查 ① 有漏判：`1.5.0+rc.1` 这种把预发布标记写在 `+` 段的形态，`BASE` = `1.5.0` 不含 `-`
          #    ⇒ 旧写法判成**正式版**，会拿一个预发布构建去抢 `--latest`。② 补的就是这一路。
          #    词判据带边界（前后须是分隔符 / 数字 / 串首尾），避免 loader 后缀里的普通字母被误判。
          # 边界：本判据**只**决定 `is_prerelease`（⇒ 下方 `--prerelease` / `--latest` 的选择），
          #    **不参与** tag 名、也不参与「要不要打 tag」—— tag 恒 = `BASE`，另由下面 `skip_tag` 正则单独把关。
          LOWER="${VERSION,,}"
          IS_PRE=0
          if [[ "$BASE" == *-* ]]; then IS_PRE=1; fi
          if [[ "$LOWER" =~ (^|[._+-])(alpha|beta|rc|pre|snapshot)([._+-]|[0-9]|$) ]]; then IS_PRE=1; fi
          if [[ "$IS_PRE" -eq 1 ]]; then
            echo "is_prerelease=1" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=0" >> "$GITHUB_OUTPUT"
          fi
          # 守门:base 必须是 `x.y.z` 或 `x.y.z-<预发布>`；含 `+` 或其他怪形状一律不打 tag。
          if [[ "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "skip_tag=0" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::base version '$BASE' is not a bare x.y.z[-pre] — tag creation skipped"
            echo "skip_tag=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Git tag (release branch push only)
        id: tag
        # 仅在发布线分支(multi-main)自动打 tag:tag = 基础版本号(去掉 -rc/-pre 与 +后缀),如 1.1.3。
        # ⚠️ 该分支推送时若 mod_version 不含 '-',会自动建 tag;Release 由**同一 job 的下一步**直接发布。
        # 不再依赖「tag push 触发 Release」:GITHUB_TOKEN 推送的 tag 不会再触发本 workflow。
        # ⛔ 2026-11-02：**混版不打 tag**（unified == '1' 才算）。理由：混版按口径只发 CF、不建 Release，
        #   而 tag 是 Release 的身份 —— 给一个 hotfix 提交建出 1.5.0，之后 tag 只会被「已存在则复用」
        #   （tag 永不移动），会让下一次真正统一的发布挂到错误的提交上。故 tag 与 Release 同进同退。
        if: github.event_name == 'push' && github.ref == 'refs/heads/multi-main' && steps.version.outputs.skip_tag == '0' && steps.version.outputs.unified == '1'
        run: |
          # ⛔ 2026-10-25 用户裁决：tag **只按 mod 版本**建，`-rc` / `-pre` 也必须建（不同 rc 是不同版本）。
          #    平台名不得出现在 tag 里；多平台 jar 由下一步放进同一个 Release。
          TAG="${{ steps.version.outputs.base }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
          # 交给下一步发布 Release(同 job:tag 已保证存在)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create/Update GitHub Release (four JARs, notes from release/<tag>/)
        # 发布 Release 的两种来源(同一 job 内完成,附件 = 刚构建的**四线** jar:
        #   neoforge-1.21.1 + forge-1.20.1 + neoforge-26.1.2 + fabric-1.20.1。
        #   2026-11-02 用户裁决取代 2026-10-25「附件只放 P0 两线、不附 26.1.2 / fabric」):
        #   tag 命名见 `on.push.tags` 注释：只按 mod 版本（含 `-rc` / `-pre`），不带平台名；
        #   带 `-` 的版本标 prerelease、不占 latest。
        #   ① 发布线分支 push:用上一步新建/已存在的 tag(已在库内,无需再触发 workflow);
        #   ② ref 本身就是 tag(tag push,或对 tag 手动 workflow_dispatch 补发):直接用 GITHUB_REF 的 tag。
        # 说明正文取自**玩家侧发布说明** `release/<tag>/PLAYER_CHANGELOG_ZH.md` + `PLAYER_CHANGELOG.md`
        # (中文在前、英文在后,中间插一条 `---`);两个文件都不存在时退回「附件清单」兜底并留 ::warning::。
        # 已存在同名 Release 时:说明正文每次刷新(edit 覆盖),但附件**一旦发布即冻结** ——
        # 只补传缺失的 jar,已有附件字节一律不覆盖(避免 CI 件悄悄替换人工核对/投放过的构建件,
        # 否则 Release 与两个整合包 mods 的哈希会对不上)。⛔ 2026-10-30 用户裁决:去掉 --clobber。
        # 例外(2026-11-02 用户指令「同 tag 重发」):提交信息带 [republish-assets] 时走下方一次性重发通道。
        # 混版时上一步 Create Git tag 会被跳过（outputs.tag 为空），但本 step **仍要进来**：
        #   它要在日志里打印混版说明并 exit 0（判绿）。故 if 里显式放行 unified != '1'。
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/multi-main' && (steps.version.outputs.unified != '1' || steps.tag.outputs.tag != ''))
        env:
          GH_TOKEN: ${{ github.token }}
          # 仅分支 push 事件带 head_commit；tag push 为空 ⇒ 不会触发下方重发通道。
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ steps.tag.outputs.tag }}"
          fi
          echo "publishing release for tag: $TAG"
          # 版本基准：tag 名 = BASE（tag 名仍由上方版本步骤推导，本步不改 tag 命名口径）。
          # ⛔ 2026-11-02 修复（四线混版必红）：这里**不再**取一个共用 BASE 去套四条线。
          #   旧写法（把版本步骤的 base 输出赋给 BASE）只反映 neoforge-1.21.1 一个线的版本，
          #   却被拿来给四线套同一个 glob ⇒ 只要某条线自己升了小版本（如 fabric 的 1.5.0-hotfix），
          #   那条线必定 missing jar ⇒ exit 1（#146/#147 正是此形状）。
          #   现在改为**逐线读自己的 mod_version、按各自完整产物名定位**（见下方两遍循环），
          #   版本偏移不再致命；四线版本不一致时整步按「混版只发 CF」口径**跳过 Release 并 exit 0**。
          # 附件 = 四线 jar（2026-11-02 用户裁决，取代 2026-10-25「附件只放 P0 两线」）：
          #   四线（neoforge-1.21.1 / forge-1.20.1 / neoforge-26.1.2 / fabric-1.20.1）**全部硬校验**，
          #   任何一条线缺件 ⇒ ::error:: + exit 1 —— 不再有「静默缺席、Release 照样成功」的侥幸。
          #   唯一豁免见下：**该 ref 的提交里本来就没有这个子项目**（老 tag 上 fabric / 26.1.2 目录不存在）。
          #   📌 口径正本：`docs/agent/AGENTS-dsh.md`〈📍 生效红线区 —— 原文逐字〉里那条
          #      「**2026-11-02 用户裁决（取代本条后半）**」—— 旧红线「P1 两线…禁止上传、禁止建 Release/tag、
          #      禁止作为 P0 Release 的附件」的后半已被该裁决取代（CF 侧仍保留 `--allow-p1` 显式放行闸门）。
          #      改本段口径前先读那里，两处必须一致（这里与文档互相引用）。
          # 每线三元组：`线名|子项目目录|优先级`。
          LINES=(
            "neoforge-1.21.1|neoforge-1.21.1|P0"
            "forge-1.20.1|forge-1.20.1|P0"
            "neoforge-26.1.2|neoforge-26.1.2|P1"
            "fabric-1.20.1|fabric-1.20.1|P1"
          )
          # 历史兼容判据 ——「这个 ref 有没有该子项目」只看**提交对象**，不看工作区：
          #   `git cat-file -e "$SHA:<子项目>/gradle.properties"` 读的是被检出那个提交的树。
          #   为什么它在 checkout 之后仍然可靠（而 `[[ -d ]]` / `[[ -f ]]` 不可靠）：
          #   ① 本 job 的 Checkout 用了 `fetch-depth: 0` ⇒ 完整历史已在本地对象库，任何提交的树都能
          #      离线解析 —— 不依赖网络，也不依赖该 ref 上有没有 tag；
          #   ② 它回答的是「**那个提交里**有没有」：build/libs 里的残留产物、被前序步骤创建或删除的目录、
          #      `.gitignore` 掉的文件都改不了答案；而 `[[ -d ]]` 只能看见当前工作区，分不清
          #      「此 ref 本就没有该子项目」与「目录在、但内容不属于该 ref」；
          #   ③ 判定对象与构建对象是同一个提交 ⇒ 不会出现「拿 A 提交的树判定、拿 B 提交的产物上传」。
          #   ⚠️ 之所以要这条：fabric-1.20.1（2026-10-01 才并入）与 neoforge-26.1.2（2026-09 才有）
          #      在更早的 tag 上**目录根本不存在** —— 那些 ref 上不硬校验，只打 warning 跳过。
          SHA="${GITHUB_SHA:-$(git rev-parse HEAD)}"
          if ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
            # 提交对象不在本地库里 ⇒ 子项目存在性无法判定。宁可红，也不要把「判不出来」当成「不存在」。
            echo "::error::commit $SHA is not in the local object database — cannot resolve subproject presence"
            exit 1
          fi
          # ---- 第 1 遍：把**在场各线自己的** mod_version 读出来 -----------------------------
          #   修复要点：逐线读自己的版本，不再从 neoforge-1.21.1 取一个 BASE 复用给四线。
          #   读的是**提交对象**（"$SHA:$props"）而不是工作区文件：与上面的在场判据同源，
          #   保证「用的版本号」和「判的提交」是同一个；老 tag 上不存在的子项目也不会凭空冒出。
          declare -a P_LINE=() P_PROJ=() P_PRIO=() P_VER=()
          for entry in "${LINES[@]}"; do
            line="${entry%%|*}"
            rest="${entry#*|}"
            proj="${rest%%|*}"
            prio="${rest##*|}"
            props="$proj/gradle.properties"
            if ! git cat-file -e "${SHA}:${props}" 2>/dev/null; then
              echo "::warning::skipping $line (subproject not present at this ref)"
              continue
            fi
            raw_ver=$(git cat-file -p "${SHA}:${props}" | grep -m1 '^mod_version=' || true)
            line_ver="${raw_ver#*=}"
            line_ver="${line_ver%$'\r'}"   # properties 若是 CRLF，别把 \r 带进版本串
            P_LINE+=("$line"); P_PROJ+=("$proj"); P_PRIO+=("$prio"); P_VER+=("$line_ver")
          done
          # ---- 混版判定：各线 mod_version 去掉 +之后 是否完全一致 ---------------------------
          #   发布口径（2026-11-02 用户裁决，决定本段全部行为）：
          #     · 主线版本：四线统一 X.Y.0                                  => tag + GitHub Release + CF；
          #     · 小版本 / hotfix：只有某线升号（例：只有 fabric 是 1.5.0-hotfix）=> **只发 CF，不建 Release**。
          #   故混版提交**不该变红、也不该产出 Release**：打印说明后 exit 0 收工。
          #   判据只看**在场线**（老 tag 上本来就缺的子项目照旧豁免），与上方
          #   "Report per-line mod_version" 步骤的 unified 口径一致（两处改动需同步）。
          echo "per-line versions (present at $SHA):"
          UNIFIED=1
          REF_BASE=""
          REF_SET=0        # 独立布尔量：基准是否**已设过**（不看值是否为空；⛔ 不可再拿 [[ -z $REF_BASE ]] 当哨兵）
          EMPTY_VER=()     # 在场线里读不到 mod_version 的「线名|props」——独立收集，下面点名判红
          for i in "${!P_LINE[@]}"; do
            v="${P_VER[$i]}"
            b="${v%%+*}"
            printf '  %-16s mod_version=%-34s base=%s\n' "${P_LINE[$i]}" "$v" "$b"
            if [[ -z "$v" ]]; then
              EMPTY_VER+=("${P_LINE[$i]}|${P_PROJ[$i]}/gradle.properties")
            fi
            # ⛔ 2026-11-02 复查修复：基准判据必须是**独立布尔量**，不能拿 `[[ -z "$REF_BASE" ]]` 当哨兵。
            #    旧写法在「第一条在场线读出的 base 恰为空串」（该线 mod_version 缺键）时，永远认为
            #    基准还没设过 ⇒ 之后任何非空 base 都「不等」⇒ UNIFIED=0 ⇒ 走混版 exit 0（静默判绿），
            #    下方「cannot read mod_version」分支永远走不到；而上方 Report 一致性门禁却可能判
            #    unified=1 并打出 tag ⇒ 同一棵树上出现「有 tag 没 Release」。
            #    现在：空值根本不参与 unified 计算，而是进 EMPTY_VER，由下方防御分支判红。
            if [[ "$REF_SET" -eq 0 ]]; then
              REF_BASE="$b"
              REF_SET=1
            fi
            if [[ "$b" != "$REF_BASE" ]]; then UNIFIED=0; fi
          done
          if [[ ${#P_LINE[@]} -eq 0 ]]; then
            echo "::error::no subproject found at this ref - nothing to publish"
            exit 1
          fi
          # 防御分支（与 Report 一致性门禁同一口径）：任意一条**在场**线读不到 mod_version ⇒ 异常 ⇒ 判红。
          #   正常流程里 Report step 更早就 exit 1 了；这里保留是为了「即便前面那道门禁被跳过 / 被改坏」，
          #   本步也绝不把空版本当成「该线缺席」而静默判绿（旧行为正是这条路）。
          if [[ ${#EMPTY_VER[@]} -gt 0 ]]; then
            for entry in "${EMPTY_VER[@]}"; do
              echo "::error::cannot read mod_version for ${entry%%|*}: ${entry#*|} has no mod_version line"
            done
            echo "::error::aborting release: ${#EMPTY_VER[@]} present line(s) without a readable mod_version (${EMPTY_VER[*]}) - refusing to treat an unreadable version as a mixed-version build"
            exit 1
          fi
          if [[ "$UNIFIED" != "1" ]]; then
            echo "::notice::mixed per-line mod_version detected - SKIPPING GitHub Release (by policy)"
            echo "  四线 mod_version 去掉 + 之后不一致 ⇒ 这是**小版本 / hotfix 提交**（只有部分加载器线升号）。"
            echo "  按 2026-11-02 发布口径："
            echo "    · 小版本 / hotfix 只发 CurseForge，**不建 GitHub Release**；"
            echo "    · 只有四线统一的主线版本才建 GitHub Release（tag 名取基版本号）。"
            echo "  所以本 step 不做任何发布动作：不建 Release、不上传资产、不删资产，直接判绿。"
            echo "  等四线 mod_version 对齐成同一个 base 后再推一次，即可正常出 Release。"
            echo "release skipped: mixed versions (see above). exiting 0 on purpose."
            exit 0
          fi
          echo "all present lines share base $REF_BASE - unified mainline version, publishing release"
          # ---- 第 2 遍：按**各线自己的完整产物名**定位 jar ---------------------------------
          JARS=()
          MISSING=()
          for i in "${!P_LINE[@]}"; do
            line="${P_LINE[$i]}"
            proj="${P_PROJ[$i]}"
            prio="${P_PRIO[$i]}"
            ver="${P_VER[$i]}"
            if [[ -z "$ver" ]]; then
              # 第二道防线（2026-11-02 复查）：上方 EMPTY_VER 已按「异常」判红；此处保留，
              # 防止将来那段被改坏后，空版本又悄悄落到 missing jar 的语义里被放过。
              echo "::error::cannot read mod_version for $line: $proj/gradle.properties has no mod_version line"
              MISSING+=("$line")
              continue
            fi
            # 产物名 = astral_dice-<该线自己的 mod_version>.jar ⇒ 用**精确文件名**定位，不再用 glob：
            #   ① 版本偏移致命性消失：fabric 是 1.5.0-hotfix 时就找 astral_dice-1.5.0-hotfix+fabric_1.20.1.jar；
            #   ② 不会误命中历次旧 jar（build/libs 从不清理，实测 neoforge-26.1.2/build/libs 躺着
            #      1.2.1~1.5.0 共 14 个 jar），也不会把 -sources.jar 之类算成「同版本多命中」。
            #   ⛔ 仍不退回 astral_dice-*.jar：那样会把历次旧 jar 一并塞进本次 Release。
            jar="$proj/build/libs/astral_dice-$ver.jar"
            if [[ -f "$jar" ]]; then
              JARS+=("$jar")
              echo "jar ok ($prio) $line: $(basename "$jar")"
            else
              echo "::error::missing jar for $line: $jar"
              # 顺带把该目录实际有什么打出来，便于一眼定位（目录不存在时由 || true 兜住）；
              # 同时按该线自己的 base 列出「同 base 的候选」，区分「版本偏移」与「真没构建出来」。
              ls -1 "$proj/build/libs" 2>/dev/null | sed 's/^/    present: /' || true
              ls -1 "$proj"/build/libs/astral_dice-"${ver%%+*}"*.jar 2>/dev/null | sed 's/^/    same-base candidate: /' || true
              MISSING+=("$line")
            fi
          done
          if [[ ${#MISSING[@]} -gt 0 ]]; then
            # 一次把**所有**缺件的线报全（而非撞第一条就退），CI 上跑一遍就能看全要补哪几件。
            echo "::error::aborting release: ${#MISSING[@]} line(s) without a usable jar (${MISSING[*]})"
            exit 1
          fi
          if [[ ${#JARS[@]} -eq 0 ]]; then
            echo "::error::no jars collected at all — refusing to publish an empty release"
            exit 1
          fi
          echo "release jars (${#JARS[@]}):"
          for j in "${JARS[@]}"; do echo "  ${j##*/}"; done
          # 说明正文拼成一个临时文件后用 `--notes-file` 传入 —— 玩家侧发布说明可达数十 KB,
          # 经 `--notes "$(...)"` 内联会踩长度与引号问题(旧的内联单行写法已废弃)。
          NOTES_ZH="release/$TAG/PLAYER_CHANGELOG_ZH.md"
          NOTES_EN="release/$TAG/PLAYER_CHANGELOG.md"
          NOTES_FILE="$RUNNER_TEMP/astral-dice-release-notes-$TAG.md"
          : > "$NOTES_FILE"
          HAVE_NOTES=0
          if [[ -f "$NOTES_ZH" ]]; then
            cat "$NOTES_ZH" >> "$NOTES_FILE"
            HAVE_NOTES=1
          else
            echo "::warning::player changelog not found: $NOTES_ZH"
          fi
          if [[ -f "$NOTES_EN" ]]; then
            # 中英两份之间插水平分隔线(仅当前面已写入内容时)
            if [[ $HAVE_NOTES -eq 1 ]]; then printf '\n---\n\n' >> "$NOTES_FILE"; fi
            cat "$NOTES_EN" >> "$NOTES_FILE"
            HAVE_NOTES=1
          else
            echo "::warning::player changelog not found: $NOTES_EN"
          fi
          if [[ $HAVE_NOTES -eq 0 ]]; then
            # 兜底(不阻断发布):该版本尚未提供玩家侧发布说明时,至少列出本次构建的附件(实际命中的各线 jar)
            {
              printf 'Astral Dice %s\n\n' "$TAG"
              printf '**附件 / Attachments**\n'
              for j in "${JARS[@]}"; do printf -- '- `%s`\n' "${j##*/}"; done
            } >> "$NOTES_FILE"
            echo "::warning::no release/$TAG/PLAYER_CHANGELOG*.md found — falling back to an attachment list"
          fi
          echo "release notes: $(wc -c < "$NOTES_FILE") bytes"
          # 预发布版本(`-rc` / `-pre` / …)标 --prerelease 且不占 latest；正式版才 --latest。
          if [[ "${{ steps.version.outputs.is_prerelease }}" == '1' ]]; then
            REL_KIND=(--prerelease --latest=false)
          else
            REL_KIND=(--latest --prerelease=false)
          fi
          # 同一 tag 下挂四线的多平台 jar(2026-11-02 起 26.1.2 / fabric 与 P0 两线同批)。说明正文每次刷新,附件则冻结:
          # 逐个核对已有附件名,只补传缺失的,绝不覆盖已有附件字节 —— 避免 CI 件悄悄替换
          # 人工核对/投放过的构建件(否则 Release 与两个整合包 mods 的哈希会对不上)。
          # ⛔ 2026-10-30 用户裁决:Release 附件一经发布即视为冻结,只有缺失的才补传。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Astral Dice $TAG" --notes-file "$NOTES_FILE" "${REL_KIND[@]}"
            # 已有附件名集合(每行一个)。用 $( ) 捕获而不是 mapfile + <(...):命令替换失败会让
            # set -e 生效并中止本 step,而进程替换里的失败会被静默吞掉。
            HAVE_ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            # 2026-11-02 用户指令「同 tag 重发 Release」的一次性放行通道：
            #   默认口径仍是 2026-10-30 裁决的「附件冻结，只补缺失」；只有推送提交信息里
            #   显式带 [republish-assets] 时，才先删同名旧附件再上传本次构建。
            #   该标记只存在于提交信息里，不落任何仓内状态 ⇒ 天然一次性，后续构建自动回到冻结口径。
            REPUBLISH=0
            if [[ "${HEAD_COMMIT_MSG:-}" == *"[republish-assets]"* ]]; then REPUBLISH=1; fi
            if [[ "$REPUBLISH" == "1" ]]; then
              echo "::notice::republish marker found in commit message - replacing existing assets"
              while IFS= read -r name; do
                [[ -z "$name" ]] && continue
                echo "deleting existing asset: $name"
                # 容忍「已经不存在」：并发 run 可能刚把它删掉，或该名从来不在（HAVE_ASSETS 是快照）。
                # 旧写法无任何容错 ⇒ 一次 404 就让整步 exit 1（#144 正是死在这条通道里）。
                # 只对「删除」放水，且失败一律留 ::warning::，不静默吞掉真正的权限/网络错误。
                if ! gh release delete-asset "$TAG" "$name" --yes; then
                  echo "::warning::could not delete asset $name (already gone, or a concurrent run removed it) - continuing"
                fi
              done <<< "$HAVE_ASSETS"
              HAVE_ASSETS=""
            fi
            for j in "${JARS[@]}"; do
              name="${j##*/}"
              # grep -Fxq:整行固定串匹配;命中=0 / 未命中=1,放在 if 条件里不会被 set -e 判失败。
              if grep -Fxq -- "$name" <<< "$HAVE_ASSETS"; then
                echo "::notice::asset already published, skip upload: $name"
              elif [[ "$REPUBLISH" == "1" ]]; then
                # 重发通道（提交信息带 [republish-assets]）：同名旧附件上面已逐个删过；
                # 这里加 --clobber 兜住并发 run 在「删完到上传」这段窗口里刚重建的同名附件，
                # 否则 upload 会以「already exists」失败 ⇒ 又一次莫名其妙的红（#144 形状）。
                # ⚠️ --clobber **只在本通道**使用；冻结口径那支仍绝不覆盖已有字节。
                echo "uploading asset (republish channel, --clobber): $name"
                gh release upload "$TAG" "$j" --clobber
              else
                echo "uploading missing asset: $name"
                # 冻结口径：**不加 --clobber**，绝不覆盖已有附件字节（2026-10-30 用户裁决）。
                # 但并发 run 可能刚抢先上传了同名附件 ⇒ 上传失败后先确认附件是否确实已存在：
                #   确已存在 = 对方赢了这场竞态，warn 后继续（附件仍是本次构建件，且未被覆盖）；
                #   确实不在 = 真失败 ⇒ exit 1（仍不许静默放过）。
                if ! gh release upload "$TAG" "$j"; then
                  if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq -- "$name"; then
                    echo "::warning::upload of $name lost a race but the asset exists now - treating as published (bytes NOT overwritten)"
                  else
                    echo "::error::failed to upload $name and it is still absent from the release"
                    exit 1
                  fi
                fi
              fi
            done
          else
            gh release create "$TAG" \
              "${JARS[@]}" \
              --title "Astral Dice $TAG" \
              --notes-file "$NOTES_FILE" \
              "${REL_KIND[@]}"
          fi
      # 【历史记录】2026-10-25 裁决：原「Create/Update Fabric release (pre-release)」步骤已整段删除，
      #    当时的理由是 P1 两线未获授权移植、产物不可用，故不自动打 tag、不自动建 pre-release。
      #    ⚠️ 2026-11-02 该理由已被取代：四线一并正式发布，26.1.2 / fabric 的 jar 现在由上面的
      #    Create/Update Release 步骤放进**同一个 tag / Release**（不再单独建 fabric pre-release）。
      #    ⇒ 「删除独立 pre-release 步骤」这一动作仍然成立；「P1 产物不可用、需逐次点名」的说法已作废。
