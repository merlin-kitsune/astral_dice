name: Build

on:
  push:
    branches:
      # 发布线分支(本仓已无 main 分支;origin/HEAD 默认分支即此分支)。
      # 原先写的 `main` 是不存在的分支 → push 过滤与下方自动打 tag 永远不生效。
      - 'multi-1.20.1-1.21.1'
      # 合并后的开发主线（原 dev-targetselector 重命名而来）
      - 'multi-dev-next'
    tags:
      # 发布规范:tag 使用不含后缀的基础版本号(如 1.1.3),禁止 v 前缀与 +加载器后缀
      - '[0-9]*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21 (1.21.1 NeoForge)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup JDK 17 (1.20.1 Forge)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Checkout StarEngine Lib (required prerequisite)
        # 前置库 starengine_lib 只在 mavenLocal 发布(无远程 maven),CI 上必须先从源码构建。
        # 注意:ref 固定 main 且与 neoforge-1.21.1/gradle.properties 的 starengine_lib_version 强耦合
        # —— 库版本 bump 后本文件所在的消费方必须同步 bump,否则断在依赖解析。
        uses: actions/checkout@v4
        with:
          repository: merlin-kitsune/starengine_lib
          ref: main
          path: .ci/starengine_lib
          fetch-depth: 1

      - name: Publish StarEngine Lib to mavenLocal
        working-directory: .ci/starengine_lib
        run: ./gradlew publishToMavenLocal

      - name: Check lang sync (neoforge-1.21.1)
        run: python3 tools/check_lang_sync.py --lang-dir neoforge-1.21.1/src/main/resources/assets/astral_dice/lang

      - name: Check lang sync (forge-1.20.1)
        run: python3 tools/check_lang_sync.py --lang-dir forge-1.20.1/src/main/resources/assets/astral_dice/lang

      - name: Build with Gradle (both targets)
        run: ./gradlew build

      - name: Upload Astral Dice JARs
        uses: actions/upload-artifact@v4
        with:
          name: astral_dice-jars
          path: |
            neoforge-1.21.1/build/libs/astral_dice-*.jar
            forge-1.20.1/build/libs/astral_dice-*.jar

      - name: Read base version
        id: version
        run: |
          VERSION=$(grep '^mod_version=' neoforge-1.21.1/gradle.properties | cut -d'=' -f2)
          BASE=${VERSION%%-*}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Create Git tag (release branch push only, stable versions only)
        # 仅在发布线分支(multi-1.20.1-1.21.1)自动打 tag:tag = 基础版本号(去掉 -rc/-pre 与 +后缀),如 1.1.3。
        # 守卫:版本号含 '-'(即 SNAPSHOT/rc/pre)时不打 tag —— 否则 2.0.0-SNAPSHOT.5
        # 会被截成 "2.0.0" 并自动打出正式 tag,把未定型的快照误标为发布。
        # ⚠️ 该分支推送时若 mod_version 不含 '-',会自动建 tag 并触发下面一步发布 Release。
        if: github.event_name == 'push' && github.ref == 'refs/heads/multi-1.20.1-1.21.1'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            echo "Version $VERSION is a pre-release/snapshot (contains '-'), skip auto tagging"
            exit 0
          fi
          TAG="${{ steps.version.outputs.base }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create/Update GitHub Release (tag push only, both JARs)
        # 打 tag(如 1.1.3)后自动发布:附件 = 1.21.1 与 1.20.1 两个 jar。
        # 玩家还需要对应的前置:starengine_lib(见仓库 README)。
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          LIB=$(grep '^starengine_lib_version=' neoforge-1.21.1/gradle.properties | cut -d'=' -f2)
          NOTES="Astral Dice $TAG — 1.21.1 (NeoForge) + 1.20.1 (Forge)"$'\n\n'"Requires: starengine_lib $LIB (https://github.com/merlin-kitsune/starengine_lib/releases)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Astral Dice $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" \
              neoforge-1.21.1/build/libs/astral_dice-*.jar \
              forge-1.20.1/build/libs/astral_dice-*.jar \
              --title "Astral Dice $TAG" \
              --notes "$NOTES" \
              --latest
          fi
