plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

// 注:wrapper 任务属根项目(见根 build.gradle);本文件以 neoforge-1.21.1/build.gradle 为模板。
// 本子项目 = MC 26.1.2 / NeoForge 26.1.2.109 / Java 25(第三条线,与 1.21.1、1.20.1 并存)。

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    //
    // 26.1.2 起数据生成拆成两次运行(runClientData / runServerData),而原版
    // HashCache 在每次运行结束时会**删除输出目录下它不认识的所有文件**
    // (DataGenerator.Cached#run → HashCache#purgeStaleAndWrite,allowedFiles 只含本次运行
    // 注册的 provider 产物)。因此若两次运行共用 src/generated/resources,
    // 后运行的那次会把前一次的产物整树删掉 —— 实测 runServerData 删掉 246 个物品模型、
    // runClientData 再删掉 216 个配方/进度文件。故资产与数据各用一个输出根,互不干涉:
    //   · src/generated/resources       ← runServerData(data/…:配方、进度、标签)
    //   · src/generated/clientResources ← runClientData(assets/…:物品模型定义与模型)
    // 两个根都作为主资源集目录参与 processResources / jar(见下方第二行 srcDir)。
    srcDir('src/generated/resources')
    srcDir('src/generated/clientResources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("**/.cache") // datagen cache files(两个输出根下都有 .cache)
    exclude("INSTRUCTIONS.md")
    exclude("mc-src/**")
}

repositories {
    mavenCentral()
    maven { url = uri('https://maven.neoforged.net/releases') }
    // ── 模组来源硬规则(2026-09-17 用户要求)────────────────────────────────
    // 见 AGENTS.md「模组依赖添加规则(统一口径)」:第三方**模组**(含其附属/前置模组)工件只允许来自
    // Curse Maven 与 Modrinth Maven。`exclusiveContent` 同时声明仓库并把这两个 group 从其它所有仓库
    // 排除 ⇒ 任何 `curse.maven:` / `maven.modrinth:` 坐标都不可能从别处解析(与阶段 P 的
    // `tools/check_mod_sources.ps1` 静态守门互补)。
    exclusiveContent {
        forRepository { maven { url 'https://www.cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
    exclusiveContent {
        forRepository { maven { url 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    // 非模组库/官方工件仍从各自仓库解析
    // KubeJS + Rhino are resolved from the KubeJS maven.
    maven { url 'https://maven.latvian.dev/releases' }
    // KubeJS 的传递依赖 Architectury(直接坐标已改 Curse Maven,本仓库保留给传递/可选工件解析)
    maven { url 'https://maven.architectury.dev' }
    // KubeJS transitive dependency animated-gif-lib-for-java
    maven { url 'https://jitpack.io' }
    // JEI 官方 maven:直接坐标已改 Curse Maven(2026-09-17),本仓库保留给可能的传递/可选工件与历史坐标
    maven { url 'https://maven.blamejared.com' }
    // Mixin:26.1.2 的 NeoForge 运行时带的是 **Fabric 分支** net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7
    // (不再是 21.1 时代的 org.spongepowered:mixin:0.8.5),编译期注解类从 Fabric maven 取。
    maven { url 'https://maven.fabricmc.net/' }
}

base {
    archivesName = 'astral_dice'
}

// Minecraft 26.1.2 的 javaVersion = java-runtime-epsilon / majorVersion 25(1.21.1 为 21)
// ⇒ 本子项目 toolchain 必须是 Java 25(本机 C:\Program Files\Zulu\zulu-25;缺失时由根 foojay 解析器自动下载)。
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // 无 parchment 块:Parchment 官方 maven 对 26.1.x / 26.2 全部 404(仅到 1.21.x),
    // 声明它会直接构建失败。原版写法一律以本版本反编译源码为准:
    //   neoforge-26.1.2/build/moddev/artifacts/neoforge-26.1.2.109-sources.jar

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // 版本隔离:开发测试游戏目录统一放在仓库根 run/26.1.2,
        // 与 1.21.1(run/1.21.1)、1.20.1(run/1.20.1)互不污染 mods/config/saves
        configureEach {
            gameDirectory = rootProject.file('run/26.1.2')
        }

        client {
            client()

            // 自动化测试:gradlew runClient -Pquickplay=<世界名> 直接进入指定单机世界
            if (project.hasProperty('quickplay')) {
                programArgument '--quickPlaySingleplayer'
                programArgument project.findProperty('quickplay')
            }

            // 自动化测试:固定游戏窗口尺寸 1920x1080(便于 OCR 读取画面与屏幕坐标换算)
            programArgument '--width'
            programArgument '1920'
            programArgument '--height'
            programArgument '1080'
        }

        server {
            server()
            programArgument '--nogui'
        }

        // 数据生成(26.1.2 变更):NeoForge 26.1.x 的 userdev 运行类型不再有单一 "data",
        // 改为 clientData(DataClient)/ serverData(DataServer)两种,且**两者派发不同事件**:
        //   runClientData → GatherDataEvent.Client(assets 物品模型,客户端 provider)
        //   runServerData → GatherDataEvent.Server(data 配方/标签等,服务端 provider)
        // 因此原来一次 runData 生成全部资源的做法在 26.1.2 必须拆成两次运行。
        clientData {
            clientData()

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            // 客户端资产输出到独立根 src/generated/clientResources(见 sourceSets 注释)。
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/clientResources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // 服务端数据(配方/进度/标签等, PackType.SERVER_DATA)。26.1.2 起 clientData 只派发
        // GatherDataEvent.Client,服务端 provider 必须由 serverData 生成,
        // 任务名 :neoforge-26.1.2:runServerData。
        // ⚠️ 输出目录必须与 clientData 不同(原因见上方 sourceSets 注释:HashCache 会删除
        //    本次运行之外的产物),否则两次运行会互相清空对方的生成结果。
        serverData {
            serverData()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // NOTE: 26.1.2 的 NeoForge 已把加载器自身的日志前缀统一到 neoforge.*;此处仅作兼容保留,
            //       未知 system property 会被忽略,不影响启动。
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Curios API(必须的前置):15.0.0+26.1.2(Modrinth version id dRnRThvD)
    // 其 mods.toml 声明 neoforge [26.1.0.0,),故本模组的 curios 门槛同步升至 [15,)
    implementation 'maven.modrinth:curios:dRnRThvD'
    // 帕秋莉手册(可选):26.1-94-beta(Modrinth version id 2CsnFLom)
    implementation 'maven.modrinth:patchouli:2CsnFLom'
    // JEI(配方查看,测试环境用);26.1.2 线 29.37.0.99
    // 2026-09-17 起按统一口径改走 Curse Maven(CF 文件 8886511 = `jei-26.1.2-neoforge-29.37.0.99.jar`,1908683 字节)
    implementation "curse.maven:jei-238222:8886511"
    // Mixin:26.1.2 的 NeoForge 运行时自带 Mixin(Fabric 分支 0.17.3+mixin.0.8.7),
    // 编译期仅需注解类;NeoForge 编译/运行同为 Mojmap,无需 refmap。
    compileOnly 'net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7'

    // 注意:Iron's Spells 'n Spellbooks 联动在 26.1.2 **不移植**——该模组在 Modrinth 上最高只发布到 1.21.1,
    // 没有 26.1.x / 26.2 构建,故 event/IronSpellbooksCompat.java、base-mod-compile-libs/irons_spellbooks.jar
    // 与本子项目一并移除(SpellDamageRegistry 里的 irons_spellbooks:* 只是字符串 id,保留无害)。
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            curios_version_range   : curios_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// === 编译产物分发规则 ===
// 默认行为:每次构建完成后自动推送到仓库根 run/26.1.2/mods(本机 runClient 调试)、
// 仓库根目录 build/libs,并推送到整合包 mods 目录(删除旧版后复制新版)。
// 整合包位置:D:/.minecraft/versions/26.1.2 模组测试/mods
// (2026-09-17 修正:原指向 `26.1.2-NeoForge_26.1.2.109`,该目录在本机**并不存在**,
//  于是 pushToGame 每次都只打印 "pack dir not found, skipped" 而静默不部署;
//  现按 1.20.1 侧 `1.20.1 模组测试` 的同名规则改为 `26.1.2 模组测试`。)
def devRunModsDir = rootProject.file('run/26.1.2/mods')
def packModsDir = file('D:/.minecraft/versions/26.1.2 模组测试/mods')

//
// ⚠️ 约定(2026-09-12 起,同日修订为白名单):**只有发布线分支推送整合包。**
//   判定依据是当前 git 分支(读 .git/HEAD,兼容普通仓库与 worktree),规则:
//     · 分支出现在 packPushBranches(**白名单**)中 → 允许 pushToGame
//     · 分支不在白名单 / 无法确定分支(detached HEAD/无 .git,如 CI) → 跳过,只打日志,不算失败
//     · 传 -PdeployToPack 或 -PpackPush    → 强制推送,覆盖上述判定(手动出包用)
//   理由:整合包是玩家手测环境,开发分支(如 `multi-dev-next` / `wt/*`)的产物会把不匹配的
//   组合灌进测试包,表现为启动期报错或行为与源码不符。本线(26.1.2)不依赖前置库
//   starengine_lib,故没有「库 jar 与 mod jar 成对匹配」自检(另两线有)。
//   **白名单优于黑名单**:新开的分支(含 DSH/WorkBuddy 自动建的 `wt/*` worktree 分支)
//   默认落在"不推送"一侧,不会因为忘了把分支名登记进黑名单而误推、误删整合包里的正式 jar。
//   需要推送时:把分支加进白名单;或单次用 -PdeployToPack 强制。
//
// --- 整合包推送的 git 分支守卫(配合上方约定;与 neoforge-1.21.1 / forge-1.20.1 同形同文案) ---
// 分支判定放在**执行期**(见 pushToGame 的 doLast),不做配置期求值:
//   ① 每次构建都读当时的 .git/HEAD,切分支后立即生效,不存在配置缓存陈旧问题;
//   ② 不把 Provider/闭包塞进 configuration-cache,避免缓存序列化限制与行为漂移。
// dotGitEntry 是配置期算好的 File(可序列化),执行期读它即可 —— 普通仓库这里就是
// .git 目录;worktree 下它是**文件**,内容为 `gitdir: <path>`,真正的 HEAD 在 gitdir 下。
// 【白名单】只有列在这里的分支允许把 jar 推进整合包;其余分支(含 worktree 的 `wt/*`)一律跳过。
def packPushBranches = ['multi-1.20.1-1.21.1']
def forcePackPush = project.hasProperty('deployToPack') || project.hasProperty('packPush')
def dotGitEntry = rootProject.file('.git')
def jarArchiveProvider = tasks.named('jar').flatMap { it.archiveFile }

tasks.register('pushToDevRun') {
    group = 'build'
    description = 'Copy the built mod jar to the dev run mods folder (root run/26.1.2/mods) and remove old versions.'
    dependsOn tasks.named('jar')
    doLast {
        def jarFile = jarArchiveProvider.get().asFile
        if (!jarFile.exists()) {
            logger.warn("pushToDevRun: built jar not found, skipped: ${jarFile}")
            return
        }
        if (!devRunModsDir.exists()) {
            devRunModsDir.mkdirs()
        }
        def stale = devRunModsDir.listFiles().findAll { File f ->
            f.isFile() && f.name.startsWith('astral_dice-') && f.name.endsWith('.jar')
        }
        stale.each { it.delete() }
        def target = new File(devRunModsDir, jarFile.name)
        target.withOutputStream { out ->
            jarFile.withInputStream { inp -> inp.transferTo(out) }
        }
        logger.lifecycle("pushToDevRun: pushed ${jarFile.name} -> ${devRunModsDir}")
    }
}

// 默认随 build 推送到整合包 mods 目录
tasks.register('pushToGame') {
    group = 'build'
    description = 'Copy the built mod jar to the bound game pack mods folder and remove old versions. Only the release branch (see packPushBranches) pushes; force with -PdeployToPack.'
    dependsOn tasks.named('jar')
    doLast {
        // --- 约定:只有发布线分支推送整合包(白名单,见文件顶部「编译产物分发规则」) ---
        if (!forcePackPush) {
            // 执行期读取当前分支:普通仓库 .git 是目录;worktree 的 .git 是文件,内容记录 gitdir
            def readGitBranch = { File dotGit ->
                File headFile = null
                if (dotGit.isDirectory()) {
                    def hf = new File(dotGit, 'HEAD')
                    headFile = hf.isFile() ? hf : null
                } else if (dotGit.isFile()) {
                    def m = dotGit.text.trim() =~ /^gitdir:\s*(.+)$/
                    if (m.find()) {
                        def gd = new File(m.group(1).trim())
                        if (!gd.isAbsolute()) {
                            gd = new File(dotGit.parentFile, m.group(1).trim())
                        }
                        def hf = new File(gd, 'HEAD')
                        headFile = hf.isFile() ? hf : null
                    }
                }
                if (headFile == null) {
                    return ''
                }
                def s = headFile.text.trim()
                s.startsWith('ref: refs/heads/') ? s.substring('ref: refs/heads/'.length()) : ''
            }
            def branch = readGitBranch(dotGitEntry)
            if (branch.isEmpty()) {
                logger.lifecycle('pushToGame: skipped — 无法确定当前 git 分支(detached HEAD 或无 .git);如需强制推送请加 -PdeployToPack')
                return
            }
            if (!packPushBranches.contains(branch)) {
                logger.lifecycle("pushToGame: skipped — 分支 '${branch}' 不在整合包推送白名单 ${packPushBranches} 内;如需强制推送请加 -PdeployToPack")
                return
            }
        }
        def jarFile = jarArchiveProvider.get().asFile
        if (!jarFile.exists()) {
            logger.warn("pushToGame: built jar not found, skipped: ${jarFile}")
            return
        }
        if (!packModsDir.exists()) {
            // 仅当整合包根目录存在时才创建 mods 子目录;根目录不存在(如 CI 环境)直接跳过
            def packRoot = packModsDir.getParentFile()
            if (packRoot == null || !packRoot.exists()) {
                logger.warn("pushToGame: pack dir not found, skipped: ${packModsDir}")
                return
            }
            packModsDir.mkdirs()
        }
        def stale = packModsDir.listFiles().findAll { File f ->
            // ⚠️ 与 pushToRootBuild 同一口径:必须带完整后缀 `+neoforge_26.1.2`,
            //    否则会把三线并存时用户放进同一目录的其它版本产物误删。
            f.isFile() && f.name.startsWith('astral_dice-') && f.name.endsWith('.jar') && f.name.contains('+neoforge_26.1.2')
        }
        stale.each { it.delete() }
        def target = new File(packModsDir, jarFile.name)
        target.withOutputStream { out ->
            jarFile.withInputStream { inp -> inp.transferTo(out) }
        }
        logger.lifecycle("pushToGame: pushed ${jarFile.name} -> ${packModsDir}")
    }
}

// === 编译产物集中规则:任何版本的编译产物统一复制到仓库根目录 build/libs ===
def rootBuildLibsDir = rootProject.file('build/libs')

tasks.register('pushToRootBuild') {
    group = 'build'
    description = 'Copy the built mod jar to the repository root build/libs (shared by all versions).'
    dependsOn tasks.named('jar')
    doLast {
        def jarFile = jarArchiveProvider.get().asFile
        if (!jarFile.exists()) {
            logger.warn("pushToRootBuild: built jar not found, skipped: ${jarFile}")
            return
        }
        if (!rootBuildLibsDir.exists()) {
            rootBuildLibsDir.mkdirs()
        }
        // 只清理本子项目(neoforge 26.1.2)旧产物:
        // ⚠️ 过滤条件必须带完整后缀 `+neoforge_26.1.2`,不得写成宽泛的 `+neoforge_` ——
        //    否则会把 neoforge-1.21.1 的 `astral_dice-*+neoforge_1.21.1.jar` 一并删掉(三线并存后是硬需求)。
        def stale = rootBuildLibsDir.listFiles().findAll { File f ->
            f.isFile() && f.name.startsWith('astral_dice-') && f.name.endsWith('.jar') && f.name.contains('+neoforge_26.1.2')
        }
        stale.each { it.delete() }
        def target = new File(rootBuildLibsDir, jarFile.name)
        target.withOutputStream { out ->
            jarFile.withInputStream { inp -> inp.transferTo(out) }
        }
        logger.lifecycle("pushToRootBuild: pushed ${jarFile.name} -> ${rootBuildLibsDir}")
    }
}

tasks.named('build') {
    // 统一推送标准:pushToDevRun/pushToRootBuild/pushToGame 均在 build 后默认触发
    finalizedBy tasks.named('pushToDevRun')
    finalizedBy tasks.named('pushToGame')
    // 编译产物集中到仓库根目录 build/libs
    finalizedBy tasks.named('pushToRootBuild')
}
