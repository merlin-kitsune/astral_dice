plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

// 注:wrapper 任务属根项目(见根 build.gradle);本文件以 neoforge-1.21.1/build.gradle 为模板。
// 本子项目 = MC 26.1.2 / NeoForge 26.1.2.109 / Java 25(第三条线,与 1.21.1、1.20.1 并存)。

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
    exclude("INSTRUCTIONS.md")
    exclude("mc-src/**")
}

repositories {
    mavenCentral()
    maven { url = uri('https://maven.neoforged.net/releases') }
    // Curios API is resolved from the Modrinth maven.
    maven { url 'https://api.modrinth.com/maven' }
    // KubeJS + Rhino are resolved from the KubeJS maven.
    maven { url 'https://maven.latvian.dev/releases' }
    // KubeJS transitive dependency Architectury
    maven { url 'https://maven.architectury.dev' }
    // KubeJS transitive dependency animated-gif-lib-for-java
    maven { url 'https://jitpack.io' }
    // JEI 官方 maven(配方查看)
    maven { url 'https://maven.blamejared.com' }
    // Mixin:26.1.2 的 NeoForge 运行时带的是 **Fabric 分支** net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7
    // (不再是 21.1 时代的 org.spongepowered:mixin:0.8.5),编译期注解类从 Fabric maven 取。
    maven { url 'https://maven.fabricmc.net/' }
}

base {
    archivesName = 'astral_dice'
}

// Minecraft 26.1.2 的 javaVersion = java-runtime-epsilon / majorVersion 25(1.21.1 为 21)
// ⇒ 本子项目 toolchain 必须是 Java 25(本机 C:\Program Files\Zulu\zulu-25;缺失时由根 foojay 解析器自动下载)。
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // 无 parchment 块:Parchment 官方 maven 对 26.1.x / 26.2 全部 404(仅到 1.21.x),
    // 声明它会直接构建失败。原版写法一律以本版本反编译源码为准:
    //   neoforge-26.1.2/build/moddev/artifacts/neoforge-26.1.2.109-sources.jar

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // 版本隔离:开发测试游戏目录统一放在仓库根 run/26.1.2,
        // 与 1.21.1(run/1.21.1)、1.20.1(run/1.20.1)互不污染 mods/config/saves
        configureEach {
            gameDirectory = rootProject.file('run/26.1.2')
        }

        client {
            client()

            // 自动化测试:gradlew runClient -Pquickplay=<世界名> 直接进入指定单机世界
            if (project.hasProperty('quickplay')) {
                programArgument '--quickPlaySingleplayer'
                programArgument project.findProperty('quickplay')
            }

            // 自动化测试:固定游戏窗口尺寸 1920x1080(便于 OCR 读取画面与屏幕坐标换算)
            programArgument '--width'
            programArgument '1920'
            programArgument '--height'
            programArgument '1080'
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // NOTE: 26.1.2 的 NeoForge 已把加载器自身的日志前缀统一到 neoforge.*;此处仅作兼容保留,
            //       未知 system property 会被忽略,不影响启动。
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Curios API(必须的前置):15.0.0+26.1.2(Modrinth version id dRnRThvD)
    // 其 mods.toml 声明 neoforge [26.1.0.0,),故本模组的 curios 门槛同步升至 [15,)
    implementation 'maven.modrinth:curios:dRnRThvD'
    // 帕秋莉手册(可选):26.1-94-beta(Modrinth version id 2CsnFLom)
    implementation 'maven.modrinth:patchouli:2CsnFLom'
    // JEI(配方查看,测试环境用);26.1.2 线 29.37.0.99
    implementation "mezz.jei:jei-26.1.2-neoforge:29.37.0.99"
    // Mixin:26.1.2 的 NeoForge 运行时自带 Mixin(Fabric 分支 0.17.3+mixin.0.8.7),
    // 编译期仅需注解类;NeoForge 编译/运行同为 Mojmap,无需 refmap。
    compileOnly 'net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7'

    // 注意:Iron's Spells 'n Spellbooks 联动在 26.1.2 **不移植**——该模组在 Modrinth 上最高只发布到 1.21.1,
    // 没有 26.1.x / 26.2 构建,故 event/IronSpellbooksCompat.java、base-mod-compile-libs/irons_spellbooks.jar
    // 与本子项目一并移除(SpellDamageRegistry 里的 irons_spellbooks:* 只是字符串 id,保留无害)。
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            curios_version_range   : curios_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// === 编译产物分发规则 ===
// 默认行为:每次构建完成后自动推送到仓库根 run/26.1.2/mods(本机 runClient 调试)、
// 仓库根目录 build/libs,并推送到整合包 mods 目录(删除旧版后复制新版)。
// 整合包位置:D:/.minecraft/versions/26.1.2-NeoForge_26.1.2.109/mods
def devRunModsDir = rootProject.file('run/26.1.2/mods')
def packModsDir = file('D:/.minecraft/versions/26.1.2-NeoForge_26.1.2.109/mods')

def jarArchiveProvider = tasks.named('jar').flatMap { it.archiveFile }

tasks.register('pushToDevRun') {
    group = 'build'
    description = 'Copy the built mod jar to the dev run mods folder (root run/26.1.2/mods) and remove old versions.'
    dependsOn tasks.named('jar')
    doLast {
        def jarFile = jarArchiveProvider.get().asFile
        if (!jarFile.exists()) {
            logger.warn("pushToDevRun: built jar not found, skipped: ${jarFile}")
            return
        }
        if (!devRunModsDir.exists()) {
            devRunModsDir.mkdirs()
        }
        def stale = devRunModsDir.listFiles().findAll { File f ->
            f.isFile() && f.name.startsWith('astral_dice-') && f.name.endsWith('.jar')
        }
        stale.each { it.delete() }
        def target = new File(devRunModsDir, jarFile.name)
        target.withOutputStream { out ->
            jarFile.withInputStream { inp -> inp.transferTo(out) }
        }
        logger.lifecycle("pushToDevRun: pushed ${jarFile.name} -> ${devRunModsDir}")
    }
}

// 默认随 build 推送到整合包 mods 目录
tasks.register('pushToGame') {
    group = 'build'
    description = 'Copy the built mod jar to the bound game pack mods folder and remove old versions.'
    dependsOn tasks.named('jar')
    doLast {
        def jarFile = jarArchiveProvider.get().asFile
        if (!jarFile.exists()) {
            logger.warn("pushToGame: built jar not found, skipped: ${jarFile}")
            return
        }
        if (!packModsDir.exists()) {
            // 仅当整合包根目录存在时才创建 mods 子目录;根目录不存在(如 CI 环境)直接跳过
            def packRoot = packModsDir.getParentFile()
            if (packRoot == null || !packRoot.exists()) {
                logger.warn("pushToGame: pack dir not found, skipped: ${packModsDir}")
                return
            }
            packModsDir.mkdirs()
        }
        def stale = packModsDir.listFiles().findAll { File f ->
            f.isFile() && f.name.startsWith('astral_dice-') && f.name.endsWith('.jar')
        }
        stale.each { it.delete() }
        def target = new File(packModsDir, jarFile.name)
        target.withOutputStream { out ->
            jarFile.withInputStream { inp -> inp.transferTo(out) }
        }
        logger.lifecycle("pushToGame: pushed ${jarFile.name} -> ${packModsDir}")
    }
}

// === 编译产物集中规则:任何版本的编译产物统一复制到仓库根目录 build/libs ===
def rootBuildLibsDir = rootProject.file('build/libs')

tasks.register('pushToRootBuild') {
    group = 'build'
    description = 'Copy the built mod jar to the repository root build/libs (shared by all versions).'
    dependsOn tasks.named('jar')
    doLast {
        def jarFile = jarArchiveProvider.get().asFile
        if (!jarFile.exists()) {
            logger.warn("pushToRootBuild: built jar not found, skipped: ${jarFile}")
            return
        }
        if (!rootBuildLibsDir.exists()) {
            rootBuildLibsDir.mkdirs()
        }
        // 只清理本子项目(neoforge 26.1.2)旧产物:
        // ⚠️ 过滤条件必须带完整后缀 `+neoforge_26.1.2`,不得写成宽泛的 `+neoforge_` ——
        //    否则会把 neoforge-1.21.1 的 `astral_dice-*+neoforge_1.21.1.jar` 一并删掉(三线并存后是硬需求)。
        def stale = rootBuildLibsDir.listFiles().findAll { File f ->
            f.isFile() && f.name.startsWith('astral_dice-') && f.name.endsWith('.jar') && f.name.contains('+neoforge_26.1.2')
        }
        stale.each { it.delete() }
        def target = new File(rootBuildLibsDir, jarFile.name)
        target.withOutputStream { out ->
            jarFile.withInputStream { inp -> inp.transferTo(out) }
        }
        logger.lifecycle("pushToRootBuild: pushed ${jarFile.name} -> ${rootBuildLibsDir}")
    }
}

tasks.named('build') {
    // 统一推送标准:pushToDevRun/pushToRootBuild/pushToGame 均在 build 后默认触发
    finalizedBy tasks.named('pushToDevRun')
    finalizedBy tasks.named('pushToGame')
    // 编译产物集中到仓库根目录 build/libs
    finalizedBy tasks.named('pushToRootBuild')
}
