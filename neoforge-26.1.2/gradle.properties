# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 注意:本子项目**没有** parchment 配置。
# Parchment 官方 maven 对 26.1 / 26.1.1 / 26.1.2 / 26.2 全部返回 404(仅到 1.21.x 为止,1.21.9 仍有),
# 因此 build.gradle 里不得出现 parchment { ... } 块;查证见 docs/compat-26.1.2-neoforge.md。

# Environment Properties
# 版本矩阵(Minecraft 26.x 起改为日期式版本号:26.1 = 2026 年首个正式版):
#   Minecraft 26.1.2(release,2026-04-09) / NeoForge 26.1.2.109 / Java 25
# 该 MC 版本的 javaVersion = { component: java-runtime-epsilon, majorVersion: 25 }
# (对照 1.21.1 = java-runtime-delta / 21),故 toolchain 必须为 25。
minecraft_version=26.1.2
# 精确到本补丁版;26.1 / 26.1.1 与本版 API 基本一致,但本项目只按 26.1.2 验收。
minecraft_version_range=[26.1.2]
# NeoForge 版本号 = <MC 版本>.<构建号>;26.1.2 线最新稳定为 26.1.2.109
# (26.1.2.71 是首个非 -beta;更新的 26.2.x / 26.3.0.1-beta 不属本线)。
# 严禁在本分支为 26.2/26.3 做适配。
neo_version=26.1.2.109
# 加载器语言区间仍用 FML 主版本(与 1.21.1 侧同构)
loader_version_range=[1,)
# NeoForge 自身的依赖区间(二号位 band:26.1.x.y 全接纳,26.2/26.3 拒绝)。
# 与 1.21.1 侧的 `[21.1,21.2)` 同构;唯一的消费方是模板 ${neo_version_range}。
neo_version_range=[26.1.0.0,26.2)
# Curios 门槛:26.1.2 线的 Curios 15.0.0+26.1.2 自带 neoforge [26.1.0.0,),故本模组要求 >= 15
# (1.21.1 侧对应 [9,))。
curios_version_range=[15,)
# KubeJS for automated testing (探针脚本运行时,26.1.2 = 8.x 线)
# ⚠️ 这里写的是 **maven 坐标版本**,不是 jar 里的 mod version ——
#    KubeJS 26.1.2-8.0.6 的 mods.toml `version = "26.1.2-8.0.6"`,但 maven 上的 artifact
#    路径同样是 `.../kubejs-neoforge/26.1.2-8.0.6/kubejs-neoforge-26.1.2-8.0.6.jar`
#    (**没有** `+neoforge` 后缀;写 `26.1.2-8.0.6+neoforge` 会 404)。
#    该值由 scripts/test/mt_env.ps1 读取(下载 KubeJS+Rhino 到 run/26.1.2/mods)。
kubejs_version=26.1.2-8.0.6

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=astral_dice
# The human-readable display name for the mod.
mod_name=Astral Dice
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT License
# The mod version. See https://semver.org/
# 三线并存约定:版本号带加载器 + MC 版本后缀,与 +neoforge_1.21.1 / +forge_1.20.1 区分。
# 2026-09-17 用户裁决:26.1.2 线为**低优先级版本**,版本号单独改为 `1.2.1-beta`(与主线 1.2.1 的
# 发布态区分开);按「版本号格式」硬规则仍带加载器后缀,即 mod_version = 1.2.1-beta+neoforge_26.1.2
# (后缀是 pushToRootBuild / pushToGame 旧产物清理的匹配依据,不得省略)。
mod_version=1.3.2-beta.1+neoforge_26.1.2
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.merlinkitsune.astral_dice

## 前置库坐标(StarEngine Lib,独立仓库 https://github.com/merlin-kitsune/starengine_lib,发布到 mavenLocal)
# 升级库版本时须与库仓库 gradle.properties 的 lib_version 同步
# 2026-09-17:本线原为「完全未接入库」的独立移植线,现按收编任务与另两线一致消费该库
# (库已为三平台各发布一份:common + neoforge-1.21.1 + forge-1.20.1 + neoforge-26.1.2)。
# .5:合并完成后库侧按期删除过渡符号(EventTargetCollector.collectTargets + 女仆收集、
#    GameplayConstants 的三个事件常量、effect/ReadyEffect);本线对前三者零引用,
#    effect/ReadyEffect 因本线仍在使用旧「待命等待器」而**保留本地副本**(库内已删,不得引用)。
# .6:库侧修复**库自身被 FML 拒载**的根因(元数据修复,不是 API 变更):1.21.1 侧 loaderVersion 曾误填
#    NeoForge 版本带 [21.1,21.2)(语言槽比的是 javafml 语言提供者版本 4.0.42)⇒ 改 [1,);forge 侧
#    门槛同步对齐。本线(26.1.2)的 loaderVersion 本就正确([1,))、库内 Java 源码零改动,故本线
#    只是随共享版本线同步坐标与区间下界,避免解析到 mavenLocal 里会被拒载的 `.5` jar。
# .10:库侧把版本统一为 `1.0.0-SNAPSHOT.10`(与本站 `2.0.0-SNAPSHOT.10` 的 patch 段同号),并并入原
#    `.7` 在途的 forge `pack.mcmeta` 修复(本线不走该代码路径,仅随共享版本线同步坐标与区间下界)。
#    库侧 `.7` 只发布过 mavenLocal、从未入库,故并入 `.10`,本线引脚由 `.7` 提到 `.10`。
# 1.0.0:**首个正式版** —— 由快照系列最后一档 `1.0.0-SNAPSHOT.16` 规范化而来,库内 Java 源码零改动,
#    产物文件名由 `starengine_lib-neoforge-26.1.2-1.0.0-SNAPSHOT.16.jar` 变为 `…-1.0.0.jar`。
#    ⚠️ **库侧同时立下兼容性契约(全局约定,2026-09-22)**:同一主版本号内(第一位数字不变,当前 = 1.x)
#    **禁止任何破坏性更新**;破坏性变更必须升第一位(1.x → 2.x)并同步收紧下方 `_version_range` 下界。
#    ⇒ 本模组无需为库 1.x 内的升级改动代码;下方区间即该契约的机器可读表达。
# 1.0.3:「额外敌对判定」seam + **敌对目标口径重写**(2026-09-24)
#    ⚠️ 原拟的 `1.0.2` 已提交但**从未推送、从未发布** ⇒ 按「未发布版本的改动并入原条目」
#    一并并入本版(故本条目同时承载那批内容)。
#    ① **seam(纯新增)**:库的 `combat/HostileTargets` 新增消费方注入入口(`ExtraHostileProbe` /
#       `installExtraHostileProbe`),供本模组把**试验假人**(dummmmmmy)这类「既非 Enemy、
#       也不是中立生物」的实体声明为敌对目标(否则需要敌对目标的效果选不中它)。
#    ② ⚠️ **口径重写(语义变更)**:库的 `isHostile` 由「敌对生物 ∪ 已被激怒的中立生物」改为
#       「敌对生物 ∪ 中立生物(宠物除外)」—— 去掉 `isAngry()` 要求(未激怒的狼 / 铁傀儡 / 北极熊 /
#       蜜蜂现在也算敌对)、新增「宠物除外」(已驯服的 TamableAnimal;实测只影响狼)。
#       按 1.x 契约**本应升主版本**,经用户 2026-09-24 裁决作为**玩法口径特例**按补丁位发布。
#    ⇒ 下界收紧到 `[1.0.3,2.0)`:更旧的库 jar 会在加载期被判「缺必需前置」而明确报错,
#    而不是运行到 `installExtraHostileProbe`、或吃到旧口径时才出问题。
starengine_lib_version=1.0.4
starengine_lib_group=com.merlinkitsune.starenginelib
# mods.toml 中声明的前置版本区间。
# ⚠️ **自库 1.0.0 起,下界即库的当前版本(现为 [1.0.3,2.0))—— 它是库「兼容性契约」的机器可读表达**:
#    库侧已立全局约定 —— 同一主版本号内(第一位数字不变,当前 = 1.x)**禁止任何破坏性更新**
#    (不得删/改名任何 public 类型、方法、字段、常量,不得改可见性/签名/语义;只允许新增),
#    破坏性变更必须升第一位(1.x → 2.x)并同步收紧本下界。故区间内任何 1.x 版本都可原位替换。
#    政策原文见库 README §6 与 gradle.properties 的 1.0.2 条目(契约正文在 1.0.0 条目)。
# ⚠️ **以下为快照时代(1.0.0-SNAPSHOT.*)的历史口径,自 1.0.0 起不再适用,仅供解读旧 pin**:
#    那时下界必须写 `1.0.0-SNAPSHOT.<序号>` —— 按 Maven ComparableVersion 语义
#    `1.0.0-SNAPSHOT.x < 1.0.0`,写成 [1.0.0,2.0) 会拒绝所有快照版,游戏以「不满足必需前置」拒绝启动;
#    相邻快照之间又二进制不兼容且 modId 相同,收紧后可让旧 jar 被明确判为「缺必需前置」;
#    `.5` 的库 jar 另有一层硬缺陷(loaderVersion 误填加载器版本带 ⇒ FML 语言匹配阶段直接拒载),
#    `.7` 的库 jar 缺 `pack.mcmeta`(仅影响 Forge 1.20.1 侧的资源包注册)。
# 完整实测矩阵见 neoforge-1.21.1/gradle.properties 同字段注释。
starengine_lib_version_range=[1.0.4,2.0)
