# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03
# Environment Properties
# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.20.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.20.1]
# The Forge version must agree with the Minecraft version to get a valid artifact
# 47.4.10 = 1.20.1 recommended(2026-08 查询;最新 47.4.23)
forge_version=1.20.1-47.4.10
# Forge 版本门槛**不再单独配置**:由上面的 forge_version 在 build.gradle 中自动派生为**两个**区间——
#   ① 依赖区间 `[<forge_version>,<major+1>)`(当前 = [47.4.10,48))→ mods.toml 的 `modId="forge"` 强制依赖;
#   ② 语言区间 `[<major>,<major+1>)`(当前 = [47,48))→ mods.toml 的 `loaderVersion`(javafml 语言提供者
#      的版本号是主系列号 47,不能用完整版本号,否则 FML 报 fml.language.missingversion 拒绝加载本模组)。
# 两者叠加后,低于 47.4.10 的 Forge 会在 mods.toml 解析/依赖排序阶段被明确拒绝,而不是照常加载后才在
# Mixin 变换阶段抛错。禁止在此另行硬编码加载器版本区间。
# KubeJS version for automated testing (Curios slot checking scripts), 1.20.1 = 2001.6.x series
# (默认未启用,见 build.gradle 注释)
kubejs_version=2001.6.5-build.26

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=astral_dice
# The human-readable display name for the mod.
mod_name=Astral Dice
# The license of the mod. Review your options here: https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT License
# The mod version. See https://semver.org/
# 多版本分支约定:版本号带加载器后缀(+forge_1.20.1),与 1.21.1 分支产物区分
mod_version=1.3.1+forge_1.20.1
# The group ID for the mod. It is only important for publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.merlinkitsune.astral_dice

## 前置库坐标(StarEngine Lib,独立仓库 https://github.com/merlin-kitsune/starengine_lib,发布到 mavenLocal)
# 升级库版本时须与库仓库 gradle.properties 的 lib_version 同步
# .2:库侧包名 starengine -> starenginelib,本模组 import 与 group 同步改写。
# .3:库侧移除 Cloth Config 前置与公共配置模块,GameplayConfigValues 收敛为 6 字段 ——
#    本模组配置回归自己的 TOML(ModCommonConfig, ForgeConfigSpec);
# .4:库侧新增 effect/ReadyEffect(三线共享的自包含单元补齐下沉,本模组当前不引用该类);
# .5:合并完成后库侧按期删除过渡符号(collectTargets+女仆收集、三个事件常量、ReadyEffect),
#    本模组三线对其零引用;事件框架三件套因本模组 AstralEventSystem 仍留 4 处 import 而暂留。
# .6:库侧修复**库自身被 FML 拒载**的根因(元数据修复,不是 API 变更):1.21.1 侧 loaderVersion 曾误填
#    NeoForge 版本带(语言槽比的是 javafml 语言提供者版本 4.0.42)⇒ 改 [1,);本侧顺带对齐已文档化
#    口径 —— loaderVersion 由 [47,) 收敛为语言主系列区间 [47,48),`modId="forge"` 依赖改用由
#    build.gradle 从 forge_version 派生的精确区间 [47.4.10,48)(原先该依赖也写 [47,))。
#    库内 Java 源码零改动;必须 bump 以避免继续解析 mavenLocal 里会被拒载的 `.5` jar。
# .10:库侧把版本统一为 `1.0.0-SNAPSHOT.10`(与本站 `2.0.0-SNAPSHOT.10` 的 patch 段同号),并并入原
#    `.7` 在途的修复(本侧新增 `pack.mcmeta`)。库侧 `.7` 只发布过 mavenLocal、从未入库,故并入 `.10`;
#    本侧引脚由 `.7` 提到 `.10`,避免继续解析 mavenLocal 里缺 `pack.mcmeta` 的那份 `.7` 库 jar。
# .12:库侧新增 `GameplayConstants.ALLOW_FIREARM_DAMAGE`(public static boolean,默认 false),
#    并把 `GameplayConfigValues` 由 6 分量扩为 7 分量(第 7 个 = boolean allowFirearmDamage,追加在末尾),
#    配合 `applyConfig(...)` 写入。本线据此把法伤模块对枪弹/炮弹类伤害的**硬编码无条件屏蔽**改为由公共
#    配置 `allow_firearm_damage`(默认 false)控制 —— 默认行为与改动前逐字等价。必须收紧下界:`.11`
#    的库 jar 没有该字段,运行期会 `NoSuchFieldError`。
# .14:库侧新增 `economy` 包(**玩家余额账本** —— 星币钱包的库侧底层,对标 SG-Economy 的位置):
#    `StarEngineEconomy`(对外 API + 离线读;存储缺失时返回 0/false 且不抛异常,供 FTB 等第三方安全联动)、
#    `EconomyStorage`(平台存储 seam)、`StarCoinCommand`(`/starcoin add|set|remove|get|rank`)、
#    `CommandPermissionGate`(权限判定 seam)。余额落在玩家持久化 NBT(库不注册注册表条目),
#    由 `PlayerEvent.Clone` 显式复制 ⇒ 不因死亡丢失。本线据此实现星币钱包。必须收紧下界:
#    `.12` 的库 jar 没有这些类,运行期会 NoClassDefFoundError。
# 1.0.0:**首个正式版** —— 由快照系列最后一档 `1.0.0-SNAPSHOT.16` 规范化而来,库内 Java 源码零改动,
#    产物文件名由 `starengine_lib-forge-1.20.1-1.0.0-SNAPSHOT.16.jar` 变为 `…-1.0.0.jar`。
#    ⚠️ **库侧同时立下兼容性契约(全局约定,2026-09-22)**:同一主版本号内(第一位数字不变,当前 = 1.x)
#    **禁止任何破坏性更新**;破坏性变更必须升第一位(1.x → 2.x)并同步收紧下方 `_version_range` 下界。
#    ⇒ 本模组无需为库 1.x 内的升级改动代码;下方区间即该契约的机器可读表达。
# 1.0.3:「额外敌对判定」seam + **敌对目标口径重写**(2026-09-24)
#    ⚠️ 原拟的 `1.0.2` 已提交但**从未推送、从未发布** ⇒ 按「未发布版本的改动并入原条目」
#    一并并入本版(故本条目同时承载那批内容)。
#    ① **seam(纯新增)**:库的 `combat/HostileTargets` 新增消费方注入入口(`ExtraHostileProbe` /
#       `installExtraHostileProbe`),供本模组把**试验假人**(dummmmmmy)这类「既非 Enemy、
#       也不是中立生物」的实体声明为敌对目标(否则需要敌对目标的效果选不中它)。
#    ② ⚠️ **口径重写(语义变更)**:库的 `isHostile` 由「敌对生物 ∪ 已被激怒的中立生物」改为
#       「敌对生物 ∪ 中立生物(宠物除外)」—— 去掉 `isAngry()` 要求(未激怒的狼 / 铁傀儡 / 北极熊 /
#       蜜蜂现在也算敌对)、新增「宠物除外」(已驯服的 TamableAnimal;实测只影响狼)。
#       按 1.x 契约**本应升主版本**,经用户 2026-09-24 裁决作为**玩法口径特例**按补丁位发布。
#    ⇒ 下界收紧到 `[1.0.3,2.0)`:更旧的库 jar 会在加载期被判「缺必需前置」而明确报错,
#    而不是运行到 `installExtraHostileProbe`、或吃到旧口径时才出问题。
starengine_lib_version=1.0.3
starengine_lib_group=com.merlinkitsune.starenginelib
# mods.toml 中声明的前置版本区间。
# ⚠️ **自库 1.0.0 起,下界即库的当前版本(现为 [1.0.3,2.0))—— 它是库「兼容性契约」的机器可读表达**:
#    库侧已立全局约定 —— 同一主版本号内(第一位数字不变,当前 = 1.x)**禁止任何破坏性更新**
#    (不得删/改名任何 public 类型、方法、字段、常量,不得改可见性/签名/语义;只允许新增),
#    破坏性变更必须升第一位(1.x → 2.x)并同步收紧本下界。故区间内任何 1.x 版本都可原位替换。
#    政策原文见库 README §6 与 gradle.properties 的 1.0.2 条目(契约正文在 1.0.0 条目)。
# ⚠️ **以下为快照时代(1.0.0-SNAPSHOT.*)的历史口径,自 1.0.0 起不再适用,仅供解读旧 pin**:
#    那时下界曾精确到具体序号(.10/.12/.14),且必须写 `1.0.0-SNAPSHOT` 前缀 —— 因为按 Maven
#    ComparableVersion 语义 `1.0.0-SNAPSHOT.x < 1.0.0`,写成 [1.0.0,2.0) 会拒绝所有快照版;
#    相邻快照之间又二进制不兼容且 modId 相同(.1 带旧包名 → NoClassDefFoundError;.2 带已删除的
#    配置类、.3 缺 effect/ReadyEffect、.4 仍带已删的过渡符号 → 编译期找不到符号;.5 的库 jar 被 FML
#    在语言匹配阶段拒载:loaderVersion 误填 NeoForge 版本带;`.7` 缺 `pack.mcmeta` → Forge 加载界面
#    警告且资源包不注册)。收紧后可让旧 jar 被明确拒绝。
# ⚠️ `.11` 的库 jar 缺 `ALLOW_FIREARM_DAMAGE`(否则 NoSuchFieldError)。
# ⚠️ `.12` 的库 jar 缺 `com.merlinkitsune.starenginelib.economy.*`(星币钱包账本,否则运行期 NoClassDefFoundError)。
# 快照时代的实测矩阵见 neoforge-1.21.1/gradle.properties 同字段注释。
starengine_lib_version_range=[1.0.3,2.0)
