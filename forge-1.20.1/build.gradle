plugins {
    id 'java-library'
    id 'maven-publish'
    // ModDevGradle Legacy:支持 Forge ≤1.20.1(与 1.21.1 分支的 net.neoforged.moddev 同族,统一构建 UX)
    id 'net.neoforged.moddev.legacyforge' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    // ⚠️ exclude 模式**相对每个 srcDir 根**解析:`src/generated/**/.cache`(仓库路径写法)永远不命中,
    //    会让 datagen 缓存 `.cache/` 进产物 jar(本地与 CI 产物字节不一致)。
    //    必须写成相对模式 `**/.cache`(与 neoforge-26.1.2 既有写法一致)。
    exclude("**/.cache") // datagen cache files
    exclude("INSTRUCTIONS.md")
    exclude("mc-src/**")
}

repositories {
    // 前置库 StarEngine Lib 走本地 Maven(库仓库执行 ./gradlew publishToMavenLocal 后即可解析)。
    // 置于首位:该 group 不在任何远程仓库中,不会误命中同名远程工件。
    mavenLocal()
    mavenCentral()
    // ModDevGradle Legacy 所需的 Forge/Minecraft 工件仓库由插件自动添加
    maven { url = uri('https://maven.neoforged.net/releases') }
    // ── 模组来源硬规则(2026-09-17 用户要求)────────────────────────────────
    // 见 AGENTS.md「模组依赖添加规则(统一口径)」:第三方**模组**(含其附属/前置模组)工件只允许来自
    // Curse Maven 与 Modrinth Maven。`exclusiveContent` 同时做两件事:① 声明该仓库;② 把这两个 group
    // 从**其它所有仓库**中排除 ⇒ 任何 `curse.maven:` / `maven.modrinth:` 坐标都**不可能**从别处解析。
    // 这是依赖解析期的硬约束,与 `tools/check_mod_sources.ps1` 的静态守门(阶段 P 会跑)互补。
    // ⚠️ 副作用:本地镜像仓库 `.oss-basemod-repo` 里镜像的 Modrinth 工件不再参与解析(离线时需联网到 api.modrinth.com)。
    exclusiveContent {
        forRepository { maven { url 'https://www.cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
    exclusiveContent {
        forRepository { maven { url 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    // 非模组库/官方工件仍从各自仓库解析(KubeJS 的传递依赖等)
    // KubeJS + Rhino are resolved from the KubeJS maven.
    maven { url 'https://maven.latvian.dev/releases' }
    // KubeJS 的传递依赖 Architectury(直接坐标已改 Curse Maven,本仓库保留给传递/可选工件解析)
    maven { url 'https://maven.architectury.dev' }
    // KubeJS transitive dependency animated-gif-lib-for-java
    maven { url 'https://jitpack.io' }
    // JEI 官方 maven:直接坐标已改 Curse Maven(2026-09-17),本仓库保留给可能的传递/可选工件与历史坐标
    maven { url 'https://maven.blamejared.com' }
}

base {
    archivesName = 'astral_dice'
}

// MC 1.20.1 ships Java 17, so mods should target Java 17 (1.21.1 分支为 Java 21).
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    // Specify the version of Minecraft Forge to use.
    version = project.forge_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // 版本隔离:开发测试游戏目录统一放在仓库根 run/<版本>,
        // 与 neoforge(run/1.21.1)互不污染 mods/config/saves
        configureEach {
            gameDirectory = rootProject.file('run/1.20.1')
        }

        client {
            client()

            // 自动化测试:gradlew runClient -Pquickplay=<世界名> 直接进入指定单机世界
            if (project.hasProperty('quickplay')) {
                programArgument '--quickPlaySingleplayer'
                programArgument project.findProperty('quickplay')
            }

            // 自动化测试:固定游戏窗口尺寸 1920x1080(便于 OCR 读取画面与屏幕坐标换算)
            programArgument '--width'
            programArgument '1920'
            programArgument '--height'
            programArgument '1080'
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // MDG Legacy:Mixin 配置声明(dev run 需显式注册 mixin config,
    // mods.toml [[mixins]] 仅生产 jar 生效;此处同时启用 refmap 生成链)
    mixin {
        config("${mod_id}.mixins.json")
    }
}

// Forge 自身版本门槛(**单一来源 = gradle.properties 的 forge_version**,形如 1.20.1-47.4.10):
//   依赖区间(写入 modId="forge" 强制依赖):下限 = 本工程编译所依赖的 Forge 版本,上限 = 其次版本(47 → 48)。
//   语言区间(写入 loaderVersion):**只能卡到主版本系列**(47)—— javafml 语言提供者的版本号就是 Forge
//   主系列号,与完整版本号并不同构。2026-09-14 实机验证:`loaderVersion="[47.4.10,48)"` 会被 FML 判为
//   `Missing language javafml version [47.4.10,48) wanted by astral_dice-…, found 47` 而**直接拒绝加载本模组**
//   (Forge 自身的 mods.toml 也只写 loaderVersion="[24,]")。故:
//     loaderVersion = [<major>,<major+1>)(当前 [47,48)),精确下限只放在 forge 依赖上;
//   低于 47.4.10 的环境仍在 FML 依赖排序阶段被拒("Missing or unsupported mandatory dependencies"),
//   即在 mods.toml 解析/依赖排序阶段就拒绝,而不是照常加载后才抛 mixin 错误。
def forgeSemver = project.forge_version.toString().split('-').last()
def forgeMajor = (forgeSemver.split('\\.')[0] as int)
def forgeVersionRange = "[${forgeSemver},${forgeMajor + 1})"
def forgeLanguageRange = "[${forgeMajor},${forgeMajor + 1})"
logger.lifecycle("forgeVersionRange: ${forgeVersionRange} / forgeLanguageRange: ${forgeLanguageRange} (derived from forge_version=${forge_version})")

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forgeVersionRange,
            forge_language_version_range: forgeLanguageRange,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            starengine_lib_version_range: starengine_lib_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
legacyForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// AutoForge: mod addon dependencies
repositories {
    // 本地兜底仓库(内容是 Modrinth Maven 坐标的镜像缓存)
    maven { url "${projectDir}/.oss-basemod-repo" }
    // 统一口径的两个模组来源仓库已在文件顶部声明过一次(Gradle 的项目级仓库是累加的),
    // 此处不再重复声明 —— 重复声明会让「统一口径」失真(由 tools/check_mod_sources.ps1 守门)。
}
dependencies {
    // StarEngine Lib(必须前置):效果/事件/目标选择/通用组件等共享逻辑所在库。
    // 库发布的是生产 SRG jar(reobfJar),MDG legacyforge 会在解析期重映射为 dev Mojmap 命名,
    // 因此必须用 modImplementation(与 curse.maven / modrinth 的 mod 依赖同一机制)。
    modImplementation "${starengine_lib_group}:starengine_lib-forge-1.20.1:${starengine_lib_version}"
    // Curios API(必须前置):1.20.1 Forge = Curios 5.x(IPQlZkz1 = 5.14.1+1.20.1 的 Modrinth 版本 id)
    modImplementation "maven.modrinth:curios:IPQlZkz1"

    // 帕秋莉手册(手册内容运行依赖):1.20.1 Forge 版本
    modImplementation "maven.modrinth:patchouli:1.20.1-85-forge"

    // Iron 的法术与魔法书(可选联动,compileOnly):1.20.1-3.16.3 的 Modrinth 版本 id
    modCompileOnly "maven.modrinth:irons-spells-n-spellbooks:hZaEegS9"

    // 自动化测试辅助:KubeJS(运行时依赖,用于游戏内 Curios 饰品栏检查脚本)
    // 通过 curse maven modImplementation 引入,MDG 会将其重映射为 dev 命名,可在 dev 环境正常加载 mixin。
    modImplementation "curse.maven:kubejs-238086:8020595"        // kubejs-forge-2001.6.5-build.26
    modImplementation "curse.maven:rhino-416294:6186971"         // rhino-forge-2001.2.3-build.10
    // Architectury API(KubeJS 前置库模组):2026-09-17 起按统一口径改走 Curse Maven
    // (原 `dev.architectury:architectury-forge:9.2.14` 走官方 maven;CF 文件 5137938 = `architectury-9.2.14-forge.jar`,
    //  [Forge 1.20(.1)] v9.2.14 —— 与官方 maven 坐标同版本同功能,产物为**生产(SRG)jar**,由 MDG modImplementation 重映射)
    modImplementation "curse.maven:architectury-api-419699:5137938"

    // 与 1.20.1 整合包一致的运行时模组(curse maven,dev 重映射后加载)
    modImplementation "curse.maven:collective-342584:7148968"    // collective-1.20.1-8.13
    modImplementation "curse.maven:superflat-world-no-slimes-344185:6184996" // superflatworldnoslimes-1.20.1-3.5
    modImplementation "curse.maven:embeddium-908741:5681725"     // embeddium-0.3.31+mc1.20.1
    modImplementation "curse.maven:oculus-581495:6020952"        // oculus-mc1.20.1-1.8.0(curse 最新 1.20.1 版;本地 1.8.1 未上 curse)
    // JEI(配方查看,测试环境用):2026-09-17 起按统一口径改走 Curse Maven
    // (原 `mezz.jei:jei-1.20.1-forge:15.56.0.205` 走官方 maven;CF 文件 8778011 = `jei-1.20.1-forge-15.56.0.205.jar`,1778129 字节)
    modImplementation "curse.maven:jei-238222:8778011"
    // Jade(方块/实体信息 HUD;2026-09-19 用户要求「所有测试环境增加 jei 和 jade 模组,用于用户侧物品和效果检查」):
    // 测试环境用,不进发货产物。**1.20.1 必须走 modImplementation**(与上面 JEI/Embeddium/Oculus 同一机制:
    // MDG LegacyForge 在解析期重映射,直接塞 dev/Mojmap 不识别的 forge 坐标系会崩)。
    // Modrinth Maven 的 version id xJQHCmWJ = `Jade-1.20.1-Forge-11.13.3.jar`(553487 B),
    // 与本线整合包内现有 `[玉 🔍] Jade-1.20.1-Forge-11.13.3.jar` **同版**。
    modImplementation "maven.modrinth:jade:xJQHCmWJ"

    // 优化类模组(2026-09-17 用户要求:所有测试环境加装 ImmediatelyFast + FerriteCore 做兼容性验证)
    // ⚠️ **1.20.1 必须走 modImplementation,不能像另两线那样由 mt_env 下载进 run/mods**:
    //    Modrinth/CF 提供的是**生产(SRG)字节码**的 Forge 1.20.1 jar,而 dev 环境是 Mojmap 命名 ——
    //    手工放进 run/mods 不会被重映射,直接抛
    //      java.lang.NoSuchMethodError: 'it.unimi.dsi.fastutil.Hash$Strategy net.minecraft.Util.m_137583_()'
    //      at malte0811.ferritecore.fastmap.PropertyIndexer.<clinit>
    //    (FerriteCore 6.0.1 实测,2026-09-17:vanilla `Bootstrap.bootStrap` 阶段直接 FATAL,runClient BUILD FAILED);
    //    这与 Embeddium/Oculus 不能放进 1.20.1 dev run 是**同一类限制**。
    //    ⇒ 由 MDG 在解析期重映射(modImplementation),与上面 collective/superflat/JEI 同一机制;
    //      同时 `mt_env.ps1 mods --version 1.20.1` 会跳过对应下载并清理 run/mods 里的历史副本,避免重复模组。
    // ImmediatelyFast：**1.20.1 dev run 装不了**（2026-09-17 复测三个版本，根因已定位到字节码级）：
    //   · `1.5.5+1.20.4`（Modrinth 最新、game_versions 也声明 1.20.1，但产物是 1.20.4 的）→ 启动即
    //     `MixinApplyError: Mixin [immediatelyfast-common.mixins…]` → `InvalidInjectionException`；
    //   · `1.2.4+1.20.1` / `1.2.3+1.20.1`（Modrinth 上 1.20.1 的 Forge 构建**只有** 1.2.0~1.2.4，
    //     经本 build.gradle 重映射）→ 能过 mixin/bootstrap，但**在模组构造期硬崩**：
    //       [ImmediatelyFast]: Loading ImmediatelyFast 1.2.3+1.20.1
    //       [ImmediatelyFast]: Found Oculus 1.8.0. Enabling compatibility.
    //       [ImmediatelyFast]: Failed to initialize Iris compatibility. …
    //       java.lang.ClassNotFoundException: net.coderbot.iris.vertices.ImmediateState
    //         at forge.net.raphimc.immediatelyfast.compat.IrisCompat.init(IrisCompat.java:41)
    //         at forge.net.raphimc.immediatelyfast.forge.ImmediatelyFastForge.<init>(…:32)
    //         at net.minecraftforge.fml.javafmlmod.FMLModContainer.constructMod(FMLModContainer.java:77)
    //       ⇒ `:forge-1.20.1:runClient` 立即 `finished with non-zero exit value -1`（11s，无崩溃报告、无 hs_err）。
    //   · **根因（javap 取证，非猜测）**：IF 1.2.x 的 `IrisCompat.init()` 第 0 条指令就
    //     `Class.forName("net.coderbot.iris.vertices.ImmediateState")` / `…ExtendingBufferBuilder` ——
    //     那是 **Iris 1.6 的包名**；而 1.20.1 的光影加载器 Oculus 1.8.0 基于 Iris 1.7+，包名已改为
    //     `net.irisshaders.iris`。`ImmediatelyFastForge.<init>` 只是 `Optional.ifPresent(→ IrisCompat.init())`，
    //     **没有任何配置项能跳过**（探测到 oculus 就调用），且 init 开头就置 `IRIS_LOADED=true`，
    //     故「配置关掉兼容」这条路不存在。
    //   ⇒ 1.20.1 线上 **Oculus 1.8 = 光影硬需求**与 **IF 1.2.x = 只认 Iris 1.6** 互斥：二选一。
    //     当前取舍 = 保光影（用户硬性要求「光影包默认启用」），IF 只在 1.21.1 / 26.1.2 两线装。
    //     ※ 若要反过来，唯一可行改法是**把 Oculus 降级到 1.7.0**（Iris 1.6 包名）——但那会同时改动
    //       已验证通过的光影栈，须先取得用户裁决，且要复跑 SHADER-VISION 用例确认光影仍生效。
    //     如需复测：取消下面一行注释并重建（`gradlew :forge-1.20.1:build`）。
    // modImplementation "maven.modrinth:immediatelyfast:NJ17fqEK"   // ImmediatelyFast 1.2.4+1.20.1
    // FerriteCore:6.0.1-forge(DG5Fn9Sz,game_versions = 1.20 / 1.20.1)——
    //   经本 build.gradle 重映射后**可正常工作**（2026-09-17 实测：vanilla bootstrap 不再报
    //   `NoSuchMethodError … Util.m_137583_()`，客户端正常进入世界）。
    modImplementation "maven.modrinth:ferrite-core:DG5Fn9Sz"

    // Mixin:编译期注解类 + **注解处理器(生成 refmap)**。
    // ⚠️ 2026-09-16 生产事故校正(必须理解,**禁止再删**):
    //   此前这里写着「Mixin Booster 会自动重映射,故不需要 refmap/注解处理器」—— **该前提是错的**。
    //   Booster 提供的是 org.sinytra.mixinbooster.MixinModlauncherRemapper,它只重映射**字节码引用**;
    //   而 `@Inject(method = "startUseItem()V")`、`@Shadow` 这类**注解里的字符串选择器**靠 reobf 改不动
    //   (注解字符串不是符号引用),必须由 refmap 在运行时翻译成 SRG 名。
    //   实测事故(生产 reobf/SRG jar 启动即崩):
    //     InvalidInjectionException: ... could not find any targets matching 'startUseItem()V'
    //     in net.minecraft.client.Minecraft. No refMap loaded.
    //     -> astral_dice.mixins.json:client.AstralUseItemGuardMixin from mod (unknown) -> FATAL
    //   为什么 dev 看不出来:dev 类是 Mojmap 名,选择器直接命中,refmap 根本不参与 ⇒ 该缺陷**只在生产暴露**。
    //   历史:commit 01be1fb 曾加入本机制,专门修「生产 jar @Shadow 字段映射」;127a2b7 依据上述错误前提
    //   把它整体移除 ⇒ 生产从此必崩(当时只是碰巧还没有会失败的 mixin)。
    compileOnly 'org.spongepowered:mixin:0.8.5'
    // Mixin 注解处理器(主 jar 已内嵌 org/spongepowered/tools/obfuscation/,故用主坐标即可)
    annotationProcessor 'org.spongepowered:mixin:0.8.5'
    // 注解处理器自身依赖(主 jar 未打包:Gson/Guava/ASM)
    annotationProcessor 'com.google.code.gson:gson:2.10.1'
    annotationProcessor 'com.google.guava:guava:31.1-jre'
    annotationProcessor 'org.ow2.asm:asm:9.8'
    annotationProcessor 'org.ow2.asm:asm-tree:9.8'
    annotationProcessor 'org.ow2.asm:asm-commons:9.8'
    annotationProcessor 'org.ow2.asm:asm-util:9.8'
    annotationProcessor 'org.ow2.asm:asm-analysis:9.8'

    // Mixin Booster(强依赖):为 Forge 1.20.1 提供 Sponge Mixin 运行时(该版本 FML 无 Mixin 集成)。
    // 它**不能**替代 refmap —— 见上方说明。
    modImplementation "maven.modrinth:mixinbooster:rOaAYvPZ"

    // ModernFix(测试环境):dev runClient 加载优化;提供 "Total time to load game and open world was"
    // 加载完成日志,供 mt_launch.sh(scripts/test/,bash+python 测试流程)判定启动/加载世界完成(整合包为 5.27.83,dev 用 Modrinth 最新 1.20.1 版)。
    modImplementation "maven.modrinth:modernfix:OvpPdk44"

}
// AutoForge: end mod addon dependencies

// === Mixin 配置发现(Forge 1.20.1 关键;缺失会导致全部 Mixin 静默失效)===
// 已核实:Forge 1.20.1 的 FML 47.4.10 对 Mixin 零集成(fmlloader/fmlcore 源码全文无 mixin 处理),
// 因此 mods.toml 里的 `[[mixins]] config=` 在 1.20.1 被完全忽略(该写法只在 NeoForge 生效)。
// Mixin(fabric-mixin.jar / Sponge Mixin 0.8.5)实际只认两条通道:
//   ① 生产 jar  → META-INF/MANIFEST.MF 的 `MixinConfigs` 属性(MixinPlatformAgentDefault#prepare 读取);
//   ② 开发环境  → ModLauncher 启动参数 `--mixin.config`(MDG mixin 扩展按 RunModel 注入)。
// 二者缺一,物品栏效果角标、村民交易、猪灵 AI 等 Mixin 全部不生效。
// ⚠️ 2026-09-16:refmap **必须**生成(见上方 dependencies 段的详细说明)。
// MDG LegacyForge 的 mixin 扩展会把「官方名(Mojmap)→SRG」映射经 MixinCompilerArgs
// (`-AinMapFile`/`-AoutRefMapFile`)注入注解处理器,产出 refmap 并随 jar 一起打包/重混淆。
mixin {
    config 'astral_dice.mixins.json'
    add sourceSets.main, 'astral_dice.refmap.json'
}

// 生产 jar(reobfJar,RemapJar extends Jar)与开发 jar(jar)统一写入 MixinConfigs 清单属性。
tasks.withType(org.gradle.api.tasks.bundling.Jar).configureEach {
    manifest {
        attributes 'MixinConfigs': 'astral_dice.mixins.json'
    }
}

// === 编译产物分发规则(与 1.21.1 分支保持同一任务面与同一推送标准;旧 jar 清理按版本后缀隔离)===
// 默认行为:每次构建完成后自动推送到仓库根 run/1.20.1/mods(本机 runClient 调试)、
// 仓库根目录 build/libs,并推送到整合包 mods 目录(删除旧版后复制新版)。
// 整合包位置:D:/.minecraft/versions/1.20.1 模组测试/mods
// 目标根目录不存在时(如 CI 环境)自动跳过推送,不影响构建。
//
// ⚠️ 约定(2026-09-12 起,同日修订为白名单):**只有发布线分支推送整合包。**
//   判定依据是当前 git 分支(读 .git/HEAD,兼容普通仓库与 worktree),规则:
//     · 分支出现在 packPushBranches(**白名单**)中 → 允许 pushToGame
//     · 分支不在白名单 / 无法确定分支(detached HEAD/无 .git,如 CI) → 跳过,只打日志,不算失败
//     · 传 -PdeployToPack 或 -PpackPush    → 强制推送,覆盖上述判定(手动出包用)
//   理由:整合包是需要"成对匹配"的测试环境 —— 前置库 jar 与 mod jar 必须版本互相匹配
//   (mod 在编译期锁定库版本,mods.toml 又声明了库版本区间)。开发分支上两者各自演进,
//   自动推送会把不匹配的组合灌进测试包,表现为启动期 NoClassDefFoundError 或"缺必需前置"。
//   **白名单优于黑名单**:新开的分支(含 DSH/WorkBuddy 自动建的 `wt/*` worktree 分支)
//   默认落在"不推送"一侧,不会因为忘了把分支名登记进黑名单而误推、误删整合包里的正式 jar。
//   需要推送时:把分支加进白名单;或单次用 -PdeployToPack 强制。
//   ⚠️ 用 -PdeployToPack 强推本 mod 时,务必确认整合包内 starengine_lib-*.jar 与之成对
//      (下方会读 starengine_lib_version 做一次比对并告警)。
def devRunModsDir = rootProject.file('run/1.20.1/mods')
def packModsDir = file('D:/.minecraft/versions/1.20.1 模组测试/mods')

// --- 整合包推送的 git 分支守卫(配合上方约定) ---
// 分支判定放在**执行期**(见 pushToGame 的 doLast),不做配置期求值:
//   ① 每次构建都读当时的 .git/HEAD,切分支后立即生效,不存在配置缓存陈旧问题;
//   ② 不把 Provider/闭包塞进 configuration-cache,避免缓存序列化限制与行为漂移。
// dotGitEntry 是配置期算好的 File(可序列化),执行期读它即可 —— 普通仓库这里就是
// .git 目录;worktree 下它是**文件**,内容为 `gitdir: <path>`,真正的 HEAD 在 gitdir 下。
// 【白名单】只有列在这里的分支允许把 jar 推进整合包;其余分支(含 worktree 的 `wt/*`)一律跳过。
def packPushBranches = ['multi-1.20.1-1.21.1']
def forcePackPush = project.hasProperty('deployToPack') || project.hasProperty('packPush')
def libVersionLocked = project.findProperty('starengine_lib_version')?.toString()
def dotGitEntry = rootProject.file('.git')

// 本分支(1.20.1)的旧产物识别规则:只清理带 +forge_1.20.1 后缀的 jar,避免误删 1.21.1 分支产物
def staleJarMatcher = { File f ->
    f.isFile() && (f.name ==~ /astral_dice-.+\+forge_1\.20\.1\.jar/)
}

// 产物来源按环境区分(MDG LegacyForge 双产物):
//   - pushToDevRun(开发 runClient 环境 root run/1.20.1/mods):jar.archiveFile = build/devlibs
//     的未重混淆 jar(Mojmap 名)——forgeclientuserdev 运行时加载 Mojmap 原版类,
//     推 SRG 版反而报 NoSuchFieldError(f_256929_)。
//   - pushToGame(生产/整合包):reobfJar.archiveFile = build/libs 的 SRG 重混淆 jar——
//     生产原版类字段是 SRG 名(含 static final 常量),未重混淆 jar 报 NoSuchFieldError。
def devJarArchiveProvider = tasks.named('jar').flatMap { it.archiveFile }
def prodJarArchiveProvider = tasks.named('reobfJar').flatMap { it.archiveFile }

tasks.register('pushToDevRun') {
    group = 'build'
    description = 'Copy the built mod jar to the dev run mods folder (root run/1.20.1/mods) and remove old 1.20.1 versions.'
    dependsOn tasks.named('jar')
    doLast {
        def jarFile = devJarArchiveProvider.get().asFile
        if (!jarFile.exists()) {
            logger.warn("pushToDevRun: built jar not found, skipped: ${jarFile}")
            return
        }
        if (!devRunModsDir.exists()) {
            devRunModsDir.mkdirs()
        }
        def stale = devRunModsDir.listFiles().findAll(staleJarMatcher)
        stale.each { it.delete() }
        def target = new File(devRunModsDir, jarFile.name)
        target.withOutputStream { out ->
            jarFile.withInputStream { inp -> inp.transferTo(out) }
        }
        logger.lifecycle("pushToDevRun: pushed ${jarFile.name} -> ${devRunModsDir}")
    }
}

// 默认随 build 推送到 1.20.1 用户测试环境 mods 目录(与 1.21.1 一致;pack 根不存在自动跳过)
tasks.register('pushToGame') {
    group = 'build'
    description = 'Copy the built mod jar to the 1.20.1 user test environment mods folder and remove old 1.20.1 versions. Only the release branch (see packPushBranches) pushes; force with -PdeployToPack.'
    dependsOn tasks.named('reobfJar')
    doLast {
        // --- 约定:只有发布线分支推送整合包(白名单,见文件顶部「编译产物分发规则」) ---
        if (!forcePackPush) {
            // 执行期读取当前分支:普通仓库 .git 是目录;worktree 的 .git 是文件,内容记录 gitdir
            def readGitBranch = { File dotGit ->
                File headFile = null
                if (dotGit.isDirectory()) {
                    def hf = new File(dotGit, 'HEAD')
                    headFile = hf.isFile() ? hf : null
                } else if (dotGit.isFile()) {
                    def m = dotGit.text.trim() =~ /^gitdir:\s*(.+)$/
                    if (m.find()) {
                        def gd = new File(m.group(1).trim())
                        if (!gd.isAbsolute()) {
                            gd = new File(dotGit.parentFile, m.group(1).trim())
                        }
                        def hf = new File(gd, 'HEAD')
                        headFile = hf.isFile() ? hf : null
                    }
                }
                if (headFile == null) {
                    return ''
                }
                def s = headFile.text.trim()
                s.startsWith('ref: refs/heads/') ? s.substring('ref: refs/heads/'.length()) : ''
            }
            def branch = readGitBranch(dotGitEntry)
            if (branch.isEmpty()) {
                logger.lifecycle('pushToGame: skipped — 无法确定当前 git 分支(detached HEAD 或无 .git);如需强制推送请加 -PdeployToPack')
                return
            }
            if (!packPushBranches.contains(branch)) {
                logger.lifecycle("pushToGame: skipped — 分支 '${branch}' 不在整合包推送白名单 ${packPushBranches} 内;如需强制推送请加 -PdeployToPack")
                return
            }
        }
        def jarFile = prodJarArchiveProvider.get().asFile
        if (!jarFile.exists()) {
            logger.warn("pushToGame: built jar not found, skipped: ${jarFile}")
            return
        }
        if (!packModsDir.exists()) {
            // 仅当整合包根目录存在时才创建 mods 子目录;根目录不存在(如 CI 环境)直接跳过
            def packRoot = packModsDir.getParentFile()
            if (packRoot == null || !packRoot.exists()) {
                logger.warn("pushToGame: pack dir not found, skipped: ${packModsDir}")
                return
            }
            packModsDir.mkdirs()
        }
        def stale = packModsDir.listFiles().findAll(staleJarMatcher)
        stale.each { it.delete() }
        def target = new File(packModsDir, jarFile.name)
        target.withOutputStream { out ->
            jarFile.withInputStream { inp -> inp.transferTo(out) }
        }
        logger.lifecycle("pushToGame: pushed ${jarFile.name} -> ${packModsDir}")

        // --- 成对匹配自检:整合包内前置库 jar 必须与 mod 锁定的库版本一致 ---
        // 强推本 mod 时最容易踩的坑:库 jar 没跟着更新(或反过来),两者版本区间对不上,
        // 表现为启动期 NoClassDefFoundError / "缺必需前置"。此处只告警,不阻断构建。
        if (libVersionLocked) {
            def libJars = packModsDir.listFiles()?.findAll { File f ->
                f.isFile() && f.name.startsWith('starengine_lib-') && f.name.endsWith('.jar')
            } ?: []
            if (libJars.isEmpty()) {
                logger.warn("pushToGame: 整合包内没有 starengine_lib-*.jar —— 本 mod 把它声明为必需前置,缺失会导致整合包拒绝启动")
            } else {
                def mismatched = libJars.findAll { !it.name.contains(libVersionLocked) }
                if (mismatched) {
                    logger.warn("pushToGame: 整合包内的前置库 jar 与 starengine_lib_version=${libVersionLocked} 不一致: " +
                            "${mismatched*.name} —— 请到 starengine_lib 仓库同步推送库 jar")
                }
            }
        }
    }
}

// === 编译产物集中规则:任何版本的编译产物统一复制到仓库根目录 build/libs ===
def rootBuildLibsDir = rootProject.file('build/libs')

tasks.register('pushToRootBuild') {
    group = 'build'
    description = 'Copy the built production jar to the repository root build/libs (shared by both versions).'
    dependsOn tasks.named('reobfJar')
    doLast {
        def jarFile = prodJarArchiveProvider.get().asFile
        if (!jarFile.exists()) {
            logger.warn("pushToRootBuild: built jar not found, skipped: ${jarFile}")
            return
        }
        if (!rootBuildLibsDir.exists()) {
            rootBuildLibsDir.mkdirs()
        }
        // 只清理本加载器(forge)旧产物,避免误删 neoforge 版本 jar
        def stale = rootBuildLibsDir.listFiles().findAll(staleJarMatcher)
        stale.each { it.delete() }
        def target = new File(rootBuildLibsDir, jarFile.name)
        target.withOutputStream { out ->
            jarFile.withInputStream { inp -> inp.transferTo(out) }
        }
        logger.lifecycle("pushToRootBuild: pushed ${jarFile.name} -> ${rootBuildLibsDir}")
    }
}

tasks.named('build') {
    // 统一推送标准:pushToDevRun/pushToRootBuild/pushToGame 均在 build 后默认触发
    finalizedBy tasks.named('pushToDevRun')
    finalizedBy tasks.named('pushToGame')
    // 编译产物集中到仓库根目录 build/libs
    finalizedBy tasks.named('pushToRootBuild')
}

