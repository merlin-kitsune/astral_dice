# 根级 Gradle 运行参数(两个子项目共用)。
# 各子项目自身的版本/依赖属性见子项目目录下的 gradle.properties。
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# 2026-11-19: 系统 JDK 换成 Microsoft Build 21（JAVA_HOME/PATH 已指向 jdk-21.0.13.102），Zulu 21 已卸载。
# GraalVM 21 是解压版兜底；toolchain 取第一个匹配，故 Microsoft 21 放最前。
org.gradle.java.installations.paths=C:/Program Files/Microsoft/jdk-21.0.13.102-hotspot,C:/Program Files/Microsoft/jdk-17.0.21.102-hotspot,C:/Program Files/Microsoft/jdk-25.0.5.102-hotspot,F:/MCProject/tools/jdk/graalvm-jdk-21+35.1
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=false