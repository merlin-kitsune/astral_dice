# 根级 Gradle 运行参数(两个子项目共用)。
# 各子项目自身的版本/依赖属性见子项目目录下的 gradle.properties。
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# 2026-11-11: 使用本机已安装 JDK（Microsoft Build 17/25 + Azul Zulu 21），不自动下载。
# 新装的 Microsoft JDK 未加入 PATH，必须用绝对路径交给 toolchain。
org.gradle.java.installations.paths=C:/Program Files/Microsoft/jdk-17.0.21.21-hotspot,C:/Program Files/Microsoft/jdk-25.0.5.21-hotspot,C:/Program Files/Zulu/zulu-21
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=false
