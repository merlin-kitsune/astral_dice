# ---- Fabric 1.20.1 子项目属性 ----
# 与 forge-1.20.1 同源(基准 = 1.3.2-hotfix+forge_1.20.1),换加载器与前置。
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
minecraft_version=1.20.1
# ⚠️ 2026-09-29 修正:Fabric Loader 的版本谓词**不支持 Maven 区间语法**
#    (VersionPredicateParser 只认 = / > / >= / < / <= / ~ / ^ 与通配符;
#     原来的 `[1.20.1]` 是 Forge 写法,在 Fabric 上被当成字面量 ⇒ 服务端启动即
#     HARD_DEP_INCOMPATIBLE_PRESELECTED:「需要 minecraft 的 [1.20.1] 版本,但已安装的 1.20.1 不对」)。
#    `~1.20.1` = `>=1.20.1 <1.21.0`。
minecraft_version_range=~1.20.1
loader_version=0.19.5
fabric_version=0.92.12+1.20.1

## Mod Properties
mod_id=astral_dice
mod_name=Astral Dice
mod_license=MIT License
mod_group_id=com.merlinkitsune.astral_dice
# 多版本分支约定:版本号带加载器后缀(+fabric_1.20.1),与另三线产物区分
# ⚠️ 2026-09-29 用户裁决:本线为**开发线** ⇒ 版本号一律带 **-alpha.x 预发布后缀**(现为 1.3.7-alpha.2),
#    与库侧的 1.0.6-alpha.x 同批演进;正式对外号待发布线再定。
mod_version=1.3.7-alpha.2+fabric_1.20.1

## 前置库坐标(StarEngine Lib / fabric 平台,库仓库先 ./gradlew :fabric-1.20.1:publishToMavenLocal)
# ⚠️ lib_version_range 同样必须是 Fabric 谓词语法:空格分隔的多个单谓词 = AND
#    (原 `[1.0.6,2.0)` 是 Maven/Forge 半开区间,Fabric 不认)。
# 1.0.11(2026-10-03 用户裁决「fabric 侧与主线版本号相同」):**库版本改为与三平台完全相同的裸号 `1.0.11`** ——
#    库仓 `fabric-1.20.1` 子项目自 2026-09-29 起沿用的 `-alpha.N` 独立递增口径**作废**,库**四平台自此同号**;
#    本线 `starengine_lib_version` 随之由 `1.0.6-alpha.4` 改为 `1.0.11`,下界同步收紧为 `>=1.0.11 <2.0`。
#    ⚠️ 本线**自己的** `mod_version`(`1.3.7-alpha.2+fabric_1.20.1`)**独立递增** —— 带 alpha 的是**本模组**的
#    预发布号,与「所依赖的库版本」是两回事(见 AGENTS「第四条线(fabric-1.20.1)的规则边界」第 ⑧ 条)。
#    ⚠️ 库 fabric 子项目历史上那三个**裸**号 1.0.6 / 1.0.7 / 1.0.8 仍属「本地临时构建、不作对外号」,
#    已从 mavenLocal 移入隔离目录、不复用;本次用的 `1.0.11` 与它们无关。
# 沿革(库 fabric 子项目,2026-10-03 之前):`1.0.6-alpha.1`(2026-10-01,大版本号与三平台同步为 1.0.6)、
#    `1.0.6-alpha.2`(2026-10-02,与三平台 1.0.7 同改诅咒之剑上限 16 → 32)、`-alpha.3` / `-alpha.4`
#    (随三平台 1.0.8 / 1.0.9)、`-alpha.5` / `-alpha.6`(随三平台 1.0.10 / 1.0.11);本线 pin 此前停在 `1.0.6-alpha.4`。
starengine_lib_version=1.0.12
starengine_lib_group=com.merlinkitsune.starenginelib
starengine_lib_version_range=>=1.0.12 <2.0

## 饰品栏前置(替代 Forge 侧 Curios 5.x)
# ⚠️ 组件/持久化改用 Fabric API 自带的 fabric-data-attachment-api-v1(随 fabric_version 来),
#    本模组**不再把 CCA 列为运行前置**。
#    cca_version 保留只为 **编译期**:Trinkets 3.7.2 的 TrinketComponent 继承 CCA 的 ComponentV3,
#    javac 解析 TrinketsApi 签名时必须能加载它(modCompileOnly)。
#    运行期 CCA 由 Trinkets 自己 hard-depends ⇒ 玩家无需为本模组单独安装。
trinkets_version=3.7.2
cca_version=5.2.3

## 可选饰品系统兼容:Accessories(2026-09-29 新增)
# Wisp Forest 的**数据驱动**饰品库(Fabric/NeoForge/Forge,1.20.1 支持)。
# 生产定位 = **软依赖**:fabric.mod.json 只进 recommends、**绝不进 depends** ——
#   装了它就走 Accessories,没装就用 Trinkets,两者同装则双源聚合(见 compat/curios/CuriosApi)。
# ⚠️ Accessories 自身有硬前置 **Cloth Config >= 11.1.118**(其 fabric.mod.json depends 实证),
#    故 dev 运行环境必须一并投放,否则 Accessories 不加载。
# ⚠️ 1.20.1 线停在 1.0.0-beta.48,且 Wisp Forest 已声明 1.20.1 停止开发 ⇒ 版本钉死不再跟随。
accessories_version=1.0.0-beta.48+1.20.1
accessories_version_range=>=1.0.0-beta.48
accessories_mr_version=A7wwzJ0e

## 事件桥前置:Puzzles Lib(2026-09-29 用户裁决「许可引入」)
# 用途 = 把 Fabric 侧**缺失的事件回调整体补齐**(FAPI 没有可改伤害值的事件)。
# 关键映射(实测其 mixin 字节码,勿按名字理解):
#   ⚠️ Puzzles 的 LivingHurtCallback 注入在 LivingEntity#actuallyHurt 的 **HEAD**,
#      而 Forge 的 LivingDamageEvent 正是这个位置 ⇒ 它对应我们的 **LivingDamageEvent**;
#      Forge 的 LivingHurtEvent(在 hurt() 内、actuallyHurt 之前)**Puzzles 没有** ⇒ 自写 mixin。
# ⚠️ Puzzles 自带 puzzlesaccessapi(内嵌 META-INF/jars),但**不含** Forge Config API Port
#    ⇒ dev 运行期要一并投放;玩家侧由 Loader 按 puzzleslib 的 depends 提示安装。
puzzleslib_version=8.1.33-1.20.1-Fabric
puzzleslib_version_range=>=8.1.33
puzzleslib_mr_version=N8gFdljq
forgeconfigapiport_version=8.0.3-1.20.1-Fabric
forgeconfigapiport_mr_version=HvR3IdRE
cloth_config_version=11.1.136+fabric
cloth_config_mr_version=2xQdCMyG

