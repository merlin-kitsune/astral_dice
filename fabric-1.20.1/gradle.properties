patchouli_version=1.20.1-85-FABRIC
kubejs_version=2001.6.5-build.26
rhino_version=2001.2.3-build.10
architectury_version=9.2.14+fabric
architectury_mr_version=WbL7MStR
jei_version=15.62.0.216
jade_version=11.13.3
modernfix_version=5.25.2+mc1.20.1
ferritecore_version=6.0.1
sodium_version=mc1.20.1-0.5.13-fabric
lithium_version=mc1.20.1-0.11.4-fabric
indium_version=1.0.36+mc1.20.1
starlight_version=1.1.2+1.20
