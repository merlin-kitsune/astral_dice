// Astral Dice / Fabric 1.20.1 子项目
// Java 17 · Mojang 官方映射(officialMojangMappings)· Fabric Loom 1.17.21(需 Gradle >= 9.5.0,JDK21 可用)
//
// 基准 = forge-1.20.1(1.3.2-hotfix)的源码;加载器层整体替换:
//   装饰品栏  Curios 5.14.1            -> Trinkets 3.7.2
//   玩家/实体数据 Capability/Attachments -> Cardinal Components API 5.2.3
//   事件总线   Forge EventBus           -> 自建 LoaderBus(保留 EventPriority 语义)+ FAPI 回调/mixin 桥接
//   网络      SimpleChannel             -> FAPI Networking(channel-handler 形态,1.20.1 无 PayloadTypeRegistry)
//   战利品    Global Loot Modifier      -> LootTableEvents.MODIFY
//   注册      DeferredRegister          -> platform/reg 薄包装(声明面不变)
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'fabric-loom' version '1.17.21'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'astral_dice'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// ⚠️ 2026-09-29 补:数据生成产物必须纳入资源集。
//   搬自 forge-1.20.1/build.gradle 的同名配置 —— 移植时重写构建脚本漏了这一段,
//   后果 = src/generated/resources 下 137 个物品模型 + 118 个配方 + 118 个进度
//   **全部不进产物 jar**(编译与启动俱无感,只在游戏里表现为物品紫黑、配方不存在)。
sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    // ⚠️ exclude 模式**相对每个 srcDir 根**解析:`src/generated/**/.cache`(仓库路径写法)永远不命中,
    //    会让 datagen 缓存 `.cache/` 进产物 jar(本地与 CI 产物字节不一致)。
    //    必须写成相对模式 `**/.cache`(与另三线既有写法一致)。
    exclude("**/.cache") // datagen cache files
    exclude("INSTRUCTIONS.md")
    exclude("mc-src/**")
}

repositories {
    // 前置库 StarEngine Lib 走本地 Maven(库仓库执行 ./gradlew :fabric-1.20.1:publishToMavenLocal)
    mavenLocal()
    mavenCentral()
    maven { url 'https://api.modrinth.com/maven' }        // 模组工件(Modrinth Maven)
    maven { url 'https://maven.blamejared.com' }          // Patchouli(如需官方 maven)
    // ⚠️ 仅 **编译期** 需要:Trinkets 3.7.2 的 TrinketComponent 继承 CCA 的 ComponentV3
    //    (javap 实证),javac 解析 TrinketsApi 签名时必须能加载 CCA 类型。见 dependencies 注释。
    maven { url 'https://maven.ladysnake.org/releases' }
    // conditional-mixin（Carpet-Fixes 1.20 的**硬依赖** mod id `conditional-mixin`）不在 Modrinth，
    //   由上游作者 Fallen-Breath 的 jitpack 代理 maven 提供；只给 dev 运行期的 Carpet-Fixes 用。
    maven { url 'https://maven.fallenbreath.me/jitpack' }

    // 依赖解析硬约束:模组工件只允许来自 Modrinth Maven(与另三线「只走 curse/modrinth」的口径一致)
    exclusiveContent {
        forRepository { maven { url 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

def libVersion = project.starengine_version
def libGroup = project.starengine_group

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // ── 事件桥前置:Puzzles Lib(硬依赖,2026-09-29 用户裁决「许可引入」) ──────────
    // 背景:Fabric API 1.20.1 **没有可改伤害值的事件**(ServerLivingEntityEvents.ALLOW_DAMAGE
    // 只能取消、不能改 amount),而本模组 109 个事件处理器里承重最重的正是
    // LivingDamageEvent(11 处)/ LivingHurtEvent(3 处)/ MobEffectEvent.*(10 处)。
    // Puzzles Lib 以 mixin 提供了一整套「可改数值」的回调(自带 MutableXxx 家族),
    // 注入点实测与 Forge 的对应 patch 位置一致(见 platform/PuzzlesBridges 的映射表)。
    // ⚠️ 硬依赖 ⇒ 进 fabric.mod.json 的 depends;它自带 puzzlesaccessapi(内嵌),
    //    但**不含** Forge Config API Port ⇒ dev 运行期要一并投放。
    modImplementation "maven.modrinth:puzzles-lib:${puzzleslib_mr_version}"
    // 无条件投放:forgeconfigapiport 是 puzzleslib 自己的硬前置(depends 里写 "*"),
    // 关掉只会得到「puzzleslib 在、FCAP 不在」这种必被 Loader 以 HARD_DEP 拒绝的组合。
    modRuntimeOnly "maven.modrinth:forge-config-api-port:${forgeconfigapiport_mr_version}"

    // ── 前置库(跨仓硬前置;独立外部 jar，与另三线同口径) ─────────────
    // ⚠️ 库必须先 :fabric-1.20.1:publishToMavenLocal。
    // ⚠️ 2026-11-02 用户裁决:库**不再内嵌**(Loom include 已撤除),玩家/整合包必须自行把
    //    starengine-fabric-1.20.1-<starengine_version>.jar 放进 mods;版本下限由 fabric.mod.json 的
    //    depends.starengine 表达(${lib_version_range}, 见 gradle.properties)。
    modImplementation "${libGroup}:starengine-fabric-1.20.1:${libVersion}"

    // ── 饰品栏提供方之一:Trinkets(替代 Curios;本线的原始移植目标) ──────────
    // ⚠️ 2026-09-29 用户裁决:Trinkets 与 Accessories **二选一**即可 ⇒ 由「硬前置」改为**软前置**:
    //    fabric.mod.json 里 trinkets 从 depends 移入 recommends(与 accessories 并列)。
    //    Loader 的 depends 是 AND 语义、表达不了「任选其一」⇒ 权威判定在运行时
    //    (ModCompatibilityCheck#verifyAccessoryProviderOrThrow:两个都没有才拒绝启动)。
    // ⚠️ 拆成 modCompileOnly + 条件 modRuntimeOnly(对齐下面 Accessories 的既有做法),
    //    这样才能在 dev 里造出「仅 Accessories」与「两者皆无」两态 —— 否则 modImplementation
    //    会把 Trinkets 钉在运行期,四态里的两态永远测不到。
    //    编译期仍需要它:TrinketBridge 要实现 dev.emi.trinkets.api.Trinket。
    modCompileOnly "maven.modrinth:trinkets:AHxQGtuC"
    if (providers.gradleProperty('testTrinkets').getOrElse('true') != 'false') {
        modRuntimeOnly "maven.modrinth:trinkets:AHxQGtuC"
    }

    // ── 饰品栏提供方之二:Accessories(Wisp Forest 的数据驱动饰品栏;2026-09-29 新增) ──
    // 用户需求:「装了 Accessories 就不该再强制要求 Trinkets,反之亦然」。
    // 生产定位 = **软前置** —— fabric.mod.json 只进 recommends,不进 depends;
    //   缺席时本模组走 Trinkets;在场时 Accessories 成为**主通道**(见 compat/curios/CuriosApi)。
    // ⚠️ 编译期需要:物品要实现 io.wispforest.accessories.api.Accessory 适配器,
    //    门面要能读 AccessoriesCapability。而 Accessories 用 Loom 的
    //    `custom.loom:injected_interfaces` 给 LivingEntity 注入了 AccessoriesAPIAccess
    //    (其 fabric.mod.json 实证)⇒ 必须让 Loom 处理该 mod 的元数据,故用 modCompileOnly 而非普通 compileOnly。
    // ⚠️ Accessories 硬前置 Cloth Config >= 11.1.118 ⇒ 编译期一并声明(同样是软依赖,玩家侧由 Accessories 自己拉)。
    // ⚠️ dev 运行期默认投放(否则 dev 里永远看不到 Accessories 分支);
    //    跑「仅 Trinkets」那一态时用 -PtestAccessories=false 关掉。
    modCompileOnly "maven.modrinth:accessories:${accessories_mr_version}"
    modCompileOnly "maven.modrinth:cloth-config:${cloth_config_mr_version}"
    if (providers.gradleProperty('testAccessories').getOrElse('true') != 'false') {
        modRuntimeOnly "maven.modrinth:accessories:${accessories_mr_version}"
        modRuntimeOnly "maven.modrinth:cloth-config:${cloth_config_mr_version}"
    }
    // dev 四态(对应生产可能的四种安装组合;四态都必须能跑到「就绪/或给出明确拒绝」):
    //   (默认)                          → 两者都在
    //   -PtestTrinkets=false            → 仅 Accessories   ← 与用户当前整合包一致
    //   -PtestAccessories=false         → 仅 Trinkets
    //   -PtestTrinkets=false -PtestAccessories=false → 两者皆无 ⇒ 期望本模组给出明确中文拒绝

    // Cardinal Components(库以 modApi 暴露,这里显式声明以固定版本)
    // ⚠️ 曾经的 Cardinal Components API **运行前置**已按用户裁决移除：
    //    组件/持久化全部改用 **Fabric API 自带的 fabric-data-attachment-api-v1**
    //    (随 fabric-api 分发 ⇒ 零第三方前置)。见 component/AttachedDataKey.java。
    //
    // 但 CCA 仍在**编译期**必要：Trinkets 3.7.2 的 `TrinketComponent extends ComponentV3`
    // (javap 实证)，javac 解析 `TrinketsApi#getTrinketComponent` 的签名时必须能加载 CCA 类型。
    // ⇒ modCompileOnly(不进运行前置、不写进 fabric.mod.json)。
    // 运行期 CCA 由 **Trinkets 自己** hard-depends(其 fabric.mod.json 声明
    // cardinal-components-base/entity >=3.0.0-0)⇒ 玩家不再需要为「本模组」单独装 CCA。
    modCompileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${cca_version}"
    // ⚠️ 2026-09-29 实机修正:CCA 不只是编译期需要 —— Trinkets 3.7.2 **声明**了对
    //    cardinal-components-base/entity 的硬依赖,但**没有内嵌**它们 ⇒ dev 运行环境
    //    必须显式投放,否则 Fabric Loader 在解析阶段就硬拒(mod resolution failed)。
    //    生产环境:该依赖是 Trinkets 的传递依赖,由 Loader 提示玩家自行安装,不算本模组的前置。
    modRuntimeOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${cca_version}"
    modRuntimeOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${cca_version}"

    // ── Patchouli(Fabric 版;手册是本模组的核心引导,首个版本即纳入) ─────────
    modImplementation "maven.modrinth:patchouli:nm6fiGRx"

    // ── GeckoLib 核心已 vendor 进 starengine(2026-11-03,源码级非 JarJar) ──
    //    fabric 变体随库分发(含 geckolib.aw 的 access widener,已写进库的 fabric.mod.json)⇒
    //    本线不再声明 geckolib 前置,也不需要 Modrinth 的 geckolib 坐标。

    // ── 运行时/测试环境依赖(仅 dev runtime;不进发货产物) ──────────────────
    // 用户要求的测试环境三件套 + 渲染栈
    // ⚠️ Sodium 0.5.x 在 **dev 环境**要求 LWJGL **3.3.1**(= 1.20.1 自带版本),
    //    而 Loom 的 dev runtime 会带进来 **3.3.2-snapshot**,于是客户端启动即
    //    "The game failed to start because the currently active LWJGL version is
    //    not compatible"(2026-09-29 首见,2026-11-03 实测日志
    //    `Installed version: 3.3.2-snapshot / Required version: 3.3.1`)。
    //    要跑 Sodium 必须把 org.lwjgl:* 钉回 3.3.1(文件末尾有对应的
    //    resolutionStrategy 块);只想验证本模组自身时仍可用 `-PtestSodium=false`。
    if (providers.gradleProperty('testSodium').getOrElse('true') != 'false') {
        modRuntimeOnly "maven.modrinth:sodium:OihdIimA"
        modRuntimeOnly "maven.modrinth:indium:nQHYSjxO"
    }
    modRuntimeOnly "maven.modrinth:lithium:iEcXOkz4"
    modRuntimeOnly "maven.modrinth:starlight:XGIsoVGT"
    modRuntimeOnly "maven.modrinth:modernfix:rPmgLeZC"
    modRuntimeOnly "maven.modrinth:ferrite-core:unerR5MN"
    // Jade（方块/实体信息 HUD；测试环境用,不进发货产物）
    // ⚠️ 2026-10-01 起由 `modRuntimeOnly` 改为 **`modImplementation`**：`mixin/jade/**`
    //    需要**编译期**引用 Jade 的类（`snownee.jade.addon.vanilla.EntityArmorProvider` /
    //    `snownee.jade.impl.ui.ArmorElement` / `snownee.jade.overlay.DisplayHelper|IconUI|OverlayRenderer`）。
    //    Jade 是**可选依赖**：**不写进** `fabric.mod.json` 的 depends；mixin 配置用
    //    `required:false` + 字符串 `targets` ⇒ Jade 缺席时整条 mixin 静默跳过、不影响启动。
    //    Modrinth version id `ahavHbAT` = `Jade-1.20-Fabric-11.13.3.jar`（与 forge 线 11.13.3 同版）。
    modImplementation "maven.modrinth:jade:ahavHbAT"
    // JEI(物品/配方查看器;compat/jei 适配层的编译期依赖)
    // 历史:JEI 15.62.0.216 的 fabric 产物由 **Loom 1.17.20** 构建,曾被本线的 Loom 1.14.10
    //   以「Mod was built with a newer version of Loom」门禁拒绝,故只作 modRuntimeOnly 手工投放。
    //   2026-11-01 本线 Loom 升至 1.17.21:门禁只比 major.minor 两段(1.17 vs 1.17 相等即放行),恢复为编译期依赖。
    //   注意 1.18.x 起强制 Gradle 9.7 + JVM 25,本线固定 JDK21 故不跟。
    // JEI(物品/配方查看器;compat/jei 适配层的编译期依赖)。
    //   (与 gradle.properties 的 jei_version=15.62.0.216 同版;forge 变体 id 是 p5jzDqhi,别混用)。
    // 坐标:Modrinth version id bTwbXhIB = jei-1.20.1-fabric-15.74.0.234.jar(最新公开版,2026-11-03 升级);
    //   与 gradle.properties 的 jei_version=15.74.0.234 同版;forge 变体 id 是 6E4ps2ER,别混用。
    modImplementation "maven.modrinth:jei:bTwbXhIB"
    // JEI 15.62.0.216 的**硬依赖** mezzconfig（mod id `mezz_config`，Modrinth 项目 `7tEfOcA7`）：
    //   Loader 解析阶段是 HARD_DEP（`[0.6.3,1.0.0)`），缺它 dev runServer/runClient 直接死在
    //   FabricLoader Resolution（2026-11-01 实机 launch 首跑即踩）。
    //   仅 dev 运行期需要：本模组代码不引用、不 jarJar、也不写进 fabric.mod.json。
    //   坐标：Modrinth version id `f1hgxQ9M` = MezzConfig 0.6.10（1.20.1 / fabric）。
    modRuntimeOnly "maven.modrinth:mezzconfig:f1hgxQ9M"
    modRuntimeOnly "maven.modrinth:carpet:K0Wj117C"
    // KubeJS(测试探针用,与 forge 侧 2001.6.5-build.26 对齐)
    // ⚠️ KubeJS 声明 architectury >= 9.1.12 硬依赖 ⇒ 必须一并投放,否则 Loader 解析阶段硬拒。
    modRuntimeOnly "maven.modrinth:architectury-api:${architectury_mr_version}"
    modRuntimeOnly "maven.modrinth:kubejs:Pu0Ygbq6"
    modRuntimeOnly "maven.modrinth:rhino:MLIu0Tct"

    // ── 渲染栈对齐(2026-11-03 用户要求:fabric 测试环境与 1.21.1 / 26.1.2 对齐,含光影) ──
    // 缺口实测(2026-11-02 实机):另三线 run/mods 都有 Sodium + Iris + 光影包(ComplementaryReimagined_r5.9.3.zip),
    // 而本线只有 sodium(被 testSodium=false 关掉)+ 一套"轻量优化"(lithium/starlight/modernfix/ferritecore)。
    // ⇒ 逐项补齐下面三项 + LWJGL 钉版 + 光影包(见 scripts/test/resources/shaderpacks/)。
    //
    // Iris(Fabric;光影加载器):Modrinth version id `s5eFLITc` = iris-1.7.6+mc1.20.1.jar
    //   硬依赖 Sodium(>=0.5) ⇒ 与上面 testSodium 开关同进同出,关掉 sodium 时本项也要关。
    if (providers.gradleProperty('testSodium').getOrElse('true') != 'false') {
        modRuntimeOnly "maven.modrinth:iris:s5eFLITc"
    }
    // ImmediatelyFast(Fabric;1.21.1 线的同款渲染优化)version id `iwYUrQJO` = 1.5.5,game_versions 含 1.20.1
    modRuntimeOnly "maven.modrinth:immediatelyfast:iwYUrQJO"
    // ⚠️ ImmediatelyFast 1.5.x 的 **Iris 兼容层**依赖 `net.lenni0451:Reflect`（Iris 1.8.x 才把它
    //    内嵌进 jar；本线 1.20.1 的 Iris 最高只到 1.7.6 ⇒ 没人提供这枚类库）。
    //    缺它的实测症状（2026-11-03）：窗口初始化阶段抛
    //    `NoClassDefFoundError: net/lenni0451/reflect/accessor/FieldAccessor`
    //    （栈顶 ImmediatelyFast.IrisCompat.init），进程直接死在 Window.<init>。
    //    处置：不手写坐标，交给仓内既有 `python tools/loom_embedded_jars.py --side client --apply`
    //    统一抽取（它会从 immediatelyfast 的 nested jar 里挖出 `Reflect-1.6.2.jar`，
    //    版本正好与 IF 自带的一致；手写 1.5.0 反而会与它抢同一批类）。
    // Superflat World No Slimes + 其硬依赖 Collective（超平坦测试世界里刷史莱姆会污染实体计数类断言）
    //   坐标 id 均为 Modrinth version id: I6QPoepF = 1.20.1-3.7-fabric+forge+neo；SIqDV2gB = collective 1.20.1-8.73
    modRuntimeOnly "maven.modrinth:superflat-world-no-slimes:I6QPoepF"
    modRuntimeOnly "maven.modrinth:collective:w5c5YvXl"   // 1.20.1-8.75 (2026-11-03 从 8.73 升级)

    // ── 用户 2026-11-03 追加的测试环境三件套（仅 dev runtime） ──────────────
    // ModMenu：mod 列表 GUI（查 mod id / 版本 / 冲突时用）。7.2.2 无声明依赖（Fabric API 本工程已带）。
    //   Modrinth version id `lEkperf6` = modmenu-7.2.2.jar
    modRuntimeOnly "maven.modrinth:modmenu:lEkperf6"
    // Carpet-Fixes：Carpet 的 bug 修正集（假人/区块加载相关的原版行为偏差会污染断言）。
    //   **硬依赖 Carpet**（上面 `carpet:K0Wj117C` 已投放，mod id `carpet`，Modrinth 项目 TQTTVgYE）。
    //   Modrinth version id `NBCnBGZj` = carpet-fixes-1.20-1.16.1.jar
    modRuntimeOnly "maven.modrinth:carpet-fixes:NBCnBGZj"
    //   ↑ carpet-fixes 的 fabric.mod.json 还有 **conditional-mixin: "*"** 硬依赖
    //     （2026-11-03 实测：缺它服务端在 Loader Resolution 阶段直接
    //      "模组 'Carpet Fixes' (carpet-fixes) 1.20-1.16.1 需要 conditional-mixin 的 任意版本，但没有安装它"）。
    //     该库不在 Modrinth，走作者 jitpack 代理（repositories 里已加），0.6.5 是当前 release。
    //   ⚠️ 必须取 **fabric 子工件**：0.6.5 是多加载器聚合发布，
    //      `com.github.Fallen-Breath:conditional-mixin:0.6.5` 的 POM 会同时拉
    //      common/fabric/forge/neoforge 四个子件，Gradle 按 variant 选到
    //      `conditional-mixin-neoforge:0.6.5`（class 版本 65 = Java 21）⇒ 本线 JDK17
    //      直接 "only compatible with JVM runtime version 21 or newer"。
    //      fabric 子件是本线唯一需要的那一枚（class 版本 52，含 fabric.mod.json id=conditional-mixin）。
    modRuntimeOnly "com.github.Fallen-Breath.conditional-mixin:conditional-mixin-fabric:0.6.5"
    // Debugify：客户端/服务端 bug 修正 + 诊断报告（1.20.1 分支版本号 1.20.1+2.0）。
    //   ⚠️ fabric.mod.json 声明 **required** 依赖 yacl ⇒ 缺它 Loader 解析阶段硬拒。
    //   (Debugify 的 depends 只要求 *,YACL 3.x 对小版本保持向后兼容;启动实测见测试台决策文档)。
    //   原按 Debugify 声明值钉在 YACL 3.1.0;2026-11-03 按「测试台追最新公开版」升到 3.6.6+1.20.1
    //   Modrinth version id `6XDJoCks` = Debugify-1.20.1+2.0.jar
    modRuntimeOnly "maven.modrinth:debugify:6XDJoCks"
    modRuntimeOnly "maven.modrinth:yacl:dvS5DjUA"   // 3.6.6+1.20.1 (2026-11-03 从 3.1.0 升级)

    // AutoJS 实机测试库（仅 dev 运行期；CI/普通构建不解析）
    // 由 scripts/test/tools/publish_autojs_maven.ps1 发布到 mavenLocal（见本文件 :47 的 mavenLocal()）。
    // 条件守卫：默认关闭 => 没有本地产物时普通构建 / CI 不解析该坐标。
    // Loom 的 mod* 配置对带 fabric.mod.json 的依赖做 intermediary->named；AutoJS 产物
    //    manifest `Fabric-Loom-Version=1.10.5`，低于本仓 1.19.3，不触发 built-with-newer-Loom 门禁。
    // 必须 modRuntimeOnly（不写成 modImplementation）：本模组代码不引用 AutoJS；也不 jarJar。
    if (providers.gradleProperty('autojsTestMod').orNull == '1') {
        modRuntimeOnly 'cc.sighs.autojs:AutoJS-fabric-1.20.1:1.0.0'
    }
}

loom {
    // ⚠️ interfaceInjection.enableDependencyInterfaceInjection 保持**开启**(Loom 1.14 起的既有行为;
    //    1.19.3 未变:构造函数里对 enableDependencyInterfaceInjection 调 convention(true),javap 实证),
    //    虽然它会被 Accessories 的 custom.loom:injected_interfaces 顺手利用
    //    (把 AccessoriesAPIAccess 注入 LivingEntity、把 AbstractButtonExtension 注入 AbstractButton)。
    //    不能关:本模组的 FabricLootInjector 依赖 **Fabric API 自己的注入**
    //    (fabric-loot-api-v2 把 LootTable.Builder#pool/pools 注入到原版 LootTable.Builder 上),
    //    关掉会连它一起消失(实测:7 处「找不到符号: tableBuilder.pool(...)」)。
    //    ⇒ 接入 Accessories 带来的编译期污染改为在**源码侧**消化:见
    //      client/gui/StarCoinWalletButtons$WalletButton#getRenderingEvent 的说明。
    accessWidenerPath = file('src/main/resources/astral_dice.accesswidener')
    // ⚠️ Loom 1.14 起(含 1.19.3)Mixin 注解处理器**默认关闭**;`mixin { }` 配置会被告警要求移除。
    //    refmap 由 Loom 在 remapJar 阶段依据 mixin 配置自动生成(见 P0 验证步骤)。
    runs {
        client {
            client()
            ideConfigGenerated = true
            runDir 'run/client'

            // 自动化测试:gradlew runClient -Pquickplay=<世界名> 直接进入指定单机世界
            // (与 forge-1.20.1 / neoforge-* 三线**同构** —— 本线移植时漏搬,2026-09-29 补)
            // ⚠️ 注意 API **不通用**:ModDevGradle/ForgeGradle 是 `programArgument`(单数名词),
            //    Fabric Loom 是 `programArg`/`programArgs` —— 照抄另三线的写法会在配置期直接报
            //    "Could not find method programArgument()"(实测 2026-09-29)。
            // 自动化测试(2026-11-02 加):gradlew runClient -PquickplayMultiplayer=127.0.0.1:25565
            //   直接加入指定服务器。原有的 -Pquickplay 只支持单机世界(--quickPlaySingleplayer)，
            //   而 LT 实机批次里大量条目需要真玩家在线(/astralparty dump @a 之类会回 No player was found)，
            //   没有这条参数就只能靠人手点菜单。两个参数互斥，同时给时以 multiplayer 为准。
            if (project.hasProperty('quickplayMultiplayer')) {
                programArg '--quickPlayMultiplayer'
                programArg project.findProperty('quickplayMultiplayer')
            } else if (project.hasProperty('quickplay')) {
                programArg '--quickPlaySingleplayer'
                programArg project.findProperty('quickplay')
            }

            // 自动化测试:固定游戏窗口尺寸 1920x1080(便于 OCR 读取画面与屏幕坐标换算)
            programArg '--width'
            programArg '1920'
            programArg '--height'
            programArg '1080'

            // 自动化测试:gradlew runClient -PdevUsername=<名字> 固定玩家名
            // 为什么需要:Loom 默认每次给**随机**用户名(Player353/Player705…),而离线 UUID 由玩家名派生
            //   ⇒ 每次运行都是一个**全新玩家**、玩家数据互不相通 —— 任何「跨会话」缺陷(重复发放、
            //   记忆标记、冷却残留)在 dev 里**根本不可能复现**。固定玩家名后,重复运行 = 同一玩家
            //   反复登录/死亡重生,这类缺陷才可测(2026-09-29 加,为排查「手册重复发放」)。
            // ⚠️ 单机下还存在 `level.dat` 的 `Player` 标签这条通路(`PlayerList#load` 对单人房主优先读它),
            //    因此「固定玩家名」只保证玩家身份稳定,不等于数据一定从 `playerdata/<uuid>.dat` 读。
            if (project.hasProperty('devUsername')) {
                programArg '--username'
                programArg project.findProperty('devUsername')
            }

            // 自动化测试:gradlew runClient -PpreloadClasses=<intermediary 名,逗号分隔>
            // 把「只在目标类被加载时才暴露」的 mixin 注入缺陷提前到**启动期**(见
            // AstralDiceClient#preloadClassesForSmokeTest 与 KNOWN-ISSUES **KI-F14**)。
            // ⚠️ API 不通用:Loom 是 `vmArg`(单数),ModDevGradle/ForgeGradle 是 `jvmArgument`/`vmArgs`。
            if (project.hasProperty('preloadClasses')) {
                vmArg "-Dastral_dice.preloadClasses=${project.findProperty('preloadClasses')}"
            }
        }
        server {
            server()
            ideConfigGenerated = true
            runDir 'run/server'
        }
        // 数据生成(2026-09-29 补)。
        // ⚠️ 与 forge 线的 `data { data() }` 运行**不同源**:Fabric 没有「gradle 插件托管 datagen」,
        //    而是由 FAPI 的 `fabric-data-generation-api-v1` 读这几个系统属性来驱动,
        //    入口 = fabric.mod.json 的 `fabric-datagen` entrypoint(AstralDataGenerator)。
        // 跑法:`./gradlew :fabric-1.20.1:runDatagen`
        // 产物:`src/generated/resources`(再由下方 sourceSets 纳入资源集 → 进产物 jar)。
        datagen {
            server()
            name = "Data Generation"
            // 这三个 -D 是 FAPI datagen 的约定开关,缺一不可:
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file('src/generated/resources').absolutePath}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"
            // 只对声明的模组做严格校验:把「引用了不存在的纹理/模型」这类问题在生成期就打出来,
            // 而不是等到游戏里显示成缺失贴图。
            vmArg "-Dfabric-api.datagen.strict-validation"
            runDir 'run/datagen'
        }
    }
}

// fabric.mod.json 占位符展开(属性必须在配置期取到本地变量,否则 Gradle 9 configuration cache 失效)
def templateProps = [
        version                : project.version.toString(),
        loader_version         : project.loader_version.toString(),
        minecraft_version_range: project.minecraft_version_range.toString(),
        trinkets_version       : project.trinkets_version.toString(),
        cca_version            : project.cca_version.toString(),
        accessories_version_range: project.accessories_version_range.toString(),
        puzzleslib_version_range: project.puzzleslib_version_range.toString(),
        lib_version_range      : project.starengine_version_range.toString(),
]
processResources {
    inputs.properties(templateProps)
    filesMatching('fabric.mod.json') { expand(templateProps) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 移植期需要看到完整错误面(默认 -Xmaxerrs 100 会截断,导致严重低估工作量)
    options.compilerArgs += ['-Xmaxerrs', '4000']
}

// === 产物分发(build 后自动触发;口径对齐另三线) ===
//
// 三个落点:
//   ① pushToDevRun    → 仓库根 run/fabric-1.20.1/mods                       (开发测试环境)
//   ② pushToRootBuild → 仓库根 build/libs                                   (全部版本产物的统一交付目录)
//   ③ pushToGame      → /mnt/d/.minecraft/versions/1.20.1-Fabric 模组测试/mods (用户测试整合包；Windows 宿主同盘为 D:\.minecraft\…)
//
// ⚠️ 整合包推送的 git 分支守卫(对齐另三线,2026-09-12 起的**白名单**口径):
//   · 分支在 packPushBranches(白名单)内                        → 允许 pushToGame
//   · 分支不在白名单 / 无法确定分支(detached HEAD、无 .git,如 CI) → 跳过,只打日志,不算失败
//   · 传 -PdeployToPack 或 -PpackPush                          → 强制推送,覆盖上述判定(手动出包通道)
//   理由同另三线:整合包是**需要"成对匹配"的测试环境** —— 前置库 jar 与 mod jar 必须版本互相匹配,
//   把不匹配的组合灌进测试包会表现为启动期 NoClassDefFoundError / "缺必需前置"。
//   本线是**独立的第四条线**,其整合包目录 `1.20.1-Fabric 模组测试` 亦为本线专属
//   (与 forge 线的 `1.20.1-Forge 模组测试`、neoforge 线各自的目录互不相干)
//   ⇒ 白名单只登记**发布线分支**即可,不存在跨分支误写。
//   ⚠️ 2026-10-01:本线原独立分支 `1.20.1-fabric` 已并入 `multi-main`（本地 worktree 与分支已删；远端分支待 push 放行）
//   ⇒ 白名单由 `['1.20.1-fabric']` 改为 `['multi-main']`。**不改则本模块静默不再部署整合包**
//   (不在白名单 ⇒ pushToGame 只打一行 skipped 日志、不算失败,极易漏检)。
//
// 分支判定放在**执行期**(见 pushToGame 的 doLast),不做配置期求值:
//   ① 每次构建都读当时的 .git/HEAD,切分支后立即生效,不存在配置缓存陈旧问题;
//   ② 不把 Provider/闭包塞进 configuration-cache,避免缓存序列化限制与行为漂移。
// dotGitEntry 是配置期算好的 File(可序列化),执行期读它即可 —— 普通仓库这里是 .git **目录**;
// worktree 下它是**文件**,内容为 `gitdir: <path>`,真正的 HEAD 在 gitdir 下。
def devRunModsDir = rootProject.file('run/fabric-1.20.1/mods')
def rootBuildLibsDir = rootProject.file('build/libs')
// 整合包目录: 由根 build.gradle 的 mcHomePath 统一解析（MC_HOME > /mnt/d/.minecraft > D:/.minecraft）
def packModsDir = new File(rootProject.ext.mcHomePath, 'versions/1.20.1-Fabric 模组测试/mods')

// 【白名单】只有列在这里的分支允许把 jar 推进整合包;其余分支(含 WorkBuddy/DSH 自动建的
// `wt/*` worktree 分支)一律跳过 —— 白名单优于黑名单:新分支默认落在"不推送"一侧,
// 不会因为忘了登记而误推、误删整合包里的正式 jar。需要推送时把分支加进本表,或单次
// 用 -PdeployToPack 强制。
def packPushBranches = ['multi-main']
def forcePackPush = project.hasProperty('deployToPack') || project.hasProperty('packPush')
def libVersionLocked = project.findProperty('starengine_version')?.toString()
def dotGitEntry = rootProject.file('.git')

// 本线(fabric 1.20.1)的旧产物识别规则:**只清理带 `+fabric_1.20.1` 后缀的 jar**。
// ⚠️ 根 build/libs 是**全版本共用**目录(另三线的 jar 也在其中),宽泛匹配会把它们一并删掉
// ⇒ 必须按本子项目的**完整版本后缀**过滤(与 AGENTS「后缀必须写全」同口径)。
def staleJarMatcher = { File f ->
    f.isFile() && (f.name ==~ /astral_dice-.+\+fabric_1\.20\.1\.jar/)
}

// 共用动作:先删除目标目录里的旧产物、再复制新 jar(AGENTS 规则 2/7 的"先删后拷")。
// 禁止直接覆盖式复制 —— 旧版本号 jar 与新产品并存时游戏会同时加载两个本模组副本,
// 表现为行为异常甚至 NoSuchFieldError。
// 刻意**不引用** logger/project:只接收 File 参数、返回一行结果描述,便于在
// configuration-cache 下被任务 action 安全捕获。
def deployJar = { File srcJar, File destDir ->
    if (!destDir.exists()) {
        destDir.mkdirs()
    }
    def stale = destDir.listFiles().findAll(staleJarMatcher)
    stale.each { it.delete() }
    def target = new File(destDir, srcJar.name)
    target.withOutputStream { out ->
        srcJar.withInputStream { inp -> inp.transferTo(out) }
    }
    "pushed ${srcJar.name} -> ${destDir}"
}

// 执行期读取当前分支(普通仓库 .git 是目录;worktree 的 .git 是文件,内容记录 gitdir)。
def readGitBranch = { File dotGit ->
    File headFile = null
    if (dotGit.isDirectory()) {
        def hf = new File(dotGit, 'HEAD')
        headFile = hf.isFile() ? hf : null
    } else if (dotGit.isFile()) {
        def m = dotGit.text.trim() =~ /^gitdir:\s*(.+)$/
        if (m.find()) {
            def gd = new File(m.group(1).trim())
            if (!gd.isAbsolute()) {
                gd = new File(dotGit.parentFile, m.group(1).trim())
            }
            def hf = new File(gd, 'HEAD')
            headFile = hf.isFile() ? hf : null
        }
    }
    if (headFile == null) {
        return ''
    }
    def s = headFile.text.trim()
    s.startsWith('ref: refs/heads/') ? s.substring('ref: refs/heads/'.length()) : ''
}

// 生产/交付统一取 remapJar 产物(Loom officialMojangMappings → intermediary,生产环境形态)。
def remappedJarProvider = tasks.named('remapJar').flatMap { it.archiveFile }

// ① 开发测试环境:仓库根 run/fabric-1.20.1/mods
tasks.register('pushToDevRun') {
    group = 'build'
    description = 'Copy the built mod jar to the dev run mods folder (root run/fabric-1.20.1/mods) and remove old fabric 1.20.1 versions.'
    dependsOn tasks.named('remapJar')
    doLast {
        def jarFile = remappedJarProvider.get().asFile
        if (!jarFile.exists()) {
            logger.warn("pushToDevRun: built jar not found, skipped: ${jarFile}")
            return
        }
        logger.lifecycle("pushToDevRun: " + deployJar(jarFile, devRunModsDir))
    }
}

// ② 仓库根 build/libs:全部版本产物的统一交付目录
tasks.register('pushToRootBuild') {
    group = 'build'
    description = 'Copy the built production jar to the repository root build/libs (shared by all versions).'
    dependsOn tasks.named('remapJar')
    doLast {
        def jarFile = remappedJarProvider.get().asFile
        if (!jarFile.exists()) {
            logger.warn("pushToRootBuild: built jar not found, skipped: ${jarFile}")
            return
        }
        logger.lifecycle("pushToRootBuild: " + deployJar(jarFile, rootBuildLibsDir))
    }
}

// ③ 用户测试整合包: /mnt/d/.minecraft/versions/1.20.1-Fabric 模组测试/mods（Windows 宿主同盘为 D:\.minecraft\…）
tasks.register('pushToGame') {
    group = 'build'
    description = 'Copy the built mod jar to the bound game pack mods folder and remove old fabric 1.20.1 versions. Only the release branch (see packPushBranches) pushes; force with -PdeployToPack.'
    dependsOn tasks.named('remapJar')
    doLast {
        // --- 约定:只有白名单分支推送整合包(见文件顶部「产物分发」说明) ---
        if (!forcePackPush) {
            def branch = readGitBranch(dotGitEntry)
            if (branch.isEmpty()) {
                logger.lifecycle('pushToGame: skipped — 无法确定当前 git 分支(detached HEAD 或无 .git);如需强制推送请加 -PdeployToPack')
                return
            }
            if (!packPushBranches.contains(branch)) {
                logger.lifecycle("pushToGame: skipped — 分支 '${branch}' 不在整合包推送白名单 ${packPushBranches} 内;如需强制推送请加 -PdeployToPack")
                return
            }
        }
        def jarFile = remappedJarProvider.get().asFile
        if (!jarFile.exists()) {
            logger.warn("pushToGame: built jar not found, skipped: ${jarFile}")
            return
        }
        if (!packModsDir.exists()) {
            // 仅当整合包根目录存在时才创建 mods 子目录;根目录不存在(如 CI 环境)直接跳过,
            // 避免在无该盘符的机器上凭空造出半截目录。
            def packRoot = packModsDir.getParentFile()
            if (packRoot == null || !packRoot.exists()) {
                logger.warn("pushToGame: pack dir not found, skipped: ${packModsDir}")
                return
            }
            packModsDir.mkdirs()
        }
        logger.lifecycle("pushToGame: " + deployJar(jarFile, packModsDir))

        // --- 外置前置自检:库**不再内嵌**(2026-11-02 用户裁决),产物里不应有 META-INF/jars/*.jar,
        //     整合包里**必须**有独立的 starengine jar ---
        // 库现为四线统一的外部硬前置:fabric.mod.json 的 depends.starengine 携带版本区间
        // [${libVersionLocked},2.0.0),缺少库或版本不符时 Loader 会以「缺少必需前置」拒绝启动。
        // 此处只告警,不阻断构建。
        def zf = new java.util.zip.ZipFile(jarFile)
        try {
            def entries = zf.entries().toList()
            def nested = entries.findAll {
                it.name.startsWith('META-INF/jars/') && it.name.endsWith('.jar')
            }*.name
            if (!nested.isEmpty()) {
                logger.warn("pushToGame: 产物 ${jarFile.name} 仍内嵌 META-INF/jars/(已改为外置前置, 请确认 Loom include 已移除)")
            } else {
                logger.lifecycle("pushToGame: 外置前置自检 OK — 产物内无内嵌库")
            }
        } finally {
            zf.close()
        }
        if (libVersionLocked) {
            def libJars = packModsDir.listFiles()?.findAll { File f ->
                f.isFile() && f.name.startsWith('starengine-') && f.name.endsWith('.jar')
            } ?: []
            if (libJars) {
                logger.lifecycle("pushToGame: 整合包内独立库 jar ${libJars*.name}(外置前置口径, 需与引脚 ${libVersionLocked} 匹配)")
            } else {
                logger.warn("pushToGame: 整合包内**缺少**独立的 starengine jar —— " +
                        "库现为外部硬前置, 必须放入 starengine-fabric-1.20.1-${libVersionLocked}.jar, 否则游戏以缺前置拒绝启动")
            }
        }
    }
}

// 2026-11-02: dev run 强制 JDK 21（不改产物字节码，仅改运行期 JVM）。
// 根因（实测，非推测）：fabric-loader 0.19.5 内置 tinyremapper 0.15 的 OutputConsumerPath
// 用 `FileSystemReference.openJar(path, create=true).isReadOnly()` 判定可写性；
// JDK 17 的 zipfs 在目标 jar **尚不存在**时把 readOnly 推成 true（探针实测 JDK17 isReadOnly=true、
// JDK21 isReadOnly=false，同一 fabric-loader jar、同一路径）⇒ 运行期重映射必然抛
// `java.io.IOException: the jar file ... can't be written`。
// 触发面仅限「需要运行期重映射的 mod」= run/{server,client}/mods 里的 astral_embedded-*.jar
// （tools/loom_embedded_jars.py 投放的内嵌库），删掉它们会缺 puzzlesaccessapi 启动失败。
// 产物 compileJava 仍按 toolchain 17 出 Java 17 字节码，仅 runClient/runServer/runDatagen 换 JVM。
tasks.configureEach { t ->
    if (t.name == 'runClient' || t.name == 'runServer' || t.name == 'runDatagen') {
        if (t.hasProperty('javaLauncher')) {
            t.javaLauncher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }
    }
}

tasks.named('build') {
    // 统一推送标准:三个分发任务均在 build 后默认触发(整合包推送受分支白名单限制)
    finalizedBy tasks.named('pushToDevRun')
    finalizedBy tasks.named('pushToRootBuild')
    finalizedBy tasks.named('pushToGame')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ── LWJGL 钉版(2026-11-03;Sodium/光影对齐的**前置条件**) ──────────────────────
// 事实:Sodium 0.5.x(fabric 1.20.1)只认 LWJGL **3.3.1**,而 Loom 的 dev runtime 带的是
//   **3.3.2-snapshot** ⇒ 不钉版直接启动会报 "The game failed to start because the
//   currently active LWJGL version is not compatible"(实测 Installed=3.3.2-snapshot /
//   Required=3.3.1)。这也是本线长期用 -PtestSodium=false 的根因。
// 做法:只在启用 Sodium 时,把所有 *runtimeClasspath 配置里的 org.lwjgl:* 钉回 3.3.1
//   (natives 一并抬,版本在 maven central 都有);-PtestSodium=false 时完全不介入。
if (providers.gradleProperty('testSodium').getOrElse('true') != 'false') {
    configurations.configureEach { cfg ->
        if (cfg.name.toLowerCase(java.util.Locale.ROOT).endsWith('runtimeclasspath')) {
            cfg.resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'org.lwjgl') {
                    details.useVersion('3.3.1')
                }
            }
        }
    }
}

