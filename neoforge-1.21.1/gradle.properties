# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.21.1]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.235
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)
# KubeJS version for automated testing (Curios slot checking scripts), 1.21.1 = 2101.x series
kubejs_version=2101.7.2-build.372

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=astral_dice
# The human-readable display name for the mod.
mod_name=Astral Dice
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT License
# The mod version. See https://semver.org/
mod_version=1.3.0+neoforge_1.21.1
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.merlinkitsune.astral_dice

## 前置库坐标(StarEngine Lib,独立仓库 https://github.com/merlin-kitsune/starengine_lib,发布到 mavenLocal)
# 升级库版本时须与库仓库 gradle.properties 的 lib_version 同步
# .2:库侧把 Java 包名由 com.merlinkitsune.starengine 改为 com.merlinkitsune.starenginelib,
#    本模组全部 import 随之改写;group 也同步变为 com.merlinkitsune.starenginelib。
# .3:库侧完全移除 Cloth Config 前置与公共配置模块,并把 GameplayConfigValues 由 13 字段
#    收敛为 6 字段 —— 本模组配置随之回归自己的 TOML(ModCommonConfig, ModConfigSpec),
#    并在配置加载后把值快照推给库的 GameplayConstants.applyConfig(...);
# .4:库侧新增 effect/ReadyEffect(三线共享的自包含单元补齐下沉,本模组当前不引用该类);
# .5:合并完成后库侧按期删除过渡符号(EventTargetCollector.collectTargets+女仆收集、
#    GameplayConstants.EVENT_RANGE/EVENT_APPLY_MAID/KOMACHI_EXTRA_PLAYS_CAP、effect/ReadyEffect),
#    本模组三线对这些符号零引用;事件框架三件套因本模组 AstralEventSystem 仍留 4 处 import 而暂留。
# .6:库侧修复**库自身被 FML 拒载**的根因(属元数据修复,**不是 API 变更**):
#    neoforge-1.21.1 的 loaderVersion 槽曾被误填 NeoForge 版本带 [21.1,21.2) —— 该槽比的是
#    javafml 语言提供者版本(本机 NeoForge 21.1.235 报 4.0.42),故 .5 的库 jar 在语言匹配阶段
#    被直接拒载(实测 run/1.21.1/crash-reports/crash-2026-09-17_20.41.28-fml.txt 与 _20.42.17-fml.txt)
#    ⇒ 改为语言区间 [1,);同时 forge-1.20.1 的 loaderVersion 由 [47,) 收敛为 [47,48)、其 forge
#    依赖改用从 forge_version 派生的精确区间 [47.4.10,48)。库内 Java 源码零改动,本模组三线对库
#    的类/方法引用完全不变;必须 bump 是因为 `.5` 已发布到 mavenLocal 且其 jar 会被 FML 拒载,
#    不收紧下界就会继续解析到那份坏 jar。
# .10:库侧把版本统一为 `1.0.0-SNAPSHOT.10`(与本站 `2.0.0-SNAPSHOT.10` 的 patch 段同号),并**并入原
#    `.7` 在途的修复**:给 forge-1.20.1 补上缺失的 `pack.mcmeta`(Forge 1.20.1 的 ClientModLoader 会对
#    **每个**模组 jar 做资源包元数据校验,缺失即在加载界面各报一条「failed to load a valid
#    ResourcePackInfo」并跳过该模组的资源包注册;1.21.1 / 26.1.2 不走该路径,故只有 1.20.1 侧需要)。
#    库侧 `.7` 只发布过 mavenLocal、从未入库(库 `main` 上是 `.6` → `.10`),故库侧不单列 `.7` 小节,
#    本线引脚直接由 `.7` 提到 `.10` —— 这同时修掉「本站钉 `.7`、而 mavenLocal 里那份 `.7` 缺
#    `pack.mcmeta`」的不一致。库内 Java 源码零改动,本模组三线对库的类/方法引用完全不变。
# .12:库侧新增 `GameplayConstants.ALLOW_FIREARM_DAMAGE`(public static boolean,默认 false),
#    并把 `GameplayConfigValues` 由 6 分量扩为 7 分量(第 7 个 = boolean allowFirearmDamage,追加在末尾),
#    配合 `applyConfig(...)` 写入。本线据此把法伤模块对枪弹/炮弹类伤害的**硬编码无条件屏蔽**改为由公共
#    配置 `allow_firearm_damage`(默认 false)控制 —— 默认行为与改动前逐字等价。必须收紧下界:`.11`
#    的库 jar 没有该字段,运行期会 `NoSuchFieldError`。
# .14:库侧新增 `economy` 包(**玩家余额账本** —— 星币钱包的库侧底层,对标 SG-Economy 的位置):
#    `StarEngineEconomy`(对外 API:getBalance/setBalance/hasBalance/deposit/withdraw/transfer + 离线读;
#    **存储缺失时一律返回 0/false 且不抛异常**,供 FTB 等第三方模组安全联动)、`EconomyStorage`
#    (平台存储 seam:读/写/离线读)、`StarCoinCommand`(`/starcoin add|set|remove|get|rank`,rank 含离线玩家)、
#    `CommandPermissionGate`(权限判定 seam —— `CommandSourceStack#hasPermission` 在 26.1.2 上签名不一致,
#    故不进共享源码,由平台注入)。余额落在**玩家持久化 NBT**(库不注册任何注册表条目,故不用 AttachmentType),
#    并由 `PlayerEvent.Clone` 显式复制 ⇒ 不因死亡丢失。本线据此实现星币钱包。必须收紧下界:`.12` 的
#    库 jar 没有这些类,运行期会 `NoClassDefFoundError`。(括注「26.1.2 线仍钉 `.11` 且未接入」描述的是
#    写 `.14` 条目时的状态;该线已于 2026-09-17 接入库,现三线同钉 `1.0.0`。)
# 1.0.0:**首个正式版** —— 由快照系列最后一档 `1.0.0-SNAPSHOT.16` 规范化而来,库内 Java 源码零改动,
#    产物文件名由 `starengine_lib-<平台>-1.0.0-SNAPSHOT.16.jar` 变为 `…-1.0.0.jar`。
#    ⚠️ **库侧同时立下兼容性契约(全局约定,2026-09-22)**:同一主版本号内(第一位数字不变,当前 = 1.x)
#    **禁止任何破坏性更新**;破坏性变更必须升第一位(1.x → 2.x)并同步收紧下方 `_version_range` 下界。
#    ⇒ 本模组无需为库 1.x 内的升级改动代码;下方区间即该契约的机器可读表达。
# 1.0.2:「额外敌对判定」seam(2026-09-24) —— 库的 `combat/HostileTargets` 新增消费方注入入口
#    (`ExtraHostileProbe` / `installExtraHostileProbe`),供本模组把**试验假人**(dummmmmmy)这类
#    「既非 Enemy、也非被激怒中立生物」的实体声明为敌对目标(否则需要敌对目标的效果选不中它)。
#    库侧纯新增,契约不变。**跳过 1.0.1**:该号在 mavenLocal 留有已撤销版本的残留目录,复用会
#    「同号覆盖」而让本模组静默解析到旧 jar(详见库 CHANGELOG 的 1.0.2 小节)。
#    ⇒ 下界随本版收紧到 `[1.0.2,2.0)`:更旧的库 jar 会在加载期被判「缺必需前置」而明确报错,
#    而不是运行到 `installExtraHostileProbe` 时才 `NoSuchMethodError`。
starengine_lib_version=1.0.2
starengine_lib_group=com.merlinkitsune.starenginelib
# mods.toml 中声明的前置版本区间。
# ⚠️ **自库 1.0.0 起,下界即库的当前版本(现为 [1.0.2,2.0))—— 它是库「兼容性契约」的机器可读表达**:
#    库侧已立全局约定 —— 同一主版本号内(第一位数字不变,当前 = 1.x)**禁止任何破坏性更新**
#    (不得删/改名任何 public 类型、方法、字段、常量,不得改可见性/签名/语义;只允许新增),
#    破坏性变更必须升第一位(1.x → 2.x)并同步收紧本下界。故区间内任何 1.x 版本都可原位替换,
#    本模组无需为库 1.x 内的升级改动代码。政策原文见库 README §6 与其 gradle.properties 的 1.0.2 条目(契约正文在 1.0.0 条目)。
# ⚠️ **以下为快照时代(1.0.0-SNAPSHOT.*)的历史口径,自 1.0.0 起不再适用,仅供解读旧 pin**:
#    那时下界必须写成 `1.0.0-SNAPSHOT.<序号>` —— 按 Maven ComparableVersion 语义
#    `1.0.0-SNAPSHOT.x < 1.0.0`,写成 [1.0.0,2.0) 会拒绝所有快照版(游戏以「不满足必需前置」拒绝启动);
#    且相邻快照之间二进制不兼容且 modId 相同 —— .1 带旧包名(加载后 NoClassDefFoundError)、
#    .2 带已删除的配置类、.3 缺 effect/ReadyEffect、.4 仍带已删的过渡符号(均编译期找不到符号)、
#    .5 的库 jar 被 FML **在语言匹配阶段直接拒载**(loaderVersion 误填 NeoForge 版本带 ⇒
#    `Missing language javafml version [21.1,21.2) … found 4.0.42`)、`.7` 缺 `pack.mcmeta`。
#    故当时收紧到 [1.0.0-SNAPSHOT.10,2.0) 可让旧 jar 被明确判为「缺必需前置」,而非运行时/编译期崩溃;
#    库侧 `.6` / `.7` 的产物仍留在 mavenLocal,但下界提到 `.10` 后不会再被解析到。
# 区间实测矩阵(快照时代 → 1.x;maven-artifact 3.8.5,两侧加载器均为 VersionRange.createFromVersionSpec):
#   [1.0.0-SNAPSHOT,2.0)    → reject -, accept .1/.2/.3/.4/.5/.6/.7/.10/1.0.0/1.1.0, reject 2.0.0
#   [1.0.0-SNAPSHOT.2,2.0)  → reject .1, accept .2/.3/.4/.5/.6/.7/.10/1.0.0/1.1.0, reject 2.0.0
#   [1.0.0-SNAPSHOT.3,2.0)  → reject .1/.2, accept .3/.4/.5/.6/.7/.10/1.0.0/1.1.0, reject 2.0.0
#   [1.0.0-SNAPSHOT.4,2.0)  → reject .1/.2/.3, accept .4/.5/.6/.7/.10/1.0.0/1.1.0, reject 2.0.0
#   [1.0.0-SNAPSHOT.5,2.0)  → reject .1/.2/.3/.4, accept .5/.6/.7/.10/1.0.0/1.1.0, reject 2.0.0
#   [1.0.0-SNAPSHOT.6,2.0)  → reject .1/.2/.3/.4/.5, accept .6/.7/.10/1.0.0/1.1.0, reject 2.0.0
#   [1.0.0-SNAPSHOT.7,2.0)  → reject .1/.2/.3/.4/.5/.6, accept .7/.10/1.0.0/1.1.0, reject 2.0.0
#   [1.0.0-SNAPSHOT.10,2.0) → reject .1/.2/.3/.4/.5/.6/.7, accept .10/1.0.0/1.1.0, reject 2.0.0
#   [1.0.0-SNAPSHOT.11,2.0) → reject .1/.2/.3/.4/.5/.6/.7/.10, accept .11/1.0.0/1.1.0, reject 2.0.0
#   [1.0.0-SNAPSHOT.12,2.0) → reject .1/.2/.3/.4/.5/.6/.7/.10/.11, accept .12/1.0.0/1.1.0, reject 2.0.0
#   [1.0.0-SNAPSHOT.14,2.0) → reject .1/.2/.3/.4/.5/.6/.7/.10/.11/.12, accept .14/1.0.0/1.1.0, reject 2.0.0
#   [1.0.0,2.0)             → reject 全部 .N(含 .16), accept 1.0.0/1.1.0, reject 2.0.0
#   [1.0.2,2.0)             → reject ≤1.0.1(缺 installExtraHostileProbe), accept 1.0.2/1.1.0, reject 2.0.0   ← **本模组现用值**
# ⚠️ `.11` 的库 jar 缺 `ALLOW_FIREARM_DAMAGE`(否则 NoSuchFieldError)。
# ⚠️ `.12` 的库 jar 缺 `com.merlinkitsune.starenginelib.economy.*`(星币钱包账本,否则运行期 NoClassDefFoundError)。
starengine_lib_version_range=[1.0.2,2.0)


