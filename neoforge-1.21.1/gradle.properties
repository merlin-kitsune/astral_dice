starengine_lib_group=com.merlinkitsune.starenginelib
# ⚠️ **版本区间规则已移除（2026-09-25 用户裁决）**：本文件**不再声明 `starengine_lib_version_range`**，
#    `mods.toml` 也不再写 `versionRange` ⇒ 库前置只按「**是否存在**」判定（FML 对省略 versionRange 的
#    依赖取 `UNBOUNDED`，实测对任意版本均判满足；`type="required"` / `mandatory=true` 仍然生效），
#    版本要求只由上面的 `starengine_lib_version` **一个量**表达（即实际发布版本）。
#    ⇒ 不再存在「第二个量」需要与引脚同步，也就不可能再出现「内嵌件版本 vs 声明区间」不一致的失败。
#    · 内嵌件（build.gradle 的 `jarJar`）由 ModDevGradle 自动派生 metadata.json 的区间为
#      `[<starengine_lib_version>,)`（实测：有下界、无上界、`hasRestrictions()=true`），
#      故同一库出现多份内嵌件时 FML 的 JarInJar 选择器仍能正常解析，无需手工维护。
#    · 🚫 **已作废的旧口径**：此前三线声明 `[<库版本>,2.0)` 并靠它「在加载期拦旧库」；该机制随本次裁决
#      取消。拦旧库改由「不要往 mods 里放独立库 jar」的口径承担（三线 pushToGame 发现即告警）。
# 历史（仅供解读旧 pin，均已作废）：快照时代（`1.0.0-SNAPSHOT.*`）下界曾精确到序号 —— 按 Maven
#    ComparableVersion 语义 `1.0.0-SNAPSHOT.x < 1.0.0`，写成 `[1.0.0,2.0)` 会拒绝所有快照版（游戏以
#    「不满足必需前置」拒绝启动）；且相邻快照二进制不兼容、modId 相同（`.1` 旧包名 / `.2` 带已删配置类 /
#    `.3` 缺 `effect/ReadyEffect` / `.4` 带已删过渡符号 / `.5` 的库 jar 在语言匹配阶段被拒载 /
#    `.7` 缺 `pack.mcmeta` / `.11` 缺 `ALLOW_FIREARM_DAMAGE` / `.12` 缺 `economy` 包），当时只能靠
#    逐档收紧下界让旧 jar 被明确判为「缺必需前置」。区间语义的实测矩阵见 git 历史（本条 2026-09-25 前版本）。


